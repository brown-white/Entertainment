    const its = live.filter(i => i.type === ty); if (!its.length) continue;
    const ok = staff.filter(s => its.some(i => !PERMISSION_REASONS.includes(rule.get(i.id + '|' + s.id))));
    if (ok.length) balance[ty] = ok.map(s => ({ staff_id: s.id, n: (byPerson.get(s.id) || []).filter(e => e.inRange && e.type === ty).length })).sort((a, b) => a.n - b.n);
  }
  /* the plan's score, from the plan itself (the same measures for every plan) */
  const required = plannable.reduce((x, it) => x + it.staff_needed, 0);
  const covered = plannable.reduce((x, it) => x + Math.min(it.staff_needed, (onItem.get(it.id) || []).length), 0);
  let assigns = 0, consecutive = 0, unavoidable = 0, sameTime = 0, repeats = 0, repeatsNeeded = 0;
  for (const sid of staffIds) {
    const es = (byPerson.get(sid) || []).filter(e => e.inRange && e.itemId != null && view.get(e.itemId) && !view.get(e.itemId).locked);
    const count = {};
    for (const e of es) {
      assigns++; count[e.key] = (count[e.key] || 0) + 1;
      const all = byPerson.get(sid);
      if (all.some(x => x.key === e.key && x.dn === e.dn - 1)) {
        consecutive++;
        if (!repeatFree(view.get(e.itemId), e)) unavoidable++;
      }
      if (all.some(x => x.st === e.st && x.dn === e.dn - 1)) sameTime++;
    }
    const rep = Object.values(count).reduce((x, n) => x + Math.max(0, n - 1), 0);
    // repeats nobody can avoid: more assignments than different activities this person may do
    const kinds = new Set(plannable.filter(it => !rule.get(it.id + '|' + sid)).map(it => view.get(it.id).key)).size;
    repeats += rep; repeatsNeeded += Math.min(rep, Math.max(0, es.length - kinds));
  }
  // fairness: how evenly the work is spread over the people available for it (1 − Gini of work per working day)
  const people = staffIds.filter(sid => plannable.some(it => !rule.get(it.id + '|' + sid)));
  const per = people.map(sid => loadOf(sid) / Math.max(1, avail.get(sid) ?? nDays));
  const mean = per.length ? per.reduce((a, b) => a + b, 0) / per.length : 0;
  let gini = 0; if (mean > 0) { for (const a of per) for (const b of per) gini += Math.abs(a - b); gini /= 2 * per.length * per.length * mean; }

  const score = { required, covered, coverage: pct(covered, required), assigns, consecutive, unavoidable, rotation: pct(assigns - (consecutive - unavoidable), assigns),
    fairness: Math.round(100 * (1 - gini)), repeats, repeatsNeeded, sameTime };
  const extra = repeats - repeatsNeeded;   // repeats the plan could have avoided
  score.repetition = extra === 0 ? 'none' : extra <= assigns * 0.1 ? 'low' : extra <= assigns * 0.25 ? 'medium' : 'high';
  return { rows, unfilled, empty, filled: rows.length, missing: unfilled.reduce((a, u) => a + u.missing, 0), warnings, balance, explain, score, profile: input.profile || 'A',
    replace: mode === 'replan' ? plannable.map(i => i.id) : null, canStaffBeAssigned, itemById };
}

  const sig = r => r.rows.map(x => x.item_id + ':' + x.staff_id).sort().join(',');

  current = { key, arg };
  const seq = ++routeSeq;
  const view = $('#view');

  renderNav();

  const left = it.capacity > 0 ? Math.max(0, it.capacity - (+it.booked || 0)) : null;
  const staff = (it.staff || []).map(x => x.name).join(', ');
  let pill = '';
  if (S.mode === 'guest' && it.status === 'scheduled') {
    const b = myBooking(it);
    if (b) pill = `<span class="pill ok">${esc(t(b.status === 'waiting' ? 'waiting_list' : 'booked'))}</span>`;
    else if (it.booking_required) pill = left === 0 ? `<span class="pill bad">${esc(t('full'))}</span>` : `<span class="pill go">${esc(t('book'))}</span>`;
    else if (it.ticketed) pill = `<span class="pill go">${esc(t('tickets'))}</span>`;
  }
  return `<a class="item t-${esc(it.type)} ${it.highlight ? 'hl' : ''} ${it.status === 'cancelled' ? 'cancelled' : ''}" href="#/${go}/${it.id}">
    <time>${esc(hm(it.start_time))}${it.end_time ? `<small>${esc(hm(it.end_time))}</small>` : ''}</time>
    <div class="grow"><b>${esc(itemName(it))}</b><span class="meta"><span class="ty-badge">${ico(TYPE_ICONS[it.type] || 'sun')}${esc(typeLabel(it.type))}</span>${itemCats(it).map(c => ' ' + catChip(c)).join('')}${it.location ? ' ' + esc(it.location) : ''}${staff ? ' · ' + esc(staff) : ''}</span>
    ${it.status === 'cancelled' ? chip(t('cancelled'), 'bad') : ''}${S.mode !== 'guest' && it.booking_required && left != null ? chip(left ? t('places_left', { n: left }) : t('full'), left ? '' : 'bad') : ''}
    ${S.mode === 'guest' && it.booking_required && left && !myBooking(it) ? `<small class="muted">${esc(t('places_left', { n: left }))}</small>` : ''}${S.mode === 'guest' && isFav(it) ? `<span class="fav on" aria-label="${esc(t('favourite_remove'))}">${ico('heart', 'fill')}</span>` : ''}</div>${pill}</a>`;
}

page('g_pack', {
  mode: 'guest', title: 'get_tickets', heading: arg => { const it = gItem(arg); return it ? itemName(it) : t('get_tickets'); },
  render: async arg => {
    const it = gItem(arg); if (!it) return empty(t('not_found'));
    if (!signedIn()) return empty(t('sign_in_for_tickets'), `<a class="btn" href="#/g_stay">${esc(t('sign_in'))}</a>`);
    const { packs } = await rpc('guest_packs', { p_key: S.g.key, p_item_id: it.id });
    if (!packs.length) return empty(t('no_packs_yet'));
    const pk = packs.find(p => p.id === gPick.pack) || null;
    const pickHtml = packs.map(p => `<button class="pack ${pk && pk.id === p.id ? 'on' : ''}" data-act="g_pack_pick" data-id="${p.id}">${avatar(p.photo_url, p.staff)}<span><b>${esc(p.staff)}</b><small>${esc(p.type)} · ${esc(money(p.price))}${(p.offers || []).map(o => ' · ' + esc(t('offer_x_for', { n: o.qty, price: money(o.price) }))).join('')}</small></span></button>`).join('');
    let grid = '';
    if (pk) {
      const taken = new Set(pk.taken);
      const nums = []; for (let n = pk.number_from; n <= pk.number_to && nums.length < 1000; n++) nums.push(n);
      grid = `<p class="muted">${esc(t('pick_numbers', { max: gSet().ticket_max || 10 }))}</p><div class="numgrid">${nums.map(n => `<button ${taken.has(n) ? 'disabled' : ''} class="${gPick.nums.includes(n) ? 'on' : ''}" data-act="g_num" data-n="${n}">${String(n).padStart(pk.digits || 1, '0')}</button>`).join('')}</div>
        <div class="sticky-act"><span>${esc(t('selected_n', { n: gPick.nums.length }))}</span><button class="btn" data-act="g_reserve" data-id="${pk.id}" data-item="${it.id}" ${gPick.nums.length ? '' : 'disabled'}>${esc(t('reserve'))}</button></div>`;
    }
    return `<p class="muted">${esc(t('choose_entertainer'))}</p><div class="packs">${pickHtml}</div>${grid}`;
  }
});

ACT.lightbox = el => {
  const imgs = $$('img[data-act=lightbox]', el.closest('.page') || document); let i = imgs.indexOf(el);
  const m = modal('', `<div class="lightbox"><img src="${esc(el.src)}" alt=""><p>${esc(el.alt || '')}</p>${imgs.length > 1 ? `<div class="row"><button class="btn ghost" data-lb="-1">‹</button><button class="btn ghost" data-lb="1">›</button></div>` : ''}</div>`, { wide: true, noFocus: true });
  m.root.onclick = ev => { const b = ev.target.closest('[data-lb]'); if (!b) return; i = (i + +b.dataset.lb + imgs.length) % imgs.length; $('img', m.root).src = imgs[i].src; $('p', m.root).textContent = imgs[i].alt || ''; };
};
const WX = c => (c === 0 ? ['sun', 'wx_clear'] : c <= 3 ? ['partly', 'wx_cloudy'] : c <= 48 ? ['fog', 'wx_fog'] : c <= 67 ? ['rain', 'wx_rain'] : c <= 77 ? ['snow', 'wx_snow'] : c <= 82 ? ['rain', 'wx_showers'] : ['storm', 'wx_storm']);
async function weatherInto(el, lat, lon, mini) {
  if (!el || !lat) return;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto&forecast_days=5`);
    const w = await r.json(); const c = w.current; const [ic, k] = WX(c.weather_code);
    el.innerHTML = `<div class="card weather"><div class="now"><span class="wx">${ico(ic, 'wx')}</span><b>${Math.round(c.temperature_2m)}°</b><span>${esc(t(k))} · ${esc(t('wind'))} ${Math.round(c.wind_speed_10m)} km/h</span></div>
      ${mini ? '' : `<div class="days">${w.daily.time.map((d, i) => `<div><small>${esc(D.fmt(d, { weekday: 'short' }))}</small><span>${ico(WX(w.daily.weather_code[i])[0], 'wx')}</span><b>${Math.round(w.daily.temperature_2m_max[i])}°</b><small>${Math.round(w.daily.temperature_2m_min[i])}° · UV ${Math.round(w.daily.uv_index_max[i])}</small></div>`).join('')}</div>`}</div>`;
  } catch { el.innerHTML = ''; }
}

/* Today at a glance: the hotel's day + what happens today + who is where (every staff member sees it) */
function glanceCard(b, d, myS, plan) {
  const di = dayOf(b.days, d), its = b.items.filter(i => i.date === d && i.status === 'scheduled');
  const of = ty => its.filter(i => i.type === ty).map(i => hm(i.start_time) + ' ' + itemName(i)).join(' · ');
  const who = (f, extra = () => '') => b.status.filter(x => x.date === d && f(x)).map(x => { const n = b.staff.find(p => p.id === x.staff_id)?.display_name; return n ? n + extra(x) : ''; }).filter(Boolean).join(', ');
  const row = (icon, label, value, none) => `<div class="g-row">${ico(icon)}<span>${esc(label)}</span><b class="${value ? '' : 'none'}">${esc(value || none)}</b></div>`;
  return `<div class="card glance"><div class="glance-head"><div><small>${esc(D.long(d))}</small><b>${esc(dayName(di) || t('today'))}</b></div>${myS ? stChip(myS) : ''}</div>
    ${row('dish', t('restaurant_theme'), restName(di), t('not_set'))}${plan.dress_code ? row('user', t('dress_code'), plan.dress_code) : ''}
    ${row('sparkle', t('events_today'), of('event'), t('no_event_today'))}${row('mask', t('shows_today'), of('show'), t('no_show_today'))}
    ${row('music', t('live_music_today'), of('live_music'), t('no_live_music_today'))}${of('special_event') ? row('star', t('type_special_event'), of('special_event')) : ''}
    ${row('door', t('entrance_today'), who(x => x.entrance && x.status === 'working', x => x.entrance_at ? ' ' + x.entrance_at : ''), t('nobody'))}${row('moon', t('day_off_today'), who(x => x.status === 'day_off'), t('nobody'))}
    ${plan.notes ? `<p class="prose">${nl2br(plan.notes)}</p>` : ''}${myS?.entrance ? `<p class="muted small">${esc(t('entrance_window', { a: myS.entrance_at || '', b: myS.leave_op || '' }))}</p>` : ''}</div>`;
}

/* clock in / out: one card, server time, own row only */
function clockCard(b, me, d) {
  const ck = (b.clock || []).filter(x => x.staff_id === me);
  const k = ck.find(x => x.check_in && !x.check_out && Date.now() - new Date(x.check_in) < 18 * 36e5) || ck.find(x => x.date === d) || {};   // a night shift may have started yesterday
  return `<div class="card clock row">${ico('clock')}${k.check_in ? `<span>${esc(t('clocked_in_at', { time: clockTime(k.check_in) }))}</span>` : `<span class="muted">${esc(t('not_clocked'))}</span>`}
    ${k.check_out ? `<span>${esc(t('clocked_out_at', { time: clockTime(k.check_out) }))}</span>` : ''}<span class="grow"></span>
    ${!k.check_in ? `<button class="btn" data-act="clock" data-a="in">${esc(t('clock_in_btn'))}</button>` : !k.check_out ? `<button class="btn ghost" data-act="clock" data-a="out">${esc(t('clock_out_btn'))}</button>` : ''}</div>`;
}

function reqList(rows, nm, decide) {
  return `<div class="list">${rows.map(r => `<div class="li"><b>${esc(t('rk_' + r.kind))}</b> ${chip(t('rs_' + r.status), r.status === 'approved' ? 'ok' : r.status === 'rejected' ? 'bad' : '')}

    ${p.status === 'open' ? `<div class="actions"><button class="btn ghost small" data-act="ts_add" data-id="${p.id}">${esc(t('sell_tickets'))}</button>${mine ? '' : `<button class="btn ghost small" data-act="tp_pay" data-id="${p.id}">${esc(t('money_handed_in'))}</button><button class="btn ghost small" data-act="tp_settle" data-id="${p.id}">${esc(t('settle'))}</button>`}</div>` : ''}</section>`;

async function sgEnd(id) {

  s.score = Math.max(0, before + +el.dataset.d);

  if (g.target && s.score >= g.target && before < g.target && await confirmBox(t('reached_target', { name: s.name, n: g.target }), t('finish_game'))) return sgEnd(g.id);
  route();
};
ACT.sg_undo = async el => {

};

const CRUD = {};
function crudList(key, cfg) {
  CRUD[key] = cfg;
  return async () => {
    const rows = await list(cfg.entity, cfg.filter ? cfg.filter() : {});
    cfg.rows = rows;
    const mv = (r, i) => cfg.sortable ? `<span class="move"><button class="icon-btn" data-act="crud_move" data-k="${key}" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="${esc(t('move_up'))}">${ico('up')}</button><button class="icon-btn" data-act="crud_move" data-k="${key}" data-i="${i}" data-d="1" ${i === rows.length - 1 ? 'disabled' : ''} aria-label="${esc(t('move_down'))}">${ico('down')}</button></span>` : '';
    return `${cfg.intro ? `<p class="hint-box">${ico('info')}<span>${esc(cfg.intro)}</span></p>` : ''}<p class="row"><span class="grow"></span>${cfg.extra || ''}<button class="btn small" data-act="crud_new" data-k="${key}">${ico('plus')} ${esc(t('add'))}</button></p>`
      + (rows.length ? `<div class="list">${rows.map((r, i) => `<div class="li crud-row"><button class="li-main" data-act="crud_edit" data-k="${key}" data-id="${r.id}">${cfg.row(r)}</button>${mv(r, i)}</div>`).join('')}</div>` : empty(t('nothing_yet')));
  };
}
const crudDone = async c => { if (c.after) await c.after(); route(); };
ACT.crud_new = el => { const c = CRUD[el.dataset.k]; editForm(t('add'), c.fields(), c.defaults ? c.defaults() : {}, async r => { if (c.sortable) r.sort = (c.rows || []).length; await save(c.entity, c.before ? c.before(r) : r); await crudDone(c); }); };
ACT.crud_edit = el => {
  const c = CRUD[el.dataset.k]; const row = c.rows.find(x => x.id === +el.dataset.id); if (!row) return;
  editForm(t('edit'), c.fields(), c.load ? c.load(row) : row, async r => { await save(c.entity, c.before ? c.before(r) : r); await crudDone(c); },
    { danger: async () => { const j = await del(c.entity, row.id); toast(j.archived ? t('archived_instead') : t('deleted'), j.archived ? 'warn' : 'ok'); await crudDone(c); } });
};
/* the ONE way to change an order: arrows (rows are renumbered 0, 1, 2 …) */
ACT.crud_move = async el => {
  const c = CRUD[el.dataset.k]; const i = +el.dataset.i, j = i + +el.dataset.d; const rows = c.rows.slice(); if (j < 0 || j >= rows.length) return;
  [rows[i], rows[j]] = [rows[j], rows[i]];
  for (const [n, r] of rows.entries()) if (r.sort !== n) await save(c.entity, { id: r.id, sort: n });
  await crudDone(c);
};

/* ---------- Attendance: ONE page on the day status + clock times (payroll uses the same count) ---------- */
const monthEnd = m => D.add(D.add(m + '-01', 32).slice(0, 7) + '-01', -1);
/* the days that really count for a person: from the first working day, never after today or the last day */
function workWindow(p, from, to) {
  let a = from, z = to < D.today() ? to : D.today();
  if (p.start_date && p.start_date > a) a = p.start_date;
  if (p.end_date && p.end_date < z) z = p.end_date;
  return a <= z ? [a, z] : null;
}
function attendanceSummary(p, b, from, to) {
  const w = workWindow(p, from, to); const inW = d => !!w && d >= w[0] && d <= w[1];
  const st = b.status.filter(x => x.staff_id === p.id && inW(x.date)), ck = (b.clock || []).filter(k => k.staff_id === p.id && inW(k.date));
  const n = s => st.filter(x => x.status === s).length;
  const hours = sum(ck.filter(k => k.check_in && k.check_out), k => (new Date(k.check_out) - new Date(k.check_in)) / 36e5);
  return { worked: n('working'), off: n('day_off'), vac: n('vacation'), absent: n('absent'), sick: n('sick'), clocked: ck.filter(k => k.check_in).length,
    hours: Math.round(hours * 10) / 10, days: w ? D.range(w[0], 400).indexOf(w[1]) + 1 : 0, window: w, tracked: st.length > 0 };
}

      atCache = people.map(p => Object.assign({ p, name: p.display_name, number: p.staff_number }, attendanceSummary(p, b, from, to)));
      const cell = (p, d) => {
        const out = (p.start_date && d < p.start_date) || (p.end_date && d > p.end_date), fut = d > today, s = statusOf(b, p.id, d);

    }
    if (tab === 'bookings') {
      bkDay = bkDay || today;
      const items = (await list('program_items', { date: bkDay })).filter(i => i.booking_required);
      const books = items.length ? await list('bookings', { item_id: items.map(i => i.id) }) : [];

      const st = id => stays.find(s => s.id === id) || {};
      bkCache = { items, books, st };
      return head + dayStrip(bkDay, D.add(today, -3), 14, 'bk_day') + (items.length ? items.map(i => {
        // places taken = booked + attended (same rule as the database); waiting guests are listed after them and hold no place
        const bs = books.filter(b => b.item_id === i.id && b.status !== 'cancelled').sort((x, y) => (x.status === 'waiting') - (y.status === 'waiting'));
        return `<section class="card"><h2>${esc(hm(i.start_time))} ${esc(itemName(i))} <small class="muted">${sum(bs.filter(b => b.status !== 'waiting'), b => b.seats)}${i.capacity ? '/' + i.capacity : ''}</small></h2>
        ${bs.length ? `<div class="list">${bs.map(b => `<div class="li row"><b>${esc(st(b.stay_id).room || '')}</b> ${esc(st(b.stay_id).name || '')} · ${b.seats}<span class="grow"></span>${b.status === 'attended' ? chip(t('attended'), 'ok') : b.status === 'waiting' ? chip(t('waiting_list'), 'warn') : `<button class="btn ghost small" data-act="bk_set" data-id="${b.id}" data-s="attended">${esc(t('attended'))}</button>`}<button class="btn ghost small" data-act="bk_set" data-id="${b.id}" data-s="cancelled">${esc(t('cancel'))}</button></div>`).join('')}</div>` : `<p class="muted">${esc(t('no_bookings'))}</p>`}
        ${bs.length ? `<button class="btn ghost small" data-act="bk_print" data-id="${i.id}">${esc(t('print_pdf'))}</button>` : ''}</section>`; }).join('') : empty(t('no_bookable_items')));
    }
    // guests in house and arriving are always loaded (as many as the rooms); departed guests (kept 45 days) only when asked for
    const F = { house: g => g.arrival <= today && g.departure >= today, arriving: g => g.arrival > today, departed: g => g.departure < today, all: () => true };
    const past = ['departed', 'all'].includes(guF);
    const [cur, old] = await Promise.all([list('guest_stays', { _from: today, _limit: 5000 }), past ? list('guest_stays', { _to: D.add(today, -1), _limit: 5000 }) : []]);
    const rows = cur.concat(old), r = rows.filter(F[guF]); stayCache = rows;
    return head + `<div class="chips">${['house', 'arriving', 'departed', 'all'].map(k => `<button class="chip-btn ${guF === k ? 'on' : ''}" data-act="gu_f" data-k="${k}">${esc(t('gf_' + k))}${['departed', 'all'].includes(k) && !past ? '' : ` (${rows.filter(F[k]).length})`}</button>`).join('')}
      <span class="grow"></span><button class="btn ghost small" data-act="gu_xlsx">${esc(t('excel'))}</button><button class="btn small" data-act="gu_new">${esc(t('add_stay'))}</button></div>
      ${S.settings.guest_signin_mode === 'list' ? `<p class="muted small">${esc(t('list_mode_note'))}</p>` : ''}
      ${r.length ? tableWrapClick(r) : empty(t('no_guests'))}<p class="muted small">${esc(t('privacy_45'))}</p>`;
  }
});

/* ---------- ONE ticket system: one list of ticket types, one print-run record, a design per game ---------- */
const TK_DIM = { tombola: [150, 64], bingo: [150, 86], disco: [150, 64], other: [150, 70] };
const TK_SHOW = ['logo', 'photo', 'date', 'time', 'place', 'price', 'included', 'guest', 'room', 'number', 'text'];
const tkDim = type => TK_DIM[type.game] || TK_DIM.other;
const tkPerm = k => can('m_tickets') || can(k);
const rndN = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const shuffleR = a => { for (let i = a.length - 1; i > 0; i--) { const j = rndN(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/* a valid 90-ball card: 3 rows × 9 columns, 5 numbers in each row, 15 numbers, columns 1–9, 10–19 … 80–90 */
function bingoNew() {
  for (;;) {
    const cnt = Array(9).fill(1); let extra = 6; while (extra) { const c = rndN(9); if (cnt[c] < 3) { cnt[c]++; extra--; } }
    const grid = [Array(9).fill(0), Array(9).fill(0), Array(9).fill(0)], rowN = [0, 0, 0];
    let ok = true;
    for (const c of shuffleR([...Array(9).keys()]).sort((a, b) => cnt[b] - cnt[a])) {
      const rows = shuffleR([0, 1, 2].filter(r => rowN[r] < 5)).sort((a, b) => rowN[a] - rowN[b]).slice(0, cnt[c]);
      if (rows.length < cnt[c]) { ok = false; break; } rows.forEach(r => { grid[r][c] = 1; rowN[r]++; });
    }
    if (!ok || rowN.some(x => x !== 5)) continue;
    for (let c = 0; c < 9; c++) {
      const lo = c ? c * 10 : 1, hi = c === 8 ? 90 : c * 10 + 9, pool = []; for (let v = lo; v <= hi; v++) pool.push(v);
      const picks = shuffleR(pool).slice(0, cnt[c]).sort((a, b) => a - b); let k = 0; for (let r = 0; r < 3; r++) if (grid[r][c]) grid[r][c] = picks[k++];
    }
    return grid.flat();
  }
}
const bingoSig = g => g.filter(Boolean).sort((a, b) => a - b).join('-');
const cardCode = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0).toString(36).toUpperCase().padStart(6, '0').slice(-6); };

/* the issued cards of this bingo game + event: numbers printed before keep their card, new numbers get a card never used before */
async function bingoCards(type, itemId, batch, nums) {
  const prints = (await list('ticket_prints', { ticket_type_id: type.id, _limit: 2000 })).filter(p => (p.item_id || null) === (itemId || null));
  const keep = new Map(), used = new Set();
  prints.forEach(p => (p.cards || []).forEach(cd => { if (p.batch === batch) keep.set(+cd.n, cd); used.add(cd.s); }));
  return nums.map(n => { if (keep.has(n)) return keep.get(n); let g, s; do { g = bingoNew(); s = bingoSig(g); } while (used.has(s)); used.add(s); return { n, s, g }; });
}

async function studioView() {

}
const PER_PAGE = [1, 2, 3, 4, 6, 8, 10, 12, 16, 20, 24];
const studioFields = () => [{ k: 'ticket_type_id', type: 'select', label: t('ticket_types'), num: true, options: opts(studioCache.types, 'id', x => x.name + ' · ' + t('game_' + x.game)) },
  { k: 'item_id', type: 'select', label: t('event'), num: true, options: opts(studioCache.items, 'id', i => itemName(i) + ' · ' + D.short(i.date) + ' ' + hm(i.start_time), t('none')), hint: t('ticket_event_hint') },
  { k: 'batch', label: t('batch'), req: true, hint: t('batch_hint') }, { k: 'number_from', type: 'number', label: t('number_from'), req: true }, { k: 'number_to', type: 'number', label: t('number_to'), req: true },
  { k: 'title', label: t('ticket_title'), hint: t('ticket_title_hint') },
  { type: 'section', label: t('for_one_guest'), hint: t('for_one_guest_hint') }, { k: 'guest_name', label: t('guest_name') }, { k: 'room', label: t('room') },
  { type: 'section', label: t('paper_layout') }, { k: 'paper', type: 'select', label: t('paper'), options: [['a4', 'A4'], ['a5', 'A5'], ['letter', 'Letter'], ['item', t('paper_ticket')]] },
  { k: 'orient', type: 'select', label: t('orientation'), options: [['portrait', t('portrait')], ['landscape', t('landscape')]] },
  { k: 'per_page', type: 'select', label: t('per_page'), num: true, options: PER_PAGE.map(n => [n, String(n)]) }];
async function studioRun(save) {
  const f = readForm($('#studio'), studioFields()); const type = studioCache.types.find(x => x.id === f.ticket_type_id); const it = studioCache.items.find(i => i.id === f.item_id);
  if (!type) return toast(t('add_type_first'), 'bad');
  if (f.number_to < f.number_from || f.number_to - f.number_from > 1999) return toast(t('err_range'), 'bad');
  const all = []; for (let n = f.number_from; n <= f.number_to; n++) all.push(n);
  const [dw, dh] = tkDim(type), L = sheetLayout(f.paper, f.orient, f.per_page, dw, dh);

  if (save) {
    if (type.game !== 'bingo') {
      const clash = studioCache.prints.filter(p => p.ticket_type_id === type.id && p.batch === f.batch && (p.item_id || null) === (f.item_id || null) && p.number_from <= f.number_to && f.number_from <= p.number_to);

    const row = () => ({ ticket_type_id: type.id, item_id: f.item_id || null, batch: f.batch, number_from: f.number_from, number_to: f.number_to, layout: { paper: f.paper, orient: f.orient, per_page: f.per_page }, cards: cards ? cards.map(x => ({ n: x.n, s: x.s, g: x.g })) : [] });

    catch (e) { if (type.game !== 'bingo' || e.code !== 'bingo_duplicate') throw e; cards = await bingoCards(type, f.item_id || null, f.batch, nums); await api('ticket_print_save', { p_row: row() }); }

  if (!save) {
    $('#tk-preview').innerHTML = `<h3>${esc(t('preview'))}</h3><p class="muted small">${esc(t('layout_info', { n: L.cells.length, w: Math.round(L.w), h: Math.round(L.h), pages: Math.ceil(all.length / L.cells.length), paper: Math.round(L.W) + ' × ' + Math.round(L.H) + ' mm' }))}</p><div class="sheet-prev">${pages[0]}</div>`;
    return;

ACT.studio_preview = () => studioRun(false).catch(fail);

/* the ONE payroll calculation (manager payroll, payslips, My pay) */
function payrollCalc(person, rates, entries, b, month) {
  const from = month + '-01', to = monthEnd(month), dim = +to.slice(8);
  const rt = rates.find(r => r.staff_id === person.id) || {}; const en = entries.filter(e => e.staff_id === person.id);
  const a = attendanceSummary(person, b, from, to);
  const salary = +rt.monthly_salary || 0, dayRate = +rt.day_rate || (dim ? salary / dim : 0), cur = rt.currency || S.hotel?.currency || 'EUR';
  const earned = Math.round(salary * a.days / dim * 100) / 100;                       // only the days that really passed
  const bonus = sum(en.filter(e => e.kind === 'bonus'), e => e.amount), ded = sum(en.filter(e => e.kind === 'deduction'), e => e.amount), adv = sum(en.filter(e => e.kind === 'advance'), e => e.amount);
  const absDed = Math.round(a.absent * dayRate * 100) / 100;
  return Object.assign({ s: person, rt, en, cur, salary, dim, dayRate, earned, bonus, ded, adv, absDed, net: Math.round((earned + bonus - ded - adv - absDed) * 100) / 100 }, a);
}

page('menu', {

      <div class="mb-list" id="mb">${mbRows(guest)}</div><p><button class="btn" data-act="mb_save">${esc(t('save'))}</button></p>`;

const mbRows = guest => mbList.map((p, i) => `<div class="mb-row" data-mb="${esc(p.key)}"><span class="mi">${ico(p.icon)}</span><div class="grow"><b>${esc(p.label)}</b><input data-f="label" value="${esc(p.own)}" placeholder="${esc(t('own_label'))}" aria-label="${esc(t('own_label'))} – ${esc(p.label)}"></div>
  <span class="move"><button class="icon-btn" data-act="mb_move" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="${esc(t('move_up'))}">${ico('up')}</button><button class="icon-btn" data-act="mb_move" data-i="${i}" data-d="1" ${i === mbList.length - 1 ? 'disabled' : ''} aria-label="${esc(t('move_down'))}">${ico('down')}</button></span>
  ${guest ? '' : `<label class="mb-hide"><input data-f="hidden" type="checkbox" ${p.hide ? 'checked' : ''}> ${esc(t('hide_in_menu'))}</label>`}</div>`).join('');
function mbSync() { $$('#mb .mb-row').forEach((r, i) => { mbList[i].own = $('[data-f=label]', r).value.trim(); mbList[i].hide = !!$('[data-f=hidden]', r)?.checked; }); }
ACT.mb_role = el => { mbRole = el.value; route(); };
ACT.mb_move = el => { mbSync(); const i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= mbList.length) return; [mbList[i], mbList[j]] = [mbList[j], mbList[i]]; $('#mb').innerHTML = mbRows(mbRole === 'guest'); };
ACT.mb_save = async () => {
  mbSync();
  for (const [i, p] of mbList.entries()) {
    const old = mbCache.find(x => x.page_key === p.key);
    if (old && old.sort === i && (old.label || '') === p.own && !!old.hidden === p.hide) continue;   // unchanged
    await save('menu_config', Object.assign(old ? { id: old.id } : {}, { audience: mbRole, page_key: p.key, label: p.own || null, hidden: p.hide, sort: i }));
  }
  toast(t('saved')); await loadMe(); renderShell(); route();
};

        ${imp.rows ? `<section><h2>${esc(t('imp_rows', { n: imp.rows.length, bad: st.bad }))}</h2><div class="tablewrap">${tableHtml(['#'].concat(IMPORTS[imp.kind].head, ['']), imp.rows.slice(0, 200).map(r => [r.n].concat(IMPORTS[imp.kind].head.map(h => r.data[h] || ''), [{ html: r.done ? chip('✓', 'ok') : r.err ? chip(r.err, 'bad') : chip('OK', 'ok') }])))}</div>
          ${st.ok && !imp.result ? `<p><button class="btn" data-act="imp_go">${esc(t('imp_go', { n: st.ok }))}</button></p>` : ''}</section>` : ''}
        ${imp.result ? `<div class="card"><p>${esc(t('imp_done', { ok: imp.result.ok, bad: imp.result.bad }))}</p>${imp.result.passwords.length ? `<p><button class="btn" data-act="imp_pw">${esc(t('imp_passwords'))}</button></p>` : ''}</div>` : ''}`;
    }

      ${rst ? `<p>${esc(t('rst_summary', { hotel: rst.backup.hotel?.name || '?', date: D.stamp(rst.backup.exported_at), n: rst.count }))}</p>

/* ---- import: every row goes through the same save function the forms use ---- */
let imp = { kind: null, rows: null, result: null }, rst = null;
const IMPORTS = {
  staff: { perm: 'm_staff', head: ['name', 'username', 'password', 'number', 'team', 'role', 'gender', 'nationality', 'phone', 'email'],
    example: () => ({ name: 'Sara Example', username: 'sara', password: '', number: '', team: S.team?.name || '', role: (S.roles.find(r => !r.is_manager) || {}).name || '', gender: 'female', nationality: '', phone: '', email: '' }) },
  programme: { perm: 'm_program', head: ['type', 'name', 'weekdays', 'start', 'end', 'location', 'description', 'capacity', 'booking', 'staff_needed', 'team'],
    example: () => ({ type: 'activity', name: 'Aqua gym', weekdays: 'Mon,Wed,Fri', start: '10:00', end: '10:45', location: 'Main pool', description: '', capacity: '0', booking: 'no', staff_needed: '1', team: S.team?.name || '' }) },
  rooms: { perm: 'm_guests', head: ['room'], example: () => ({ room: '101-120' }) },
  stays: { perm: 'm_guests', head: ['room', 'name', 'arrival', 'departure', 'nationality', 'phone'], example: () => ({ room: '101', name: 'Anna Müller', arrival: D.today(), departure: D.add(D.today(), 7), nationality: '', phone: '' }) }
};
const yes = v => /^(1|y|yes|true|x|ja|oui|si|sí|da|evet|tak|ano|áno)$/i.test(String(v || '').trim());
function impCheck(kind, rows) {
  const low = v => String(v || '').trim().toLowerCase();
  const team = v => { if (!String(v || '').trim()) return { id: S.team?.id }; const x = S.teams.find(z => low(z.name) === low(v)); return x ? { id: x.id } : { err: t('err_team') }; };
  return rows.map((d, i) => {
    const out = { n: i + 2, data: d };
    try {
      if (kind === 'staff') {
        const role = S.roles.find(r => low(r.key) === low(d.role) || low(r.name) === low(d.role));
        const tm = team(d.team); const num = String(d.number || '').trim();
        if ((d.name || '').trim().length < 2) throw t('err_name');
        if (!/^[a-z0-9._-]{3,30}$/.test(low(d.username))) throw t('err_username');
        if (!role || (role.is_manager && !S.me.is_manager)) throw t('err_role');
        if (tm.err) throw tm.err;
        if (num && !(/^\d+$/.test(num) && +num >= 1 && +num <= 50)) throw t('err_number_range');
        if (d.password && d.password.length < 6) throw t('err_password_short');
        const g = low(d.gender); const gender = g.startsWith('m') ? 'male' : g.startsWith('f') || g.startsWith('w') ? 'female' : null;
        out.args = { p_row: { display_name: d.name.trim(), username: low(d.username), staff_number: num ? +num : null, team_id: tm.id, role_id: role.id, gender, nationality: d.nationality || null, phone: d.phone || null, email: d.email || null, status: 'active' }, p_password: d.password || Math.random().toString(36).slice(2, 10), p_skills: [], p_overrides: {} };
      } else if (kind === 'programme') {
        const ty = TYPES.find(x => low(x) === low(d.type) || low(typeLabel(x)) === low(d.type) || low(x.replace('_', ' ')) === low(d.type));
        if (!ty) throw t('err_type');
        const one = w => /^[1-7]$/.test(w) ? +w - 1 : [0, 1, 2, 3, 4, 5, 6].find(i => [D.wdName(i, 'long'), D.wdName(i, 'short'), ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'][i], ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][i]].map(low).includes(w));
        const wl = low(d.weekdays || d.weekday);
        const wd = ['daily', 'every day', 'all', '*', low(t('every_day'))].includes(wl) ? [0, 1, 2, 3, 4, 5, 6] : uniq(wl.split(/[\s,;/+]+/).filter(Boolean).map(one));
        if (!wd.length || wd.some(x => x == null)) throw t('err_weekday');
        const tmv = s2 => { const m = String(s2 || '').trim().match(/^(\d{1,2})[:.](\d{2})/); return m && +m[1] < 24 && +m[2] < 60 ? String(m[1]).padStart(2, '0') + ':' + m[2] : null; };
        if (!tmv(d.start) || (d.end && !tmv(d.end))) throw t('err_time');
        if ((d.name || '').trim().length < 2) throw t('err_name');
        const tm = team(d.team); if (tm.err) throw tm.err;
        out.args = { p_row: { type: ty, name: d.name.trim(), weekdays: wd, start_time: tmv(d.start), end_time: d.end ? tmv(d.end) : null, location: d.location || null, description: d.description || null,
          capacity: +d.capacity || 0, booking_required: yes(d.booking), staff_needed: d.staff_needed === '' || d.staff_needed == null ? 1 : +d.staff_needed || 0, team_id: tm.id, active: true } };
      } else if (kind === 'stays') {
        const dt = v => { const x = String(v || '').trim(); const m = x.match(/^(\d{4})-(\d{2})-(\d{2})$/) || x.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/); if (!m) return null; return m[1].length === 4 ? `${m[1]}-${m[2]}-${m[3]}` : `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; };
        if (!String(d.room || '').trim()) throw t('err_room');
        if ((d.name || '').trim().length < 2) throw t('err_name');
        const a1 = dt(d.arrival), a2 = dt(d.departure); if (!a1 || !a2 || a2 < a1) throw t('err_dates');
        out.args = { p_entity: 'guest_stays', p_row: { room: String(d.room).trim(), name: d.name.trim(), arrival: a1, departure: a2, nationality: countryCode(d.nationality) || null, phone: d.phone || null } };
      } else {
        if (!String(d.room || '').trim()) throw t('err_room');
        out.args = { p_text: String(d.room).trim() };
      }
    } catch (e) { out.err = typeof e === 'string' ? e : errText(e); }
    return out;
  });
}
ACT.imp_kind = el => { imp = { kind: el.dataset.k, rows: null, result: null }; route(); };
ACT.imp_template = () => download('aurea-' + imp.kind + '.csv', toCsv([IMPORTS[imp.kind].example()]), 'text/csv');
ACT.imp_go = async el => {
  el.disabled = true; const res = { ok: 0, bad: 0, passwords: [] };

ACT.bk_json = async () => { const j = await api('backup_export'); download(`aurea-backup-${(S.hotel.name || 'hotel').replace(/\W+/g, '-')}-${D.today()}.json`, JSON.stringify(j.backup, null, 1)); };

page('qr', {
  perm: 'm_settings,m_content', icon: 'qr', group: 'admin', title: 'qr_codes',

ACT.qr_copy = async el => { try { await navigator.clipboard.writeText(el.dataset.u); toast(t('copied')); } catch { toast(el.dataset.u); } };
ACT.qr_print = () => { const img = $('#qrbox img') || $('#qrbox canvas'); const src = img ? (img.tagName === 'CANVAS' ? img.toDataURL() : img.src) : ''; printSheet(S.settings.app_name || S.hotel.name, `<div style="text-align:center;margin-top:30px"><p style="font-size:20px">${esc(t('qr_scan'))}</p>${src ? `<img src="${src}" style="width:70mm;height:70mm">` : ''}<p>${esc(S.hotel.name)}</p></div>`); };
