<script>/* a file of the app that could not be loaded (an incomplete upload) is said on the screen, never hidden */
addEventListener('error', e => {
  const s = e.target, f = s && /^(SCRIPT|LINK)$/.test(s.tagName) && (s.getAttribute('src') || s.getAttribute('href') || '');
  if (!f || !/^(js|css)\//.test(f)) return;
  const say = () => document.body.insertAdjacentHTML('afterbegin', '<p role="alert" style="margin:0;padding:.8rem 1rem;background:#A85454;color:#fff;font:15px/1.4 system-ui,sans-serif">'
    + 'A file of the app could not be loaded: ' + f.split('?')[0] + ' – upload every file of the app folder, with its folders.</p>');
  document.body ? say() : addEventListener('DOMContentLoaded', say);
}, true);
</script>
