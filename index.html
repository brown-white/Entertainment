<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E2A1E">
<meta name="description" content="Hotel entertainment programme, bookings and team app">
<title>AUREA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EF;--s:#FFFFFF;--s2:#F2EEE7;--tx:#1F2A2A;--mut:#7B7B75;--a:#C6A15B;--line:#E8E3DA;--p:#1F2A2A;--on-p:#FFFFFF;--hd:#1F2A2A;--on-hd:#F7F4EF;--nav:#C6A15B;--soft:color-mix(in srgb,var(--a) 16%,var(--s));--ok:#52725B;--info:#3B82F6;--warn:#B48746;--bad:#A85454;--special:#8B6FB6;--r:14px;--rb:12px;--disp:'Cormorant Garamond',Georgia,serif;--ui:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;--safe-b:env(safe-area-inset-bottom,0px);--shadow:0 1px 2px rgba(40,26,16,.05),0 12px 32px -14px rgba(40,26,16,.18);--t-activity:var(--ok);--t-event:var(--warn);--t-show:#8E3B5B;--t-live_music:var(--info);--t-special_event:var(--special)}
[data-font=modern]{--disp:'Jost',system-ui,sans-serif}
[data-font=classic]{--ui:Georgia,'Times New Roman',serif}
[dir=rtl]{--disp:'Tajawal','Cormorant Garamond',serif;--ui:'Tajawal',system-ui,sans-serif}
[data-btn=pill]{--rb:999px}
[data-btn=square]{--rb:4px;--r:6px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--ui);min-height:100vh;letter-spacing:.005em}
a{color:inherit}
img{max-width:100%}
button{font:inherit;color:inherit}
input{font:inherit;border-radius:12px;background:var(--s2);color:var(--tx);border-color:var(--line)}
select{font:inherit;border:1px solid var(--line);padding:.6rem .7rem;min-height:44px;width:100%;border-radius:12px;background:var(--s2);color:var(--tx);border-color:var(--line)}
textarea{font:inherit;border:1px solid var(--line);padding:.6rem .7rem;min-height:44px;width:100%;border-radius:12px;background:var(--s2);color:var(--tx);border-color:var(--line)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
h1{font-family:var(--disp);font-weight:600;line-height:1.15;margin:0 0 .5em}
h2{font-family:var(--disp);line-height:1.15;margin:0 0 .5em;font-size:1.35rem;font-weight:500;letter-spacing:.01em}
h3{font-family:var(--disp);font-weight:600;line-height:1.15;margin:0 0 .5em;font-size:1.1rem}
.pg-title{font-size:2.1rem;letter-spacing:-.01em;margin:.2em 0 .6em}
section{margin:1.4rem 0}
.muted{color:var(--mut)}
.small,small{font-size:.84rem}
.center{text-align:center}
.grow{flex:1;min-width:0}
/* top bar */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;padding-top:calc(.55rem + env(safe-area-inset-top,0px));background:linear-gradient(180deg,color-mix(in srgb,var(--hd) 88%,#000) 0%,var(--hd) 100%);color:var(--on-hd);border-bottom:1px solid color-mix(in srgb,var(--a) 55%,transparent);box-shadow:0 6px 24px -12px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;min-width:0;flex:1}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--s)}
.brand span{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--disp);font-size:1.35rem;font-weight:600;letter-spacing:.02em;line-height:1}
.brand small{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.78rem}
.top-r{display:flex;gap:.3rem;align-items:center}
.icon-btn{min-width:40px;cursor:pointer;position:relative;font-size:.85rem;font-weight:600;letter-spacing:.04em;display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:12px;border:1px solid var(--line);background:var(--s);color:var(--p)}
.bell i{position:absolute;top:2px;right:0;background:var(--a);color:#fff;font-style:normal;font-size:.68rem;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 3px}
.dot{top:2px;right:0;min-width:17px;height:17px;place-items:center;position:static;display:inline-grid;margin-inline-start:.35rem;font-style:normal;background:var(--a);color:#fff;border-radius:999px;padding:0 .45rem;font-size:.75rem;font-weight:600}
#ctx{border-bottom:1px solid var(--line);font-size:.86rem;background:var(--s2);color:var(--tx);border-color:var(--line)}
.ctx-line{display:flex;gap:.8rem;flex-wrap:wrap;padding:.4rem 1rem;align-items:center;color:var(--mut)}
.ctx-line label{display:flex;gap:.4rem;align-items:center}
.ctx-line select{border:1px solid var(--line);background:var(--s);border-radius:8px;padding:.25rem .4rem;max-width:12rem}
.preview-bar{background:var(--a);color:#fff;padding:.4rem 1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between}
/* layout */
.layout{display:flex;max-width:1180px;margin:0 auto}
#side{display:none}
#view{flex:1;min-width:0;padding:1rem 1rem calc(5.5rem + var(--safe-b))}
.page{max-width:900px;margin:0 auto}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;padding-bottom:var(--safe-b);background:color-mix(in srgb,var(--s) 82%,transparent);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);border-top:1px solid var(--line)}
#tabbar a{text-decoration:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.2rem;color:var(--mut);font-size:.72rem;letter-spacing:.02em;position:relative;flex:1 1 0;min-width:0;padding:.45rem .1rem calc(.4rem + env(safe-area-inset-bottom,0px))}
#tabbar a span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.7rem;line-height:1.2}
#tabbar a.on{color:var(--nav)}
#tabbar a.on::before{left:30%;right:30%;content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:var(--nav)}
.menu-all section,#side section{margin:0 0 1rem}
.menu-all h3,#side h3{font-family:var(--ui);font-size:.75rem;font-weight:600;color:var(--mut);margin:.6rem .6rem .3rem;letter-spacing:.06em}
#side a{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:10px;text-decoration:none}
.menu-all a{text-decoration:none;margin-bottom:.35rem;display:flex;align-items:center;gap:.8rem;padding:.85rem 1rem;border-radius:16px;border:1px solid var(--line);background:var(--s);box-shadow:var(--shadow);justify-content:flex-start;text-align:start;color:var(--tx);font-weight:500}
#side a.on{background:color-mix(in srgb,var(--a) 16%,transparent);font-weight:500}
#side a:hover{background:color-mix(in srgb,var(--a) 9%,transparent)}
/* buttons */
.btn{border:1px solid var(--p);background:var(--p);color:var(--on-p);padding:.6rem 1.05rem;cursor:pointer;text-decoration:none;font-weight:500;min-height:44px;line-height:1.1;border-radius:12px;letter-spacing:.02em;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 16px -8px rgba(40,26,16,.45);display:inline-flex;align-items:center;gap:.4rem;justify-content:center}
.btn.ghost{box-shadow:none;color:var(--tx);border-color:var(--line);background:transparent}
.btn.small{padding:.35rem .7rem;min-height:34px;font-size:.88rem}
.btn.wide{width:100%}
.btn.danger,.danger{color:var(--bad)!important;border-color:color-mix(in srgb,var(--bad) 45%,transparent)!important}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .6rem;scrollbar-width:none;align-items:center}
.chip-btn{border:1px solid var(--line);background:var(--s);border-radius:999px;padding:.35rem .85rem;white-space:nowrap;cursor:pointer;min-height:36px}
.chip-btn.on{background:var(--p);color:var(--on-p);border-color:var(--p)}
.chip{display:inline-block;font-size:.74rem;padding:.08rem .5rem;border-radius:999px;white-space:nowrap;vertical-align:middle;background:var(--soft);color:var(--tx)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,var(--s));color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,var(--s));color:var(--bad)}
.ty-activity{background:color-mix(in srgb,var(--t-activity) 16%,var(--s));color:color-mix(in srgb,var(--t-activity) 80%,var(--tx))}
.ty-event{background:color-mix(in srgb,var(--t-event) 16%,var(--s));color:color-mix(in srgb,var(--t-event) 80%,var(--tx))}
.ty-show{background:color-mix(in srgb,var(--t-show) 16%,var(--s));color:color-mix(in srgb,var(--t-show) 80%,var(--tx))}
.ty-live_music{background:color-mix(in srgb,var(--t-live_music) 16%,var(--s));color:color-mix(in srgb,var(--t-live_music) 80%,var(--tx))}
.ty-special_event{background:color-mix(in srgb,var(--t-special_event) 16%,var(--s));color:color-mix(in srgb,var(--t-special_event) 80%,var(--tx))}
.st-working{background:color-mix(in srgb,var(--ok) 15%,var(--s))}
.st-day_off{background:var(--soft)}
.st-vacation{background:color-mix(in srgb,var(--info) 16%,var(--s));color:color-mix(in srgb,var(--info) 80%,var(--tx))}
.st-absent,.st-sick{background:color-mix(in srgb,var(--bad) 15%,var(--s))}
.st-entrance{background:color-mix(in srgb,var(--warn) 16%,var(--s));color:color-mix(in srgb,var(--warn) 80%,var(--tx))}
.st-practice{background:color-mix(in srgb,var(--special) 16%,var(--s));color:color-mix(in srgb,var(--special) 80%,var(--tx))}
/* tabs */
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:.55rem .85rem;text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;color:var(--mut)}
.tabs a.on{color:var(--tx);border-color:var(--a);font-weight:500}
/* day strip: the signature element */
.daystrip{display:flex;gap:.35rem;overflow-x:auto;padding:.2rem 0 .8rem;scrollbar-width:none;scroll-snap-type:x proximity}
.daystrip button{flex:none;width:4.1rem;border:1px solid var(--line);background:var(--s);border-radius:var(--r);padding:.4rem .2rem .45rem;display:flex;flex-direction:column;align-items:center;cursor:pointer;scroll-snap-align:start}
.daystrip span{font-size:.72rem;color:var(--mut);text-transform:capitalize}
.daystrip b{font-family:var(--disp);font-size:1.75rem;font-weight:600;line-height:1}
.daystrip small{font-size:.66rem;color:var(--mut)}
.daystrip button.on{background:var(--p);border-color:var(--p);color:var(--on-p)}
.daystrip button.on span,.daystrip button.on small{color:inherit;opacity:.8}
/* items */
.items{display:flex;flex-direction:column;gap:.45rem}
.item{display:flex;gap:.9rem;align-items:flex-start;padding:.75rem .9rem;background:var(--s);text-decoration:none;text-align:start;width:100%;cursor:pointer;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;transition:transform .15s ease,box-shadow .15s ease;position:relative;border-left:4px solid var(--tc,var(--line))}
.item time{min-width:3.4rem;line-height:1;display:flex;flex-direction:column;font-family:var(--disp);font-size:1.55rem;font-weight:500}
.item time small{font-family:var(--ui);font-size:.72rem;color:var(--mut);font-weight:400;margin-top:.2rem}
.item b{display:block;font-weight:500}
.item .meta{display:block;font-size:.84rem;color:var(--mut);margin:.15rem 0}
.item.hl{border-inline-start:3px solid var(--a);border-left:3px solid var(--a);box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 60%,transparent),var(--shadow)}
.item.cancelled{opacity:.55}
.item.cancelled b{text-decoration:line-through}
.item.short{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.item .names{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem}
.fav{color:var(--a);margin-inline-start:.3rem}
.name-tag{display:inline-block;padding:.08rem .5rem;border-radius:6px;background:var(--soft);font-size:.82rem}
.name-tag.planner{background:color-mix(in srgb,var(--a) 22%,var(--s))}
.name-tag.busy{outline:2px solid var(--a)}
/* cards, lists, forms */
.card{background:var(--s);padding:1rem 1.1rem;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}
.card+.card{margin-top:.8rem}
.narrow{max-width:440px;margin:0 auto}
.list{display:flex;flex-direction:column;gap:.35rem}
.li{display:block;background:var(--s);padding:.65rem .8rem;text-decoration:none;text-align:start;width:100%;font:inherit;cursor:default;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}
button.li,a.li{cursor:pointer}
.li p{margin:.25rem 0}
.li.dim,.dim{opacity:.55}
.li.new{border-inline-start:3px solid var(--a)}
.li.complaint{border-inline-start:3px solid var(--bad)}
.attention .li.bad{border-inline-start:3px solid var(--bad)}
.attention .li.warn{border-inline-start:3px solid var(--warn)}
.attention .li.info{border-inline-start:3px solid var(--a)}
.reply{background:var(--soft);border-radius:8px;padding:.35rem .6rem;font-size:.9rem}
.form{display:flex;flex-direction:column;gap:.75rem}
.field{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.field label{font-size:.86rem;font-weight:500}
.field.check label{display:flex;gap:.5rem;align-items:center;font-weight:400;font-size:1rem}
input:not([type=checkbox]):not([type=radio]):not([type=color]){border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.6rem .7rem;min-height:44px;width:100%}
input[type=checkbox],input[type=radio]{width:1.2rem;height:1.2rem;accent-color:var(--p)}
input[type=color]{width:3rem;height:2.4rem;border:1px solid var(--line);border-radius:8px;background:none}
.hint{color:var(--mut)}
.row-mini{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.25rem 0}
.row-mini span{min-width:8rem}
.row-mini input,.row-mini select{max-width:60%}
details.field summary,details summary{cursor:pointer;font-weight:500;padding:.3rem 0}
.img-pick{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.img-pick img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.stars-in{display:flex;gap:.2rem}
.stars-in button{background:none;border:0;font-size:1.9rem;color:var(--line);cursor:pointer;padding:0 .1rem;min-height:44px}
.stars-in button.on{color:var(--a)}
.stars{letter-spacing:.05em;display:inline-flex;gap:1px;color:var(--a);vertical-align:-.15em}
.stars i{color:var(--line);font-style:normal}
.filters{flex-wrap:wrap;margin-bottom:.8rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.5rem;align-items:center}
.filters input,.filters select{width:auto;flex:1;min-width:9rem}
fieldset.perm-group{border:1px solid var(--line);border-radius:10px;margin:.6rem 0;padding:.4rem .8rem}
fieldset.perm-group legend{font-weight:600;padding:0 .3rem}
.perm-group .row-mini{justify-content:flex-start}
/* empty, loading, toast, modal */
.empty{text-align:center;padding:1.8rem 1rem;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}
.empty p{margin:0 0 .8rem}
.loading{display:flex;gap:.35rem;justify-content:center;padding:3rem}
.loading span{width:8px;height:8px;border-radius:50%;background:var(--a);animation:pulse 1s infinite alternate}
.loading span:nth-child(2){animation-delay:.2s}
.loading span:nth-child(3){animation-delay:.4s}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5rem + var(--safe-b));z-index:60;display:flex;flex-direction:column;gap:.4rem;width:min(92vw,420px)}
.toast{background:var(--p);color:var(--on-p);padding:.7rem 1rem;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);transition:opacity .4s}
.toast.bad{color:#fff;background:var(--bad)}
.toast.warn{color:#fff;background:var(--warn)}
.toast.out{opacity:0}
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(20,12,6,.45);display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;animation:up .18s ease-out;background:var(--s);color:var(--tx)}
.modal.wide{max-width:860px}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (min-width:700px){
  .modal-wrap{align-items:center}
  .modal{border-radius:18px}
}
.modal header{display:flex;align-items:center;gap:.5rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.modal header h2{flex:1;margin:0;font-size:1.3rem}
.modal-body{padding:1rem;overflow:auto}
.modal footer{display:flex;gap:.5rem;align-items:center;padding:.7rem 1rem calc(.7rem + var(--safe-b));border-top:1px solid var(--line);flex-wrap:wrap}
/* people, avatars, gallery */
.ava{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.ava.xs{width:30px;height:30px}
.ava.lg{width:84px;height:84px}
.ava.ini{display:inline-grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:1.15rem;color:var(--p)}
.ava.lg.ini{font-size:2rem}
.faces{display:flex;gap:.8rem;overflow-x:auto;padding-bottom:.4rem}
.faces a,.faces>span{display:flex;flex-direction:column;align-items:center;gap:.2rem;text-decoration:none;font-size:.78rem;min-width:62px;text-align:center}
.faces.small{margin:.6rem 0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.person{background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:1rem .7rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.3rem}
.person p{font-size:.86rem;margin:.2rem 0}
.profile-head{display:flex;gap:1rem;align-items:center}
.profile-head b{font-family:var(--disp);font-size:1.5rem;display:block}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.4rem}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
.gallery figcaption{font-size:.8rem;color:var(--mut)}
.strip{display:flex;gap:.4rem;overflow-x:auto}
.strip img{height:110px;border-radius:10px;cursor:zoom-in}
.thumb{width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:.3rem;cursor:zoom-in}
.lightbox{text-align:center}
.lightbox img{max-height:72vh;border-radius:8px}
.hero{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);margin-bottom:.8rem}
.more-link{display:inline-block;margin-top:.6rem;color:var(--a);font-weight:500}
.hello{font-family:var(--disp);font-size:1.5rem;margin:.2rem 0 .6rem}
.lead{font-size:1.08rem;max-width:62ch;line-height:1.6}
.prose{max-width:68ch;line-height:1.6}
.links{display:flex;flex-wrap:wrap;gap:.4rem}
.hotel-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.hotel-card{background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;cursor:pointer}
.hotel-card img{width:72px;height:72px;border-radius:50%;object-fit:cover}
.hotel-card .mono{width:72px;height:72px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--disp);font-size:2.2rem}
.hotel-card b{font-family:var(--disp);font-size:1.3rem}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.4rem}
.lang-grid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.7rem;cursor:pointer;min-height:44px}
.lang-grid button.on{background:var(--p);color:var(--on-p)}
/* day cards, timelines, stats */
.today-card{display:flex;flex-direction:column;gap:.5rem}
.today-card b{font-family:var(--disp);font-size:1.6rem;display:block}
.today-card dl{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;margin:0}
.today-card dt{color:var(--mut)}
.today-card dd{margin:0}
.timeline{list-style:none;padding:0;margin:0;border-inline-start:2px solid var(--soft)}
.timeline li{padding:.25rem .8rem;position:relative}
.timeline time{font-weight:600;margin-inline-end:.5rem}
.sched{display:flex;flex-direction:column;gap:.35rem}
.sched-day{display:flex;gap:.8rem;background:var(--s);border:1px solid var(--line);border-radius:var(--rb);padding:.55rem .8rem}
.sched-day.off{background:color-mix(in srgb,var(--soft) 55%,var(--s))}
.sched-day .d{width:2.8rem;text-align:center}
.sched-day .d b{font-family:var(--disp);font-size:1.6rem;display:block;line-height:1}
.sched-day p{margin:.2rem 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.45rem;margin:.6rem 0}
.stats span{background:var(--s);padding:.55rem .7rem;font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}
.stats b{font-family:var(--disp);font-size:1.5rem;color:var(--tx);font-weight:600;overflow-wrap:anywhere;line-height:1.15}
.loadbar{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0}
.loadbar span{background:var(--s);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;font-size:.82rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.7rem}
.cols .card+.card{margin-top:0}
.bars div{display:grid;grid-template-columns:7rem 1fr 2rem;gap:.4rem;align-items:center;font-size:.85rem;margin:.2rem 0}
.bars span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars i{height:.6rem;background:var(--a);border-radius:4px}
.spark{display:flex;align-items:flex-end;gap:2px;height:80px}
.spark i{flex:1;background:var(--a);border-radius:2px 2px 0 0;min-height:2px}
.rank{padding-inline-start:1.2rem}
.rank li{display:flex;justify-content:space-between;max-width:320px}
/* tables & grids */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.4rem 0}
table{border-collapse:collapse;width:100%;background:var(--s);font-size:.9rem}
th,td{border:1px solid var(--line);padding:.4rem .5rem;text-align:start;vertical-align:middle}
thead th{background:color-mix(in srgb,var(--soft) 60%,var(--s));font-weight:500;white-space:nowrap}
table.grid select,table.grid input{min-height:34px;padding:.2rem .3rem;font-size:.85rem;min-width:5.5rem}
.status-grid td{padding:0;text-align:center}
.status-grid td button{width:100%;min-height:40px;border:0;background:transparent;cursor:pointer;font-size:.82rem}
.status-grid td.set{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--p) 35%,transparent)}
.status-grid td i{font-style:normal;font-size:.68rem;background:var(--p);color:var(--on-p);border-radius:4px;padding:0 .2rem;margin-inline-start:.15rem}
.status-grid th.today{background:color-mix(in srgb,var(--a) 22%,var(--s))}
.status-grid thead small{display:block;font-weight:400;color:var(--mut);font-size:.7rem}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:.3rem;margin:.6rem 0}
.numgrid button,.numgrid span{border:1px solid var(--line);background:var(--s);border-radius:8px;min-height:44px;cursor:pointer;font-variant-numeric:tabular-nums}
.numgrid button.on{background:var(--p);color:var(--on-p)}
.numgrid button:disabled{opacity:.3;text-decoration:line-through;cursor:default}
.numgrid.rooms button.off{opacity:.4}
.numgrid.big{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
.numgrid.big span{display:flex;flex-direction:column;align-items:center;padding:.3rem;cursor:default}
.numgrid.big span.used{background:var(--soft)}
.numgrid.big small{font-size:.68rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sticky-act{position:sticky;bottom:calc(4.4rem + var(--safe-b));display:flex;align-items:center;justify-content:space-between;background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .8rem;box-shadow:0 4px 18px rgba(0,0,0,.08)}
@media (min-width:960px){
  #side{display:block;width:240px;flex:none;padding:1rem .6rem;position:sticky;top:58px;align-self:flex-start;max-height:calc(100vh - 58px);overflow:auto}
  /* wide screens: the side menu replaces the bottom bar (guests have no side menu, so they keep the bar) */
  body:has(#side:not(:empty)) #tabbar{display:none}
  body:has(#side:not(:empty)) #view{padding-bottom:2rem}
  .sticky-act{bottom:1rem}
}
.packs{display:flex;flex-direction:column;gap:.4rem}
.pack{display:flex;gap:.7rem;align-items:center;background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:.6rem .8rem;cursor:pointer;text-align:start}
.pack.on{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.pack span{display:flex;flex-direction:column}
.tickets{display:flex;flex-direction:column;gap:.4rem}
.tk{display:flex;gap:.8rem;align-items:center;background:var(--s);border:1px dashed color-mix(in srgb,var(--p) 40%,transparent);border-radius:10px;padding:.55rem .8rem;flex-wrap:wrap}
.tk>b{font-family:var(--disp);font-size:1.7rem;min-width:3.5rem}
.tk span{flex:1}
.pack-card .stats{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
.score .sides{display:flex;gap:1rem;flex-wrap:wrap;margin:.5rem 0}
.score .sides>div{flex:1;min-width:120px;text-align:center;background:var(--bg);border-radius:12px;padding:.6rem}
.score .big{display:block;font-family:var(--disp);font-size:3rem;font-weight:600;line-height:1}
.score .row{justify-content:center}
.bus{margin-bottom:.8rem}
.bus .times{display:flex;flex-wrap:wrap;gap:.4rem}
.bus .times span{background:var(--s);border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;font-weight:600;display:flex;flex-direction:column}
.bus .times small{font-weight:400;color:var(--mut)}
.weather .now{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.weather .wx{font-size:2rem}
.weather .now b{font-family:var(--disp);font-size:2.4rem}
.weather .days{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin-top:.7rem;text-align:center}
.weather .days div{display:flex;flex-direction:column}
.info-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.7rem}
.info-cards .card+.card{margin-top:0}
.info-cards img{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-bottom:.5rem}
.stay-card{display:flex;flex-direction:column;gap:.2rem}
.stay-card b{font-family:var(--disp);font-size:1.5rem}
.q{font-family:var(--disp);font-size:1.4rem}
.answers{display:flex;flex-direction:column;gap:.4rem}
.chat{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:.45rem;padding:.3rem 0 1rem}
.msg{background:var(--s);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:.45rem .7rem;max-width:82%;align-self:flex-start;display:flex;flex-direction:column;gap:.15rem}
.msg.me{background:color-mix(in srgb,var(--a) 18%,var(--s));border-radius:14px 14px 4px 14px;align-self:flex-end;align-items:flex-end}
.msg p{margin:0;padding:.6rem .85rem;border-radius:18px 18px 18px 6px;background:var(--s);border:1px solid var(--line);font:inherit;color:inherit;text-align:start;cursor:pointer;line-height:1.4}
.msg small{color:var(--mut);font-size:.72rem}
.chat-in{margin-top:.6rem;position:sticky;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));display:flex;gap:.5rem;align-items:flex-end;padding:.5rem;border-radius:18px;background:color-mix(in srgb,var(--s) 92%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
.log .li{font-size:.88rem}
.qr{display:inline-block;padding:12px;background:#fff;border-radius:12px}
code{background:var(--soft);padding:.1rem .35rem;border-radius:5px;font-size:.85rem;word-break:break-all}
.pick .li{cursor:pointer}
.pick .chip{white-space:normal;max-width:100%;border-radius:.6rem;text-align:start}   /* a reason with real times can be long: it wraps instead of running off the screen */
.clock{display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem}
#offline{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--warn);color:#fff;text-align:center;padding:.35rem 1rem calc(.35rem);padding-top:calc(.35rem + env(safe-area-inset-top,0px));font-size:.86rem}
fieldset.days{border:1px solid var(--line);border-radius:10px;padding:.4rem .7rem;display:flex;flex-wrap:wrap;gap:.4rem .45rem;align-items:center;justify-content:flex-start}
fieldset.days legend{font-size:.86rem;font-weight:500;padding:0 .3rem}
fieldset.days label{display:flex;gap:.3rem;align-items:center}
.bingo-caller .ball{font-family:var(--disp);font-size:5rem;font-weight:600;line-height:1;width:8rem;height:8rem;margin:.4rem auto;border-radius:50%;display:grid;place-items:center;background:var(--p);color:var(--on-p)}
.bingo-board{grid-template-columns:repeat(10,1fr)}
.bingo-board span{display:grid;place-items:center;font-variant-numeric:tabular-nums;cursor:default}
.bingo-board span.used{background:var(--soft);font-weight:600}
.bingo-board span.last{background:var(--a);color:#fff}
.g-hero .lead{margin:.2rem 0}
.g-hero .hello{margin:0 0 .3rem}
.cta{display:flex;flex-direction:column;gap:.3rem;text-decoration:none;margin:.8rem 0}
.cta b{font-family:var(--disp);font-size:1.3rem}
.cta .btn{align-self:flex-start;margin-top:.3rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem;margin:1rem 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;padding:1rem;min-height:96px;background:var(--s);text-decoration:none;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}
.tile span{font-size:1.4rem;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;color:var(--p);background:linear-gradient(145deg,color-mix(in srgb,var(--a) 28%,var(--s)),color-mix(in srgb,var(--a) 10%,var(--s)))}
.tile b{font-weight:500;line-height:1.25}
.pill{align-self:center;flex:none;font-size:.82rem;font-weight:600;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--line)}
.pill.go{background:var(--p);color:var(--on-p);border-color:var(--p)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,var(--s));color:var(--ok)}
.pill.bad{color:var(--bad)}
.fb-lines{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin:.2rem 0}
.fb-lines span{white-space:nowrap}
.att select{width:auto;min-width:7.5rem;flex:none}
.row > input[type=date],.row > input[type=month]{width:auto;flex:1;min-width:9rem}
.g-hero .weather{border:0;padding:0;background:transparent;margin-top:.4rem;box-shadow:none}
.att{align-items:center}
.att .grow{min-width:9rem}
/* one icon style */
.ico{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
.ico-txt{display:inline-grid;place-items:center;width:1.3em}
.ico.rot-l{transform:rotate(-90deg)}
.ico.rot-r{transform:rotate(90deg)}
/* header */
#top .brand b{letter-spacing:.06em;font-weight:500}
#top .brand small{letter-spacing:.08em;text-transform:uppercase;font-size:.66rem;opacity:.75}
.icon-btn.bell .ico{width:1.35em;height:1.35em}
/* page titles */
#title{font-weight:500;letter-spacing:.01em}
#title::after{content:"";display:block;width:44px;height:2px;margin-top:.45rem;border-radius:2px;background:linear-gradient(90deg,var(--a),transparent)}
/* surfaces */
.item:active{transform:scale(.99)}
.stats span b{font-family:var(--disp);font-size:clamp(1.25rem,5.2vw,1.9rem);font-weight:500}
/* buttons + inputs */
.btn.ghost:hover{border-color:var(--a)}
.btn:active{transform:translateY(1px)}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent);outline:none}
.icon-btn[disabled]{opacity:.35}
/* bottom bar: frosted glass, line icons, gold marker */
#tabbar a .ico{width:1.5rem;height:1.5rem}
/* side + full menu */
.mi{display:inline-grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:50%;background:color-mix(in srgb,var(--a) 16%,var(--s));color:var(--p);flex:none}
.menu-all .chev{color:var(--mut)}
/* guest home */
.tile span .ico{width:1.4rem;height:1.4rem}
.day-banner{display:flex;flex-direction:column;gap:.15rem;padding:.2rem 0 .6rem;margin-bottom:.4rem;border-bottom:1px solid var(--line)}
.day-banner small{text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;color:var(--a)}
.day-banner b{font-family:var(--disp);font-size:1.7rem;font-weight:500;line-height:1.1}
.day-banner span,.day-line span{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut)}
.day-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;margin:.2rem 0 .6rem}
.day-line b{font-family:var(--disp);font-size:1.35rem;font-weight:500}
.chips.cats{align-items:center}
.chips.cats>.ico{color:var(--a)}
.chip.cat{background:color-mix(in srgb,var(--cc) 16%,var(--s));border:1px solid color-mix(in srgb,var(--cc) 35%,transparent);color:color-mix(in srgb,var(--cc) 62%,var(--tx))}
/* Today at a glance */
.glance .glance-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;padding-bottom:.6rem;margin-bottom:.4rem;border-bottom:1px solid var(--line)}
.glance .glance-head small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;color:var(--a)}
.glance .glance-head b{font-family:var(--disp);font-size:1.6rem;font-weight:500}
.g-row{display:grid;grid-template-columns:1.6rem 8.5rem 1fr;gap:.5rem;align-items:start;padding:.42rem 0;border-bottom:1px dashed var(--line)}
.g-row:last-of-type{border-bottom:0}
.g-row .ico{color:var(--a);margin-top:.15rem}
.g-row span{color:var(--mut);font-size:.9rem}
.g-row b{font-weight:500}
.g-row b.none{color:var(--mut);font-weight:400;font-style:italic}
@media (max-width:420px){
  .g-row{grid-template-columns:1.6rem 1fr}
  .g-row b{grid-column:2}
}
/* forms: sections, chips, phone, icon picker */
.form-sec{margin:1.2rem 0 .3rem;padding-top:.9rem;border-top:1px solid var(--line)}
.form-sec:first-child{margin-top:0;padding-top:0;border-top:0}
.form-sec h3{font-family:var(--disp);font-size:1.25rem;font-weight:500;margin:0}
.form-sec .hint{margin:.15rem 0 0}
.pickchip{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .7rem;border:1px solid var(--line);border-radius:999px;background:var(--s)}
.pickchip:has(input:checked){border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,var(--s))}
.phone-in{display:flex;gap:.4rem}
.phone-in select{flex:0 0 6.2rem}
.phone-in input{flex:1}
[data-country] input{margin-top:.4rem}
.icon-pick{display:flex;flex-wrap:wrap;gap:.35rem}
.icon-pick label{display:grid;place-items:center;width:2.6rem;height:2.6rem;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.icon-pick input{position:absolute;opacity:0}
.icon-pick label:has(input:checked){border-color:var(--a);background:color-mix(in srgb,var(--a) 16%,var(--s))}
.hint-box{display:flex;gap:.6rem;align-items:flex-start;padding:.7rem .9rem;border-radius:14px;background:color-mix(in srgb,var(--a) 10%,var(--s));border:1px solid color-mix(in srgb,var(--a) 30%,transparent);color:var(--tx);font-size:.92rem}
.hint-box .ico{color:var(--a);margin-top:.1rem}
/* lists with arrows + menu builder */
.crud-row{display:flex;align-items:center;gap:.5rem;padding:.25rem .4rem .25rem .2rem}
.li-main{flex:1;text-align:start;background:none;border:0;padding:.6rem .7rem;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:.5rem}
.move{display:inline-flex;gap:.25rem;flex:none}
.mb-list{display:flex;flex-direction:column;gap:.5rem}
.mb-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;padding:.6rem .7rem;border:1px solid var(--line);border-radius:16px;background:var(--s);box-shadow:var(--shadow)}
.mb-row input[data-f=label]{margin-top:.3rem;padding:.4rem .6rem;font-size:.9rem}
.mb-hide{display:inline-flex;align-items:center;gap:.3rem;font-size:.82rem;color:var(--mut);white-space:nowrap}
/* attendance */
.att-list{display:flex;flex-direction:column;gap:.5rem}
.att-row{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;padding:.75rem .85rem;background:var(--s);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.att-tags{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .5rem;margin-top:.2rem}
.att-act{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:.5rem;margin-inline-start:auto;max-width:100%}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-width:0;border:0;background:transparent;padding:.5rem .75rem;font:inherit;font-size:.86rem;color:var(--tx);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on.s-working{background:var(--ok);color:#fff}
.seg button.on.s-absent{background:var(--bad);color:#fff}
.seg button.on.s-sick{background:var(--warn);color:#fff}
.att-tools{display:inline-flex;gap:.3rem}
/* scoreboard */
.scoreboard header{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.scoreboard header small{text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;color:var(--a)}
.scoreboard header h2{margin:.1rem 0 .4rem}
.scoreboard .live{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
.scoreboard .live::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.board li{display:grid;grid-template-columns:2rem 1fr auto;gap:.2rem .6rem;align-items:center;padding:.55rem .7rem;border-radius:14px;background:color-mix(in srgb,var(--tx) 3%,var(--s))}
.board li.lead{background:color-mix(in srgb,var(--a) 16%,var(--s))}
.board .rank{font-family:var(--disp);font-size:1.2rem;color:var(--mut)}
.board .who small{display:block;color:var(--mut)}
.board .pts{font-family:var(--disp);font-size:2rem;font-weight:500;min-width:2.5ch;text-align:end}
.board .pt-btns{grid-column:1/-1;display:flex;gap:.35rem;flex-wrap:wrap}
.board .pt-btns .btn{min-width:3rem}
.player{margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
.player .room-in{flex:0 0 5.5rem;width:5.5rem}
.scores{display:flex;flex-direction:column;gap:.8rem}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .scoreboard .live::before{animation:none}
  .item{transition:none}
}
.ico.fill{fill:currentColor}
.ico.dim{opacity:.28}
.stars .ico{width:1em;height:1em}
[data-stars] button .ico{width:1.7rem;height:1.7rem}
[data-stars] button.on .ico{fill:currentColor;color:var(--a)}
.fav.on{color:var(--bad)}
.ico.wx{width:2.4rem;height:2.4rem;color:var(--a);stroke-width:1.3}
.clock .ico{color:var(--a)}
/* layout details */
fieldset.days>label,.field .pickchip{display:inline-flex;width:auto;margin:0;align-items:center;gap:.35rem}
fieldset.days>small{flex-basis:100%}
fieldset.field.days{flex-direction:row}
#side a .ico{color:var(--a)}
#side a span{flex:1;min-width:0}
/* iPhone: date / time / month boxes stay inside the screen and read left-aligned */
input[type=date],input[type=time],input[type=month],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:2.9rem;text-align:start;box-sizing:border-box}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:start}
.row>input[type=date],.row>input[type=month]{width:auto;flex:1}
/* scores: name and room side by side */
.player [data-pn]{flex:1;min-width:0}
/* programme: each type has its own card */
.item.t-activity{--tc:var(--t-activity)}
.item.t-event{--tc:var(--t-event);background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 9%,var(--s)),var(--s) 55%)}
.item.t-show{--tc:var(--t-show);background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 9%,var(--s)),var(--s) 55%)}
.item.t-live_music{--tc:var(--t-live_music)}
.item.t-special_event{--tc:var(--t-special_event);background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 9%,var(--s)),var(--s) 55%)}
.item.t-show time,.item.t-special_event time{color:var(--tc)}
.ty-badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;font-weight:600;letter-spacing:.03em;color:var(--tc,var(--mut));margin-inline-end:.3rem}
.ty-badge .ico{width:1.05em;height:1.05em}
.chips.cats .chip-btn.on{background:var(--p);color:var(--on-p)}
/* guest activity page: booking box */
.book-box{display:flex;flex-direction:column;gap:.7rem;padding:.9rem;border-radius:16px;background:color-mix(in srgb,var(--a) 9%,var(--s));border:1px solid color-mix(in srgb,var(--a) 30%,transparent)}
.book-box .places{margin:0;display:flex;align-items:center;gap:.4rem;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:.6rem}
.stepper span{flex:1;font-weight:500}
.stepper input{width:3.2rem;text-align:center;font-size:1.25rem;font-weight:600;border:0;background:transparent;padding:0}
/* winners for guests */
.winners ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.winners li{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px dashed var(--line)}
.winners li:last-child{border:0}
.winners img{width:3rem;height:3rem;border-radius:12px;object-fit:cover}
.winners small{display:block;color:var(--mut)}
.winners .tk-no{font-family:var(--disp);font-size:1.2rem;color:var(--a);white-space:nowrap}
/* chat */
.threads{display:flex;flex-direction:column;gap:.5rem}
.thread{display:flex;align-items:center;gap:.75rem;padding:.75rem .9rem;border-radius:16px;background:var(--s);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit}
.thread .av{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:color-mix(in srgb,var(--a) 20%,var(--s));color:var(--p);font-family:var(--disp);font-size:1.2rem;flex:none}
.thread small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-end{display:flex;flex-direction:column;align-items:flex-end;gap:.25rem}
details.archived{margin-top:1rem}
details.archived summary{cursor:pointer;color:var(--mut);display:flex;align-items:center;gap:.4rem;padding:.4rem 0}
.chat-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.msg .who{color:var(--a);font-weight:600;font-size:.75rem;padding:0 .5rem}
.msg-body{margin:0;padding:.6rem .85rem;border-radius:18px 18px 18px 6px;background:var(--s);border:1px solid var(--line);font:inherit;color:inherit;text-align:start;cursor:pointer;line-height:1.4}
.msg.me .msg-body{border-radius:18px 18px 6px 18px;background:var(--p);color:var(--on-p);border-color:var(--p)}
.msg.gone p{color:var(--mut);background:transparent;border-style:dashed}
.msg .when{color:var(--mut);font-size:.7rem;padding:0 .5rem}
.chat-in textarea{flex:1;min-height:2.6rem;max-height:8rem;resize:none;border-radius:14px}
.sheet-actions{display:flex;flex-direction:column;gap:.5rem}
/* requests: choose the kind first */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding:.9rem;border-radius:16px;border:1px solid var(--line);background:var(--s);text-align:start;font:inherit;color:inherit;cursor:pointer}
.choice .ico{color:var(--a);width:1.6rem;height:1.6rem}
.choice small{color:var(--mut);line-height:1.3}
/* attendance month sheet */
.legend{display:flex;flex-wrap:wrap;gap:.35rem .8rem;font-size:.82rem;margin:.6rem 0}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.legend b{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:6px}
.att-sheet table{border-collapse:separate;border-spacing:0;font-size:.82rem}
.att-sheet th,.att-sheet td{padding:0;text-align:center;border-bottom:1px solid var(--line);min-width:1.9rem;height:2.2rem}
.att-sheet thead th{font-weight:500;font-size:.75rem;line-height:1.1;padding:.25rem 0}
.att-sheet thead th small{display:block;color:var(--mut);font-size:.65rem}
.att-sheet th.today{color:var(--a);font-weight:700}
.att-sheet th.we{background:color-mix(in srgb,var(--tx) 3%,transparent)}
.att-sheet .sticky{position:sticky;left:0;z-index:2;background:var(--s);text-align:start;padding:.3rem .6rem;min-width:8.5rem;border-right:1px solid var(--line)}
.att-sheet tbody th small{display:block;font-weight:400}
.att-sheet td button{width:100%;height:100%;border:0;background:transparent;font:inherit;font-weight:700;cursor:pointer;color:inherit}
.att-sheet td.tot{font-weight:600;background:color-mix(in srgb,var(--a) 8%,var(--s));min-width:2.4rem}
td.c-working{color:var(--ok)}
.c-working b{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
td.c-day_off{color:var(--mut)}
.c-day_off b{color:var(--mut);background:color-mix(in srgb,var(--mut) 10%,transparent)}
td.c-vacation{color:var(--info)}
.c-vacation b{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent)}
.c-absent b{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
td.c-absent{color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent)}
.c-sick b{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
td.c-sick{color:var(--warn);background:color-mix(in srgb,var(--warn) 6%,transparent)}
td.fut{opacity:.38}
.legend .fut b{opacity:.38;color:var(--ok)}
td.c-out,.legend .c-out b{color:var(--mut);background:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--tx) 5%,transparent) 4px 8px)}
.st-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem}
.st-pick button{display:flex;align-items:center;gap:.6rem;padding:.75rem;border-radius:14px;border:1px solid var(--line);background:var(--s);font:inherit;cursor:pointer}
.st-pick button b{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:10px;font-size:1.05rem}
.st-pick button.on{border-color:var(--a);box-shadow:0 0 0 2px color-mix(in srgb,var(--a) 30%,transparent)}
/* tickets + prizes */
.swatch{display:inline-block;width:1rem;height:1rem;border-radius:5px;background:var(--cc);vertical-align:-.15em;margin-inline-end:.4rem;box-shadow:0 0 0 1px var(--line)}
.offer-rows{display:flex;flex-direction:column;gap:.4rem}
.offer-row{display:flex;align-items:center;gap:.45rem}
.offer-row input{width:5rem}
.offer-row span{color:var(--mut);font-size:.9rem}
.tk-prev{overflow-x:auto;padding:.5rem;border-radius:12px;background:#fff;border:1px dashed var(--line)}
.prize-set{border-top:4px solid var(--cc)}
.prize-set header{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;flex-wrap:wrap}
.prize-set header small{text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;color:var(--a)}
.prize-set h2{margin:.1rem 0 .5rem}
.prizes{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 .6rem}
.prize{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;border-radius:14px;background:color-mix(in srgb,var(--tx) 2.5%,var(--s));border:1px solid var(--line);flex-wrap:wrap}
.prize.won{background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 12%,var(--s)),var(--s))}
.prize .place{font-family:var(--disp);font-size:1.5rem;color:var(--cc);width:1.6rem;text-align:center}
.prize img,.prize .pz-ic{width:3rem;height:3rem;border-radius:12px;object-fit:cover;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 14%,var(--s));color:var(--cc);flex:none}
.prize .winner{align-items:center;gap:.3rem;font-weight:500;color:var(--cc);display:inline;line-height:1.5}
.pz-act{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.switch{display:inline-flex;align-items:center;gap:.4rem;font-size:.86rem;cursor:pointer}
.switch.small{font-size:.8rem}
.tk-prev .tks.a4{width:190mm}
.prize .grow{min-width:9rem;flex:1}
.prize .winner .ico{vertical-align:-.2em}
@media (max-width:480px){
  .pz-act{flex-basis:100%;justify-content:flex-end}
}
/* themes: the same rules for every theme */
input::placeholder,textarea::placeholder{color:var(--mut)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,var(--s));color:color-mix(in srgb,var(--warn) 70%,var(--tx))}
.toast.ok{background:var(--ok)}
#top .icon-btn{background:color-mix(in srgb,var(--on-hd) 10%,transparent);color:var(--on-hd);border-color:color-mix(in srgb,var(--on-hd) 20%,transparent)}
.theme-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.5rem}
.theme-card{position:relative;display:flex;flex-direction:column;gap:.3rem;padding:.6rem;border:1px solid var(--line);border-radius:14px;background:var(--s);cursor:pointer}
.theme-card input{position:absolute;opacity:0}
.theme-card:has(input:checked){border-color:var(--a);box-shadow:0 0 0 2px color-mix(in srgb,var(--a) 35%,transparent)}
.tc-sw{display:flex;gap:4px;padding:6px;border-radius:10px;border:1px solid var(--line)}
.tc-sw i{flex:1;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.theme-card.auto .tc-sw{background:repeating-linear-gradient(45deg,var(--s2) 0 6px,var(--s) 6px 12px)!important}
.theme-card small{color:var(--mut);line-height:1.25}
/* filters: date boxes never squeezed */
.filters input[type=search]{grid-column:1/-1}
/* feedback: low ratings stand out */
.li.fb.fb-low{border-left:4px solid var(--bad);background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 6%,var(--s)),var(--s) 40%)}
.fb-lines .r-low{color:var(--bad);font-weight:600}
.fb-lines .r-low .stars{color:var(--bad)}
.fb-lines .r-mid .stars{color:var(--warn)}
.chip.attn{display:inline-flex;align-items:center;gap:.25rem;margin:.2rem 0}
.fb-head{display:flex;align-items:flex-start;gap:.55rem;cursor:pointer}
.fb-head input{margin-top:.3rem;width:1.15rem;height:1.15rem;flex:none}
.sel-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.5rem .7rem;margin:.4rem 0;border-radius:14px;background:var(--s2);border:1px solid var(--line)}
.sel-bar label{display:inline-flex;align-items:center;gap:.4rem;font-weight:500}
.fb-cards button{border:1px solid var(--line);background:var(--s);border-radius:18px;padding:.7rem .9rem;text-align:start;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;box-shadow:var(--shadow)}
.fb-cards button b{font-family:var(--disp);font-size:1.9rem;font-weight:500}
.fb-cards button.low{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.fb-cards button.low b{color:var(--bad)}
.fb-cards button.mid b{color:var(--warn)}
.fb-cards button.on{box-shadow:0 0 0 2px var(--a)}
.fb-cards small{color:var(--bad);display:inline-flex;align-items:center;gap:.2rem}
.btn.danger-soft{background:color-mix(in srgb,var(--bad) 12%,var(--s));color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);box-shadow:none}
.li.fb .actions{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.gs-fb>.chip{margin:.2rem 0 -.2rem}
.contact{gap:.5rem;flex-wrap:wrap}
/* payroll totals per currency */
tfoot tr.tot th,tfoot tr.tot td{background:var(--s2);font-weight:600;border-top:2px solid var(--line)}
/* search */
.search-in{display:flex;align-items:center;gap:.5rem;padding:.2rem .4rem .2rem .7rem;border:1px solid var(--line);border-radius:14px;background:var(--s2)}
.search-in input{border:0;background:transparent;font-size:1.05rem;padding:.65rem .2rem;flex:1;box-shadow:none}
.search-in .ico{color:var(--a)}
.search-box .row{margin-top:.6rem}
.sr-sec h2{display:flex;align-items:center;gap:.4rem;font-size:1.2rem}
.sr-sec h2 .ico{color:var(--a)}
.sr-sec .li{display:flex;align-items:center;gap:.6rem;text-align:start;width:100%;font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.switch input[type=checkbox],.sel-bar input[type=checkbox],.fb-head input[type=checkbox]{width:1.15rem;height:1.15rem;flex:none;padding:0;margin:0}
.fb-filters .switch{grid-column:span 2;white-space:nowrap}
/* notifications: new on top, read ones folded away */
.li.notif{display:flex;align-items:flex-start;gap:.4rem;padding:.2rem .2rem .2rem .7rem}
.li.notif.new{border-left:3px solid var(--a);background:color-mix(in srgb,var(--a) 7%,var(--s))}
.li.notif:not(.new){opacity:.78}
.notif-main{flex:1;display:flex;flex-direction:column;gap:.2rem;text-align:start;background:none;border:0;padding:.55rem 0;font:inherit;color:inherit;cursor:pointer}
.notif-main span{line-height:1.4}
details.notif-old{margin-top:.9rem}
details.notif-old summary{cursor:pointer;color:var(--mut);padding:.3rem 0}
/* ticket printing: the preview is the real first page */
.sheet-prev{padding:.6rem;border-radius:12px;background:var(--s2);border:1px dashed var(--line);overflow:auto}
.sheet-prev>svg{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}
form#studio .section,form#studio h3{margin-top:1rem}
/* smart planner */
/* smart planner: plans A / B / C side by side to compare, then one is chosen */
.plan-pick{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(13.5rem,1fr);gap:.6rem;overflow-x:auto;padding:.2rem .1rem .7rem;scroll-snap-type:x mandatory;scrollbar-width:thin}
.plan-card{scroll-snap-align:start;display:grid;grid-template-columns:1fr auto;align-content:start;gap:.15rem .6rem;text-align:start;padding:.75rem .85rem;border:1px solid var(--line);border-radius:16px;background:var(--s);font:inherit;color:var(--tx);cursor:pointer;min-width:0}
.plan-card>b{grid-column:1/-1}
.plan-card>small{grid-column:1/-1;color:var(--mut);font-size:.78rem;margin-bottom:.35rem}
.plan-card>small.same{margin:.3rem 0 0;color:var(--a)}
.plan-card .sc{display:contents}
.plan-card .sc i{font-style:normal;font-size:.82rem;color:var(--mut)}
.plan-card .sc b{font-variant-numeric:tabular-nums;text-align:end}
.plan-card.on{border-color:var(--a);box-shadow:0 0 0 2px color-mix(in srgb,var(--a) 30%,transparent)}
button.name-tag{border:0;font:inherit;font-size:.82rem;color:inherit;cursor:pointer;min-height:28px}
.why-list{margin:.4rem 0;padding-inline-start:1.2rem}.why-list li{margin:.3rem 0}
.plan-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}
.plan-sum span{display:flex;flex-direction:column;align-items:center;padding:.6rem;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-size:.82rem;color:var(--mut)}
.plan-sum b{font-family:var(--disp);font-size:1.9rem;font-weight:500;color:var(--tx)}
.plan-sum .ok b{color:var(--ok)}
.plan-sum .bad b{color:var(--bad)}
ul.why{margin:.3rem 0 0;padding-inline-start:1.1rem;font-size:.86rem;color:var(--mut)}
ul.why b{color:var(--tx)}
.li.short{border-left:3px solid var(--bad)}
.li.warn{border-left:3px solid var(--warn)}
.name-tag.warn{background:color-mix(in srgb,var(--warn) 18%,var(--s));color:var(--tx);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.hint-box.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--s))}
details.balance{margin:.4rem 0 .8rem}
details.balance summary{cursor:pointer;font-weight:600}
.bal{margin:.35rem 0}
.bal>b{display:block;font-size:.82rem;color:var(--mut);margin-bottom:.2rem}

</style>

trance duty does not block the whole day: until the leave-operation time the person works as normal and gets only activities that are finished by then.|Eingangsdienst sperrt nicht den ganzen Tag: Bis zum Ende des normalen Dienstes arbeitet die Person wie sonst und bekommt nur Aktivitäten, die bis dahin vorbei sind.|Дежурство на входе не занимает весь день: до конца обычной работы человек работает как обычно и получает только занятия, которые к этому времени заканчиваются.|Dyżur przy wejściu nie blokuje całego dnia: do końca zwykłej pracy osoba pracuje normalnie i dostaje tylko zajęcia, które do tego czasu się kończą.|Služba u vchodu neblokuje celý den: do konce běžné práce pracuje člověk normálně a dostane jen aktivity, které do té doby skončí.|Ingangsdienst blokkeert niet de hele dag: tot het einde van het gewone werk werkt de persoon normaal en krijgt alleen activiteiten die dan klaar zijn.|L'accueil à l'entrée ne bloque pas toute la journée : jusqu'à la fin du service normal, la personne travaille normalement et ne reçoit que des activités terminées à cette heure.|مهمة المدخل لا تحجز اليوم كله: حتى وقت ترك العمل العادي يعمل الشخص كالمعتاد ولا يحصل إلا على أنشطة تنتهي قبل ذلك.|Il servizio ingresso non blocca tutta la giornata: fino alla fine del servizio normale la persona lavora come sempre e riceve solo attività che finiscono entro quell'ora.|Serviciul la intrare nu blochează toată ziua: până la ora de părăsire a activității normale persoana lucrează ca de obicei și primește doar activități terminate până atunci.|Giriş görevi bütün günü kapatmaz: normal görevden ayrılma saatine kadar kişi normal çalışır ve yalnızca o saate kadar biten aktiviteleri alır.|Služba pri vchode neblokuje celý deň: do konca bežnej práce človek pracuje normálne a dostane len aktivity, ktoré dovtedy skončia.|Dežurstvo na ulazu ne zauzima ceo dan: do kraja redovnog rada osoba radi normalno i dobija samo aktivnosti koje se do tada završe.|Чергування на вході не займає весь день: до кінця звичайної роботи людина працює як завжди й отримує лише заняття, що до того часу закінчуються.|入口值班不会占用整天：在离开常规工作的时间之前照常工作，只会安排到那时已结束的活动。|प्रवेश ड्यूटी पूरा दिन नहीं रोकती: सामान्य काम छोड़ने के समय तक व्यक्ति सामान्य रूप से काम करता है और केवल वही गतिविधियाँ पाता है जो तब तक खत्म हो जाएँ।\nentrance_levels_hint|These are the hotel's times. A team can have its own ({teams}), and one entrance duty its own ({dayplan}).|Das sind die Zeiten des Hotels. Ein Team kann eigene haben ({teams}), ein einzelner Eingangsdienst ebenfalls ({dayplan}).|Это время отеля. У команды может быть своё ({teams}), и у отдельного дежурства тоже ({dayplan}).|To godziny hotelu. Zespół może mieć własne ({teams}), a pojedynczy dyżur również ({dayplan}).|To jsou časy hotelu. Tým může mít vlastní ({teams}) a jednotlivá služba také ({dayplan}).|Dit zijn de tijden van het hotel. Een team kan eigen tijden hebben ({teams}), en één ingangsdienst ook ({dayplan}).|Ce sont les horaires de l'hôtel. Une équipe peut avoir les siens ({teams}), et un accueil précis aussi ({dayplan}).|هذه أوقات الفندق. يمكن أن يكون للفريق أوقاته الخاصة ({teams})، ولمهمة مدخل واحدة أيضًا ({dayplan}).|Questi sono gli orari dell'hotel. Un team può avere i propri ({teams}), e un singolo servizio ingresso anche ({dayplan}).|Acestea sunt orele hotelului. O echipă poate avea propriile ore ({teams}), la fel și un singur serviciu la intrare ({dayplan}).|Bunlar otelin saatleri. Bir ekibin kendi saatleri olabilir ({teams}), tek bir giriş görevinin de ({dayplan}).|Toto sú časy hotela. Tím môže mať vlastné ({teams}) a jednotlivá služba tiež ({dayplan}).|Ovo su vremena hotela. Tim može imati svoja ({teams}), a i pojedinačno dežurstvo ({dayplan}).|Це час готелю. Команда може мати свій ({teams}), і окреме чергування теж ({dayplan}).|这是酒店的时间。团队可以有自己的时间（{teams}），单次入口值班也可以（{dayplan}）。|ये होटल के समय हैं। किसी टीम के अपने समय हो सकते हैं ({teams}), और एक प्रवेश ड्यूटी के भी ({dayplan})।\ntime_default_team|Empty = {x} (the team's or hotel's time)|Leer q|Delete this person? Someone with history (attendance, pay, tickets…) is marked Left instead and keeps everything.|Diese Person löschen? Wer Daten hat (Anwesenheit, Gehalt, Lose …), wird stattdessen als „Ausgeschieden“ markiert und behält alles.|Удалить этого человека? Тот, у кого есть история (посещаемость, зарплата, билеты…), будет отмечен как ушедший, и всё сохранится.|Usunąć tę osobę? Osoba z historią (obecność, pensja, losy…) zostanie oznaczona jako odeszła i wszystko zostanie.|Smazat tuto osobu? Kdo má historii (docházka, mzda, lístky…), bude místo toho označen jako odešel a vše zůstane.|Deze persoon verwijderen? Wie geschiedenis heeft (aanwezigheid, salaris, loten…) wordt als vertrokken gemarkeerd en houdt alles.|Supprimer cette personne ? Quelqu'un avec un historique (présences, salaire, tickets…) est marqué parti et tout est conservé.|حذف هذا الشخص؟ من لديه سجل (حضور، راتب، تذاكر…) يُعلَّم كمغادر بدلاً من ذلك ويبقى كل شيء.|Eliminare questa persona? Chi ha una storia (presenze, paga, biglietti…) viene segnato come uscito e tutto resta.|Ștergi această persoană? Cine are istoric (prezență, salariu, bilete…) este marcat ca plecat și totul rămâne.|Bu kişi silinsin mi? Geçmişi olan (devam, maaş, biletler…) bunun yerine ayrıldı olarak işaretlenir ve her şey korunur.|Vymazať túto osobu? Kto má históriu (dochádzka, mzda, lístky…), bude namiesto toho označený ako odišiel a všetko zostane.|Obrisati ovu osobu? Ko ima istoriju (prisustvo, plata, tiketi…) biće označen kao otišao i sve ostaje.|Видалити цю людину? Той, хто має історію (відвідуваність, зарплата, квитки…), буде позначений як такий, що пішов, і все збережеться.|删除此人？有记录（考勤、工资、票券……）的人员将改为标记为已离职，所有内容都会保留。|इस व्यक्ति को हटाएँ? जिसका इतिहास है (हाज़िरी, वेतन, टिकट…) उसे छोड़ चुका चिह्नित किया जाता है और सब बना रहता है।\ndelete_stay_q|Delete this guest stay and its bookings?|Diesen Aufenthalt mit Buchungen löschen?|Удалить проживание гостя и его брони?|Usunąć pobyt gościa i rezerwacje?|Smazat pobyt hosta i rezervace?|Dit verblijf en de boekingen verwijderen?|Supprimer ce séjour et ses réservations ?|حذف إقامة الضيف وحجوزاته؟|Eliminare il soggiorno e le prenotazioni?|Ștergi șederea și rezervările?|Bu konaklama ve rezervasyonları silinsin mi?|Odstrániť pobyt hosťa aj rezervácie?|Obrisati boravak gosta i rezervacije?|Видалити проживання гостя та бронювання?|删除此住宿及其预订？|यह अतिथि प्रवास और उसकी बुकिंग हटाएँ?\ndelete_weekly_q|Delete this weekly item? Future dates without bookings are removed; past dates stay.|Diesen wöchentlichen Punkt löschen? Künftige Termine ohne Buchung werden entfernt, vergangene bleiben.|Удалить еженедельное? Будущие даты без броней удалятся, прошлые останутся.|Usunąć pozycję cotygodniową? Przyszłe terminy bez rezerwacji znikną, przeszłe zostaną.|Smazat týdenní položku? Budoucí termíny bez rezervací zmizí, minulé zůstanou.|Dit wekelijkse item verwijderen? Toekomstige data zonder boekingen verdwijnen, oude blijven.|Supprimer ce rendez-vous hebdo ? Les dates futures sans réservation sont retirées, les passées restent.|حذف هذه الفقرة الأسبوعية؟ تُزال المواعيد القادمة غير المحجوزة وتبقى السابقة.|Eliminare l'attività settimanale? Le date future senza prenotazioni spariscono, le passate restano.|Ștergi activitatea săptămânală? Datele viitoare fără rezervări dispar, cele trecute rămân.|Haftalık etkinlik silinsin mi? Rezervasyonsuz gelecek tarihler kalkar, geçmiş kalır.|Odstrániť týždennú položku? Budúce termíny bez rezervácií zmiznú, minulé zostanú.|Obrisati nedeljnu stavku? Budući termini bez rezervacija se brišu, prošli ostaju.|Видалити щотижневе? Майбутні дати без бронювань зникнуть, минулі залишаться.|删除此每周项目？未来无预订的日期将被移除，过去的保留。|यह साप्ताहिक आइटम हटाएँ? बिना बुकिंग वाली आगे की तारीख़ें हटेंगी, पुरानी रहेंगी।\ndeny|Deny|Verbieten|Запретить|Zabroń|Zakázat|Weigeren|Refuser|منع|Nega|Interzice|Engelle|Zakázať|Zabrani|Заборонити|禁止|मना करें\ndepartment|Department|Abteilung|Отдел|Dział|Oddělení|Afdeling|Service|القسم|Reparto|Departament|Departman|Oddelenie|Odeljenje|В ions, compétences, jours de repos, congés, absences, service d'entrée, conflits d'horaire, une activité par moment de la journée et règles de genre. Parmi les personnes autorisées, il privilégie la rotation et une charge égale.|يستخدم المخطط موظفي الفريق الحالي فقط ولا يكسر أي قاعدة: الصلاحيات، المهارات، أيام الراحة، الإجازات، الغياب، مناوبة المدخل، تعارض الأوقات، نشاط واحد في كل فترة من اليوم، وقواعد الجنس. ومن بين المسموح لهم يفضّل التناوب وتوزيع العمل بالتساوي.|Il pianificatore usa solo il personale del team attuale e non viola mai una regola: permessi, competenze, giorni liberi, ferie, assenze, servizio all'ingresso, sovrapposizioni di orario, un'attività per parte della giornata e regole di genere. Tra chi è abilitato preferisce la rotazione e un carico uniforme.|Planificatorul folosește doar personalul echipei curente și nu încalcă nicio regulă: permisiuni, abilități, zile libere, concediu, absențe, serviciu la intrare, suprapuneri de orar, o activitate pe parte a zilei și reguli de gen. Dintre cei cu voie, preferă rotația și munca egală.|Planlayıcı yalnızca mevcut ekibin personelini kullanır ve hiçbir kuralı çiğnemez: yetkiler, beceriler, izin günleri, tatil, devamsızlık, giriş görevi, saat çakışmaları, günün her bölümünde bir aktivite ve cinsiyet kuralları. İzinli olanlar arasında rotasyonu ve eşit iş yükünü tercih eder.|Plánovač používa len ľudí aktuálneho tímu a nikdy neporuší pravidlo: oprávnenia, zručnosti, voľné dni, dovolenka, neprítomnosť, služba pri vchode, časové kolízie, jedna aktivita na časť dňa a pravidlá pohlavia. Spomedzi oprávnených uprednostňuje rotáciu a rovnomernú záťaž.|Planer koristi samo osoblje trenutnog tima i nikad ne krši pravilo: dozvole, veštine, slobodni dani, odmor, odsustvo, dežurstvo na ulazu, vremenska preklapanja, jedna aktivnost po delu dana i pravila pola. Među onima koji smeju, bira rotaciju i ravnomerno opterećenje.|Планувальник бере лише працівників поточної команди й ніколи не порушує правил: дозволи, навички, вихідні, const D = {
  add(d, n) { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); },
  wd(d) { return (new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7; },          // 0 = Monday
  diff(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5); },
  fmt(d, o) { if (!d) return ''; try { return new Intl.DateTimeFormat(locale(), Object.assign({ timeZone: 'UTC' }, o)).format(new Date(String(d).slice(0, 10) + 'T00:00:00Z')); } catch { return d; } },
  long(d) { return D.fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }); },
  short(d) { return D.fmt(d, { weekday: 'short', day: 'numeric', month: 'short' }); },
  dm(d) { return D.fmt(d, { day: 'numeric', month: 'short' }); },
  wdName(i, len = 'long') { return D.fmt(D.add('2024-01-01', i), { weekday: len }); },     // 2024-01-01 was a Monday
  /* a weekday in two letters where that is safe (Latin, Cyrillic, Greek); other scripts use their own one-letter form (cutting Arabic gives "ال" every day) */
  wdShort(i) { const n = D.wdName(i, 'short').replace(/\.$/, ''); return /^[\p{Script=Latin}\p{Script=Cyrillic}\p{Script=Greek}]+$/u.test(n) ? n.slice(0, 2) : D.wdName(i, 'narrow'); },   // Arabic خ ج, Chinese 四 五 …
  range(a, n) { return Array.from({ length: n }, (_, i) => D.add(a, i)); },
  month(d) { return String(d).slice(0, 7); },
  stamp(ts) { if (!ts) return ''; try { return new Intl.DateTimeFormat(locale(), { dateStyle: 'medium', timeStyle: 'short', timeZone: hotelTz() }).format(new Date(ts)); } catch { return ts; } },
  today() { try { return new Intl.DateTimeFormat('en-CA', { timeZone: hotelTz(), year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); } catch { return S.today || new Date().toISOString().slice(0, 10); } }

/* ---------- API: every call is a checked database function ---------- */
class ApiError extends Error { constructor(code, info) { super(code); this.code = code; this.info = info || {}; } }
async function rpc(fn, args = {}) {
  let r;
  try {
    r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
  } catch { throw new ApiError('offline'); }
  if (!r.ok) {
    let msg = ''; try { msg = (await r.json()).message || ''; } catch { /* empty */ }
    throw new ApiError(r.status === 404 ? 'not_installed' : 'server', { msg });
  }
  const j = await r.json();
  if (j && j.ok === false) {
    if (j.error === 'signin' && S.token && fn !== 'staff_login' && S.mode === 'staff') sessionEnded();
    throw new ApiError(j.error, j);
  }

  if (code === 'number_taken') return t('err_number_taken', { name: e.info.by || '', hotel: e.info.hotel || '' });
  if (code === 'full') return t('err_full', { n: e.info.left ?? 0 });
  const raw = code + ' ' + (e?.info?.msg || '');   // a refusal raised by the database arrives as a server message: read its reason too
  if (/staff_other_hotel/.test(raw)) return t('err_staff_other_hotel');
  if (/staff_other_team/.test(raw)) return t('err_staff_other_team');
  if (/entrance_times/.test(raw)) return t('err_entrance_times');

    if (f.type === 'offers') { out[f.k] = $$(`[data-offers="${f.k}"] .offer-row`, root).map(r => ({ qty: +$('[data-q]', r).value, price: $('[data-p]', r).value === '' ? NaN : +$('[data-p]', r).value })).filter(o => o.qty > 1 && o.price >= 0).sort((a, b) => a.qty - b.qty); continue; }
    if (f.type === 'multi') { out[f.k] = $$(`[data-multi="${f.k}"] input:checked`, root).map(i => (f.num ? +i.value : i.value)); continue; }
    if (f.type === 'theme') { out[f.k] = $(`[data-themepick="${f.k}"] input:checked`, root)?.value ?? null; continue; }
    if (f.type === 'icon') { out[f.k] = $(`[data-iconpick="${f.k}"] input:checked`, root)?.value || null; continue; }

      if (f.req && !v.length) throw new ApiError('required', { field: f.label || t(f.k) });

    }
    if (f.type === 'i18n') {
      const o = {}; $$(`[data-i18n="${f.k}"]`, root).forEach(i => { if (i.value.trim()) o[i.dataset.lang] = i.value.trim(); }); out[f.k] = o; continue;
    }

    let v = f.type === 'bool' ? el.checked : el.value;
    if (f.type === 'color' && el.dataset.empty === '1') v = null;
    if (typeof v === 'string') v = v.trim();
    if (f.type === 'number' || f.num) v = v === '' ? null : Number(v);
    if (f.type === 'stars') v = v === '' ? null : Number(v);
    if (v === '' && f.type !== 'text' && f.type !== 'textarea') v = null;
    if (f.req && (v == null || v === '')) throw new ApiError('required', { field: f.label || t(f.k) });

async function shrink(file, max = 1600) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}
async function uploadImage(file) {
  if (!/^image\//.test(file.type)) throw new ApiError('image');
  const blob = await shrink(file);
  const { prefix } = await api('upload_ticket');
  const path = `${prefix}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}.jpg`;
  const r = await fetch(`${CFG.url}/storage/v1/object/${CFG.bucket}/${path}`, {
    method: 'POST', body: blob,
    headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }
  });
  if (!r.ok) throw new ApiError('upload');
  return `${CFG.url}/storage/v1/object/public/${CFG.bucket}/${path}`;
}

    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }

/* ONE WhatsApp link for every phone number (Fast Action contacts, team, staff search, the hotel's own number for guests).

/* ---- planner.js ---- */
/* =====================================================================
   SMART PLANNER — ONE planning engine for every hotel and team.
   It always thinks in two steps:
   A) WHO MAY do it (hard rules, never broken to fill a place):
      the database's one rule list (_eligibility: hotel, team, active, employed that day, may be
      planned for this type = role + personal Allow/Deny, skill / I can't, day off / vacation /
      absent / sick, entrance duty = the item must end by the leave-operation time, gender) + what depends on the plan itself, checked here
      exactly as the database checks it again on saving (_conflict_reason): already on the item,
      overlapping times, the most per day, the most activities per part of the day.
   B) WHO IS BEST among those (soft preferences): rotation (the same activity yesterday, this week,
      the same start time), workload per working day, parts of the day, types, categories, and
      keeping people with rare skills free for what only they can do.
   The whole period is planned together: the hardest places first, then the plan is improved by
   moving and swapping people while every hard rule still holds. Recent assignment history (14 days
   before, 2 after) is the rotation memory. Three weightings give three plans (A balanced, B variety,
   C coverage). Nothing is saved here: the chosen plan is checked again row by row in the database.
   ===================================================================== */
const PLAN_TYPES = ['activity', 'event', 'show', 'live_music', 'special_event'];
/* how much each soft preference counts in each plan (hard rules are the same for all three).
   rot = the same activity again: [same day, next day, 2 days, 3–7 days, 8–14 days]; time = the same start time [next day, within a week] */
const PLAN_PROFILES = {
  A: { rot: [30, 60, 20, 8, 2], time: [6, 2], load: 12, op: 4, type: 3, cat: 2, gender: 40, scarce: 300, unfilled: 5000, depth: 1, passes: 6 },
  B: { rot: [60, 120, 50, 25, 6], time: [15, 6], load: 4, op: 6, type: 2, cat: 8, gender: 40, scarce: 300, unfilled: 5000, depth: 1, passes: 6 },
  C: { rot: [15, 30, 8, 3, 1], time: [2, 1], load: 6, op: 2, type: 1, cat: 1, gender: 40, scarce: 500, unfilled: 50000, depth: 2, passes: 8 }
};
const DYNAMIC = ['conflict', 'max_day', 'max_op'];
const PERMISSION_REASONS = ['not_allowed', 'other_team', 'other_hotel', 'inactive', 'not_employed'];

function planAssignments(input) {
  const { items = [], staff = [], refused = [], rules = {}, mode = 'fill', maxPerDay = null, maxPerOp = null, history = [] } = input;
  const W = PLAN_PROFILES[input.profile] || PLAN_PROFILES.A;
  const toMin = s => { if (!s) return null; const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
  const dayNo = d => Math.round(Date.parse(String(d).slice(0, 10) + 'T00:00:00Z') / 864e5);
  const opBound = [toMin(input.ops?.afternoon || '13:00'), toMin(input.ops?.evening || '18:00')];
  const partOf = m => (m < opBound[0] ? 'morning' : m < opBound[1] ? 'afternoon' : 'evening');
  const keyOf = x => String(x.name || '').trim().toLowerCase().replace(/\s+/g, ' ');     // "the same activity" = the same name (weekly or one-off)
  // the database's answer: item|staff → reason (entrance duty carries its leave-operation time: 'entrance@16:00')
  const rule = new Map(refused.map(r => [r.i + '|' + r.s, r.x ? r.r + '@' + r.x : r.r]));

  const nDays = Number.isFinite(from) && Number.isFinite(to) ? to - from + 1 : 1;

    const dn = dayNo(it.date);

  }

     with running totals per person (work in the period, per part of the day, type, category) so a change is priced in one step */
  const byPerson = new Map(staffIds.map(id => [id, []])), byPD = new Map(), onItem = new Map(), agg = new Map();
  let eid = 0;
  const pd = (sid, dn) => sid + '|' + dn;
  const tally = (e, k) => {

    if (!byPerson.has(e.sid)) byPerson.set(e.sid, []); byPerson.get(e.sid).push(e);
    const k = pd(e.sid, e.dn); if (!byPD.has(k)) byPD.set(k, []); byPD.get(k).push(e);

  const drop = (l, x) => l.splice(l.indexOf(x), 1);

  const entry = (sid, v, fixed, extra) => Object.assign({ id: ++eid, sid, itemId: v.id, dn: v.dn, s: v.s, e: v.e, st: v.st, key: v.key, type: v.type, op: v.op, cats: v.cats, fixed, inRange: v.dn >= from && v.dn <= to }, extra);
  // rotation memory: the database's recent history of these people (items outside the list on screen)
  for (const h of history) {
    if (view.has(h.i) || !staffById.has(h.s)) continue;
    const s = toMin(h.start_time); let e = h.end_time ? toMin(h.end_time) : s + 60; if (e <= s) e = 24 * 60;
    add(entry(h.s, { id: 'h' + h.i, dn: dayNo(h.date), s, e, st: String(h.start_time).slice(0, 5), key: keyOf(h), type: h.type, op: partOf(s), cats: h.cats || [] }, true, { history: true }));
  }

  const keptEntries = [];

    const v = view.get(it.id); if (!v.live) continue;
    for (const a of it.staff || []) {

  const hardFor = (sid, v) => ((onItem.get(v.id) || []).includes(sid) ? 'already' : hardRules(sid, v));
  const hardRules = (sid, v) => {

  /* STEP B — what an assignment costs the plan (lower = better), priced only against what it touches:

    if (!rules.gender_rules || v.it.gender_rule !== 'mixed' || (v.it.staff_needed || 0) < 2) return 0;
    const ids = (onItem.get(v.id) || []).filter(id => id !== minus).concat(plus != null ? [plus] : []);
    const g = new Set(ids.map(id => staffById.get(id)?.gender).filter(Boolean));

  /* the places to fill */
  const live = items.filter(it => view.get(it.id).live && (it.staff_needed || 0) > 0);
  const plannable = live.filter(it => !view.get(it.id).locked);
  const slots = [];
  for (const it of plannable) { const need = Math.max(0, it.staff_needed - (onItem.get(it.id) || []).length); for (let k = 0; k < need; k++) slots.push({ v: view.get(it.id), e: null }); }
  const empty = slots.length;
  // candidates of a slot right now
  const cands = sl => staffIds.filter(sid => !hardFor(sid, sl.v));
  // taking slot sl would stop sid from doing another open place that day: how much that hurts (rare people are kept free)
  const scarcity = (sid, sl, sameDay) => {
    let p = 0; const e = entry(sid, sl.v, false); add(e);

  const tie = (sid, v) => ((sid * 7919 + v.dn * 31 + v.s) % 97) / 1000;           // stable tie-break that rotates by day

  if (!input.dryRun) {

    const open = new Set(slots);

    }

    const filledSlots = () => slots.filter(s => s.e), emptySlots = () => slots.filter(s => !s.e);
    const tryFill = (sl, depth) => {

  }

  const didDayBefore = (sid, v) => (byPerson.get(sid) || []).some(e => e.key === v.key && e.dn === v.dn - 1);
  // could someone else have done it without a repeat? (allowed, free at that time, did not do it the day before)

  const loadOf = sid => (byPerson.get(sid) || []).filter(e => e.inRange).length;

    const v = sl.v, sid = sl.e.sid, out = [];
    out.push({ k: 'eligible', time: v.st });
    const prev = (byPerson.get(sid) || []).filter(e => e !== sl.e && e.key === v.key && e.dn < v.dn).sort((a, b) => b.dn - a.dn)[0];
    if (!prev) out.push({ k: 'not_recent', name: v.it.name });

      out.push({ k: repeatFree(v, sl.e) ? 'repeat' : 'repeat_needed', name: v.it.name });
