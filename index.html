<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E2A1E">
<meta name="description" content="Hotel entertainment programme, bookings and team app">
<title>AUREA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#3E2A1E;--a:#B98A5C;--bg:#F7F2EA;--s:#fff;--soft:#E8DCC9;--tx:#2A1D14;--mut:color-mix(in srgb,var(--tx) 58%,transparent);--line:color-mix(in srgb,var(--tx) 13%,transparent);
  --ok:#3F7D4E;--bad:#A8432F;--warn:#9A6B12;--r:14px;--rb:12px;--disp:'Cormorant Garamond',Georgia,serif;--ui:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;--safe-b:env(safe-area-inset-bottom,0px)}
[data-font=modern]{--disp:'Jost',system-ui,sans-serif}
[data-font=classic]{--ui:Georgia,'Times New Roman',serif}
[dir=rtl]{--disp:'Tajawal','Cormorant Garamond',serif;--ui:'Tajawal',system-ui,sans-serif}
[data-btn=pill]{--rb:999px}[data-btn=square]{--rb:4px;--r:6px}
[data-dark="1"]{--line:color-mix(in srgb,var(--tx) 18%,transparent)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--ui);min-height:100vh}
a{color:inherit}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:600;line-height:1.15;margin:0 0 .5em}
.pg-title{font-size:2.1rem;letter-spacing:-.01em;margin:.2em 0 .6em}
h2{font-size:1.35rem}h3{font-size:1.1rem}
section{margin:1.4rem 0}
.muted{color:var(--mut)}.small,small{font-size:.84rem}.center{text-align:center}.grow{flex:1}
/* top bar */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;padding-top:calc(.55rem + env(safe-area-inset-top,0px));background:var(--p);color:var(--bg)}
[data-dark="1"] #top{background:var(--s);color:var(--tx);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;min-width:0;flex:1}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--s)}
.brand span{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--disp);font-size:1.35rem;font-weight:600;letter-spacing:.02em;line-height:1}
.brand small{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.78rem}
.top-r{display:flex;gap:.3rem;align-items:center}
.icon-btn{background:none;border:0;min-width:40px;height:40px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;position:relative;font-size:.85rem;font-weight:600;letter-spacing:.04em}
.bell i,.dot{position:absolute;top:2px;right:0;background:var(--a);color:#fff;font-style:normal;font-size:.68rem;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 3px}
.dot{position:static;display:inline-grid;margin-inline-start:.35rem}
#ctx{background:color-mix(in srgb,var(--p) 8%,var(--bg));border-bottom:1px solid var(--line);font-size:.86rem}
.ctx-line{display:flex;gap:.8rem;flex-wrap:wrap;padding:.4rem 1rem;align-items:center;color:var(--mut)}
.ctx-line label{display:flex;gap:.4rem;align-items:center}
.ctx-line select{border:1px solid var(--line);background:var(--s);border-radius:8px;padding:.25rem .4rem;max-width:12rem}
.preview-bar{background:var(--a);color:#fff;padding:.4rem 1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between}
/* layout */
.layout{display:flex;max-width:1180px;margin:0 auto}
#side{display:none}
#view{flex:1;min-width:0;padding:1rem 1rem calc(5.5rem + var(--safe-b))}
.page{max-width:900px;margin:0 auto}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--s);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:.45rem .2rem .5rem;text-decoration:none;font-size:.7rem;color:var(--mut);position:relative;min-width:0;text-align:center}
#tabbar a span{font-size:1.25rem;line-height:1.2}
#tabbar a.on{color:var(--p)}
[data-dark="1"] #tabbar a.on{color:var(--a)}
#tabbar a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--a)}
@media (min-width:960px){
  #side{display:block;width:240px;flex:none;padding:1rem .6rem;position:sticky;top:58px;align-self:flex-start;max-height:calc(100vh - 58px);overflow:auto}
  #tabbar{display:none}#view{padding-bottom:2rem}
}
.menu-all section,#side section{margin:0 0 1rem}
.menu-all h3,#side h3{font-family:var(--ui);font-size:.75rem;font-weight:600;color:var(--mut);margin:.6rem .6rem .3rem;letter-spacing:.06em}
.menu-all a,#side a{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:10px;text-decoration:none}
.menu-all a{background:var(--s);border:1px solid var(--line);margin-bottom:.35rem;padding:.75rem .9rem}
.menu-all a span,#side a span{width:1.3rem;text-align:center;color:var(--a)}
#side a.on{background:color-mix(in srgb,var(--a) 16%,transparent);font-weight:500}
#side a:hover{background:color-mix(in srgb,var(--a) 9%,transparent)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--p);background:var(--p);color:var(--bg);padding:.6rem 1.05rem;border-radius:var(--rb);cursor:pointer;text-decoration:none;font-weight:500;min-height:44px;line-height:1.1}
[data-dark="1"] .btn{background:var(--a);border-color:var(--a);color:#1b130d}
.btn.ghost{background:transparent;color:var(--p);border-color:color-mix(in srgb,var(--p) 35%,transparent)}
[data-dark="1"] .btn.ghost{color:var(--tx);border-color:var(--line)}
.btn.small{padding:.35rem .7rem;min-height:34px;font-size:.88rem}
.btn.wide{width:100%}
.btn.danger,.danger{color:var(--bad)!important;border-color:color-mix(in srgb,var(--bad) 45%,transparent)!important}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .6rem;scrollbar-width:none;align-items:center}
.chip-btn{border:1px solid var(--line);background:var(--s);border-radius:999px;padding:.35rem .85rem;white-space:nowrap;cursor:pointer;min-height:36px}
.chip-btn.on{background:var(--p);color:var(--bg);border-color:var(--p)}
.chip{display:inline-block;font-size:.74rem;padding:.08rem .5rem;border-radius:999px;background:var(--soft);color:var(--tx);white-space:nowrap;vertical-align:middle}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,var(--s));color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,var(--s));color:var(--bad)}
.ty-activity{background:#E6E3D3}.ty-event{background:#F0DCC8}.ty-show{background:#E7D4E0}.ty-live_music{background:#D8E3E6}.ty-special_event{background:#F3E3B5}
[data-dark="1"] .chip{background:var(--soft);color:var(--tx)}
.st-working{background:color-mix(in srgb,var(--ok) 15%,var(--s))}.st-day_off{background:var(--soft)}.st-vacation{background:#DCE6F0}.st-absent,.st-sick{background:color-mix(in srgb,var(--bad) 15%,var(--s))}.st-entrance{background:#F3E3B5}.st-practice{background:#E7D4E0}
[data-dark="1"] .st-vacation,[data-dark="1"] .st-entrance,[data-dark="1"] .st-practice,[data-dark="1"] [class^=ty-]{color:#2a1d14}
/* tabs */
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:.55rem .85rem;text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;color:var(--mut)}
.tabs a.on{color:var(--tx);border-color:var(--a);font-weight:500}
/* day strip: the signature element */
.daystrip{display:flex;gap:.35rem;overflow-x:auto;padding:.2rem 0 .8rem;scrollbar-width:none;scroll-snap-type:x proximity}
.daystrip button{flex:none;width:4.1rem;border:1px solid var(--line);background:var(--s);border-radius:var(--r);padding:.4rem .2rem .45rem;display:flex;flex-direction:column;align-items:center;cursor:pointer;scroll-snap-align:start}
.daystrip span{font-size:.72rem;color:var(--mut);text-transform:capitalize}
.daystrip b{font-family:var(--disp);font-size:1.75rem;font-weight:600;line-height:1}
.daystrip small{font-size:.66rem;color:var(--mut)}
.daystrip button.on{background:var(--p);border-color:var(--p);color:var(--bg)}
.daystrip button.on span,.daystrip button.on small{color:inherit;opacity:.8}
/* items */
.items{display:flex;flex-direction:column;gap:.45rem}
.item{display:flex;gap:.9rem;align-items:flex-start;padding:.75rem .9rem;background:var(--s);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;text-align:start;width:100%;cursor:pointer}
.item time{font-family:var(--disp);font-size:1.45rem;font-weight:600;min-width:3.4rem;line-height:1;display:flex;flex-direction:column}
.item time small{font-family:var(--ui);font-size:.72rem;color:var(--mut);font-weight:400;margin-top:.2rem}
.item b{display:block;font-weight:500}
.item .meta{display:block;font-size:.84rem;color:var(--mut);margin:.15rem 0}
.item.hl{border-inline-start:3px solid var(--a)}
.item.cancelled{opacity:.55}.item.cancelled b{text-decoration:line-through}
.item.short{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.item .names{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem}
.fav{color:var(--a);margin-inline-start:.3rem}
.name-tag{display:inline-block;padding:.08rem .5rem;border-radius:6px;background:var(--soft);font-size:.82rem}
.name-tag.planner{background:color-mix(in srgb,var(--a) 22%,var(--s))}
.name-tag.busy{outline:2px solid var(--a)}
/* cards, lists, forms */
.card{background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.card+.card{margin-top:.8rem}
.narrow{max-width:440px;margin:0 auto}
.list{display:flex;flex-direction:column;gap:.35rem}
.li{display:block;background:var(--s);border:1px solid var(--line);border-radius:var(--rb);padding:.65rem .8rem;text-decoration:none;text-align:start;width:100%;font:inherit;cursor:default}
button.li,a.li{cursor:pointer}
.li p{margin:.25rem 0}
.li.dim,.dim{opacity:.55}
.li.new{border-inline-start:3px solid var(--a)}
.li.complaint{border-inline-start:3px solid var(--bad)}
.attention .li.bad{border-inline-start:3px solid var(--bad)}.attention .li.warn{border-inline-start:3px solid var(--warn)}.attention .li.info{border-inline-start:3px solid var(--a)}
.reply{background:var(--soft);border-radius:8px;padding:.35rem .6rem;font-size:.9rem}
.form{display:flex;flex-direction:column;gap:.75rem}
.field{display:flex;flex-direction:column;gap:.25rem}
.field label{font-size:.86rem;font-weight:500}
.field.check label{display:flex;gap:.5rem;align-items:center;font-weight:400;font-size:1rem}
input:not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.6rem .7rem;min-height:44px;width:100%}
[data-dark="1"] input,[data-dark="1"] select,[data-dark="1"] textarea{background:var(--bg)}
input[type=checkbox],input[type=radio]{width:1.2rem;height:1.2rem;accent-color:var(--p)}
input[type=color]{width:3rem;height:2.4rem;border:1px solid var(--line);border-radius:8px;background:none}
.hint{color:var(--mut)}
.row-mini{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.25rem 0}
.row-mini span{min-width:8rem}.row-mini input,.row-mini select{max-width:60%}
details.field summary,details summary{cursor:pointer;font-weight:500;padding:.3rem 0}
.img-pick{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.img-pick img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.stars-in{display:flex;gap:.2rem}.stars-in button{background:none;border:0;font-size:1.9rem;color:var(--line);cursor:pointer;padding:0 .1rem;min-height:44px}.stars-in button.on{color:var(--a)}
.stars{color:var(--a);letter-spacing:.05em}.stars i{color:var(--line);font-style:normal}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem;align-items:center}
.filters input,.filters select{width:auto;flex:1;min-width:9rem}
fieldset.perm-group{border:1px solid var(--line);border-radius:10px;margin:.6rem 0;padding:.4rem .8rem}
fieldset.perm-group legend{font-weight:600;padding:0 .3rem}
.perm-group .row-mini{justify-content:flex-start}
/* empty, loading, toast, modal */
.empty{text-align:center;padding:1.8rem 1rem;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}
.empty p{margin:0 0 .8rem}
.loading{display:flex;gap:.35rem;justify-content:center;padding:3rem}
.loading span{width:8px;height:8px;border-radius:50%;background:var(--a);animation:pulse 1s infinite alternate}
.loading span:nth-child(2){animation-delay:.2s}.loading span:nth-child(3){animation-delay:.4s}
@keyframes pulse{to{opacity:.2;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5rem + var(--safe-b));z-index:60;display:flex;flex-direction:column;gap:.4rem;width:min(92vw,420px)}
.toast{background:var(--p);color:var(--bg);padding:.7rem 1rem;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);transition:opacity .4s}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#fff}.toast.out{opacity:0}
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(20,12,6,.45);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--s);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;animation:up .18s ease-out}
.modal.wide{max-width:860px}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (min-width:700px){.modal-wrap{align-items:center}.modal{border-radius:18px}}
.modal header{display:flex;align-items:center;gap:.5rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.modal header h2{flex:1;margin:0;font-size:1.3rem}
.modal-body{padding:1rem;overflow:auto}
.modal footer{display:flex;gap:.5rem;align-items:center;padding:.7rem 1rem calc(.7rem + var(--safe-b));border-top:1px solid var(--line);flex-wrap:wrap}
/* people, avatars, gallery */
.ava{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.ava.xs{width:30px;height:30px}.ava.lg{width:84px;height:84px}
.ava.ini{display:inline-grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:1.15rem;color:var(--p)}
.ava.lg.ini{font-size:2rem}
.faces{display:flex;gap:.8rem;overflow-x:auto;padding-bottom:.4rem}
.faces a,.faces>span{display:flex;flex-direction:column;align-items:center;gap:.2rem;text-decoration:none;font-size:.78rem;min-width:62px;text-align:center}
.faces.small{margin:.6rem 0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.person{background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:1rem .7rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.3rem}
.person p{font-size:.86rem;margin:.2rem 0}
.profile-head{display:flex;gap:1rem;align-items:center}.profile-head b{font-family:var(--disp);font-size:1.5rem;display:block}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.4rem}
.gallery figure{margin:0}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
.gallery figcaption{font-size:.8rem;color:var(--mut)}
.strip{display:flex;gap:.4rem;overflow-x:auto}.strip img{height:110px;border-radius:10px;cursor:zoom-in}
.thumb{width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:.3rem;cursor:zoom-in}
.lightbox{text-align:center}.lightbox img{max-height:72vh;border-radius:8px}
.hero{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);margin-bottom:.8rem}
.more-link{display:inline-block;margin-top:.6rem;color:var(--a);font-weight:500}
.hello{font-family:var(--disp);font-size:1.5rem;margin:.2rem 0 .6rem}
.lead{font-size:1.08rem;max-width:62ch;line-height:1.6}
.prose{max-width:68ch;line-height:1.6}
.links{display:flex;flex-wrap:wrap;gap:.4rem}
.hotel-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.hotel-card{background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;cursor:pointer}
.hotel-card img{width:72px;height:72px;border-radius:50%;object-fit:cover}
.hotel-card .mono{width:72px;height:72px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--disp);font-size:2.2rem}
.hotel-card b{font-family:var(--disp);font-size:1.3rem}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.4rem}
.lang-grid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.7rem;cursor:pointer;min-height:44px}
.lang-grid button.on{background:var(--p);color:var(--bg)}
/* day cards, timelines, stats */
.today-card{display:flex;flex-direction:column;gap:.5rem}
.today-card b{font-family:var(--disp);font-size:1.6rem;display:block}
.today-card dl{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;margin:0}.today-card dt{color:var(--mut)}.today-card dd{margin:0}
.timeline{list-style:none;padding:0;margin:0;border-inline-start:2px solid var(--soft)}
.timeline li{padding:.25rem .8rem;position:relative}.timeline time{font-weight:600;margin-inline-end:.5rem}
.sched{display:flex;flex-direction:column;gap:.35rem}
.sched-day{display:flex;gap:.8rem;background:var(--s);border:1px solid var(--line);border-radius:var(--rb);padding:.55rem .8rem}
.sched-day.off{background:color-mix(in srgb,var(--soft) 55%,var(--s))}
.sched-day .d{width:2.8rem;text-align:center}.sched-day .d b{font-family:var(--disp);font-size:1.6rem;display:block;line-height:1}
.sched-day p{margin:.2rem 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.45rem;margin:.6rem 0}
.stats span{background:var(--s);border:1px solid var(--line);border-radius:var(--rb);padding:.55rem .7rem;font-size:.8rem;color:var(--mut);display:flex;flex-direction:column}
.stats b{font-family:var(--disp);font-size:1.5rem;color:var(--tx);font-weight:600}
.loadbar{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0}.loadbar span{background:var(--s);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;font-size:.82rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.7rem}.cols .card+.card{margin-top:0}
.bars div{display:grid;grid-template-columns:7rem 1fr 2rem;gap:.4rem;align-items:center;font-size:.85rem;margin:.2rem 0}
.bars span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars i{height:.6rem;background:var(--a);border-radius:4px}
.spark{display:flex;align-items:flex-end;gap:2px;height:80px}.spark i{flex:1;background:var(--a);border-radius:2px 2px 0 0;min-height:2px}
.rank{padding-inline-start:1.2rem}.rank li{display:flex;justify-content:space-between;max-width:320px}
/* tables & grids */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.4rem 0}
table{border-collapse:collapse;width:100%;background:var(--s);font-size:.9rem}
th,td{border:1px solid var(--line);padding:.4rem .5rem;text-align:start;vertical-align:middle}
thead th{background:color-mix(in srgb,var(--soft) 60%,var(--s));font-weight:500;white-space:nowrap}
table.grid select,table.grid input{min-height:34px;padding:.2rem .3rem;font-size:.85rem;min-width:5.5rem}
.status-grid td{padding:0;text-align:center}.status-grid td button{width:100%;min-height:40px;border:0;background:transparent;cursor:pointer;font-size:.82rem}
.status-grid td.set{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--p) 35%,transparent)}
.status-grid td i{font-style:normal;font-size:.68rem;background:var(--p);color:var(--bg);border-radius:4px;padding:0 .2rem;margin-inline-start:.15rem}
.status-grid th.today{background:color-mix(in srgb,var(--a) 22%,var(--s))}

.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:.3rem;margin:.6rem 0}

.sticky-act{position:sticky;bottom:calc(4.4rem + var(--safe-b));display:flex;align-items:center;justify-content:space-between;background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .8rem;box-shadow:0 4px 18px rgba(0,0,0,.08)}

.packs{display:flex;flex-direction:column;gap:.4rem}
.pack{display:flex;gap:.7rem;align-items:center;background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:.6rem .8rem;cursor:pointer;text-align:start}

.tickets{display:flex;flex-direction:column;gap:.4rem}

.score .row{justify-content:center}

.bus .times small{font-weight:400;color:var(--mut)}

.chat-in{display:flex;gap:.4rem;margin-top:.6rem;align-items:flex-end}
.log .li{font-size:.88rem}
.qr{display:inline-block;padding:12px;background:#fff;border-radius:12px}
code{background:var(--soft);padding:.1rem .35rem;border-radius:5px;font-size:.85rem;word-break:break-all}

.bingo-board{grid-template-columns:repeat(10,1fr)}.bingo-board span{display:grid;place-items:center;font-variant-numeric:tabular-nums;cursor:default}.bingo-board span.used{background:var(--soft);font-weight:600}.bingo-board span.last{background:var(--a);color:#fff}

.tile{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;padding:1rem;min-height:96px;background:var(--s);border:1px solid var(--line);border-radius:var(--r);text-decoration:none}

.pill{align-self:center;flex:none;font-size:.82rem;font-weight:600;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--line)}

.att select{width:auto;min-width:7.5rem;flex:none}

.g-hero .weather{border:0;padding:0;background:transparent;margin-top:.4rem}
.att{align-items:center}.att .grow{min-width:9rem}

    <header><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="${esc(t('close'))}">✕</button></header>
    <div class="modal-body">${body}</div>
    ${opts.save || opts.extra ? `<footer>${opts.danger ? `<button class="btn ghost danger" data-danger>${esc(opts.dangerLabel || t('delete'))}</button>` : ''}

  </div>`;
  document.body.appendChild(wrap);

  opts.mount && opts.mount(root, close);

  return { root, close };
}

async function shrink(file, max = 1600) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
}

  const r = await fetch(`${CFG.url}/storage/v1/object/${CFG.bucket}/${path}`, {

    headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }

function parseCsv(text) {

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }

/* ---- planner.js ---- */
/* =====================================================================
   SMART PLANNER — one planner for every hotel and team.
   The data it receives is already only the current hotel_id + team_id
   (the database sends nothing else). Rules: Role/Permissions (work_<type>),
   Skills, Day off, Vacation, Absent, Sick, Entrance duty, existing
   assignments, time conflicts, gender rule (if switched on), fairness.
   The database checks every saved row again (planner_apply).
   ===================================================================== */
function planAssignments(input) {
  const { items = [], staff = [], status = [], rules = {}, mode = 'fill' } = input;
  const toMin = s => { if (!s) return null; const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
  const span = it => { const a = toMin(it.start_time); let b = it.end_time ? toMin(it.end_time) : a + 60; if (b <= a) b = 24 * 60; return [a, b]; };
  const overlap = (x, y) => x[0] < y[1] && y[0] < x[1];
  const st = new Map(status.map(s => [s.staff_id + '|' + s.date, s]));
  const staffById = new Map(staff.map(s => [s.id, s]));
  const entrance = [toMin(rules.entrance_start || '16:00'), toMin(rules.entrance_end || '18:30')];
  const busy = new Map();           // staff|date → [[a,b]]
  const load = new Map();           // staff → count in range
  const tplCount = new Map();       // staff|template → count
  const tplDay = new Map();         // staff|template → set of dates
  const addBusy = (sid, it) => {
    const k = sid + '|' + it.date; if (!busy.has(k)) busy.set(k, []); busy.get(k).push(span(it).concat(it.id));
    load.set(sid, (load.get(sid) || 0) + 1);
    if (it.template_id) {
      const tk = sid + '|' + it.template_id; tplCount.set(tk, (tplCount.get(tk) || 0) + 1);
      if (!tplDay.has(tk)) tplDay.set(tk, new Set()); tplDay.get(tk).add(it.date);
    }
  };
  const sorted = input.dryRun ? [] : items.filter(it => it.status !== 'cancelled' && (it.staff_needed || 0) > 0)
    .slice().sort((a, b) => (a.date + a.start_time).localeCompare(b.date + b.start_time));
  // what stays: in 'fill' everything already planned; in 'replan' only manual choices
  const keep = new Map();
  for (const it of items) {
    const kept = (it.staff || []).filter(a => mode === 'fill' || a.source === 'manual');
    keep.set(it.id, kept.map(a => a.staff_id));
    kept.forEach(a => addBusy(a.staff_id, it));
  }
  const dayBefore = d => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() - 1); return x.toISOString().slice(0, 10); };
  const why = (s, it, already) => {
    if (already.includes(s.id)) return 'already';
    if (!s.work || !s.work['work_' + it.type]) return 'not_allowed';
    const ds = st.get(s.id + '|' + it.date);
    if (!ds || ds.status !== 'working') return ds ? ds.status : 'not_working';
    if (it.required_skill_id && !(s.skills || []).some(k => k.skill_id === it.required_skill_id)) return 'skill';
    if (rules.gender_rules && (it.gender_rule === 'male' || it.gender_rule === 'female') && s.gender !== it.gender_rule) return 'gender';
    const sp = span(it);
    if (ds.entrance && overlap(sp, entrance)) return 'entrance';
    if ((busy.get(s.id + '|' + it.date) || []).some(b => b[2] !== it.id && overlap(b, sp))) return 'conflict';
    return null;
  };
  const score = (s, it) => {
    let v = (load.get(s.id) || 0) * 10;
    if (it.template_id) {
      const tk = s.id + '|' + it.template_id;
      v += (tplCount.get(tk) || 0) * 3;
      if (tplDay.get(tk)?.has(dayBefore(it.date))) v += 6;          // avoid the same item two days in a row
    }
    if (it.required_skill_id) { const k = (s.skills || []).find(x => x.skill_id === it.required_skill_id); v -= (k ? k.level : 0); }
    v += ((s.id * 7919 + it.date.charCodeAt(9) * 31 + toMin(it.start_time)) % 97) / 1000;   // stable tie-break that rotates by day
    return v;
  };
  const rows = [], unfilled = [];
  for (const it of sorted) {
    const already = keep.get(it.id) || [];
    let need = (it.staff_needed || 0) - already.length;
    const chosen = [];
    while (need > 0) {
      let cands = staff.filter(s => !why(s, it, already.concat(chosen)));
      if (!cands.length) break;
      if (rules.gender_rules && it.gender_rule === 'mixed') {
        const have = already.concat(chosen).map(id => staffById.get(id)?.gender).filter(Boolean);
        const missing = ['male', 'female'].find(g => !have.includes(g));
        const pref = missing ? cands.filter(s => s.gender === missing) : [];
        if (pref.length) cands = pref;
      }
      cands.sort((a, b) => score(a, it) - score(b, it));
      const pick = cands[0];
      chosen.push(pick.id); addBusy(pick.id, it); rows.push({ item_id: it.id, staff_id: pick.id });
      need--;
    }
    if (need > 0) unfilled.push({ item_id: it.id, missing: need });
  }
  const loadObj = {}; staff.forEach(s => { loadObj[s.id] = load.get(s.id) || 0; });
  return { rows, unfilled, load: loadObj, replace: mode === 'replan' ? items.map(i => i.id) : null, why };
}
/* explain why someone cannot take an item (used in the manual assign dialog) */
function planWhy(input) { const ctx = planAssignments(Object.assign({}, input, { dryRun: true, mode: 'fill' })); return (s, item) => ctx.why(s, item, []); }
if (typeof module !== 'undefined') module.exports = { planAssignments, planWhy };

/* =====================================================================
   PAGES: written once, every page receives the current hotel/team from
   the session. The menu is built from Role + Permissions (+ menu builder).
   ===================================================================== */
const PAGES = {};
const page = (key, def) => { PAGES[key] = Object.assign({ key, mode: 'staff', group: 'my' }, def); };
const GROUPS = ['my', 'programme', 'team', 'guests', 'manage', 'admin'];
const pageTitle = p => (typeof p.title === 'function' ? p.title() : t(p.title || 'pg_' + p.key));
let current = { key: null, arg: '' };

function menuFor(roleKey) {
  const cfg = (S.preview ? [] : S.menu).filter(m => m.audience === roleKey);
  const cfgMap = new Map(cfg.map(m => [m.page_key, m]));
  const keys = Object.keys(PAGES);
  return Object.values(PAGES)
    .filter(p => p.mode === 'staff' && !p.hidden && can(p.perm) && (!p.show || p.show()))
    .map(p => ({ p, c: cfgMap.get(p.key) }))
    .filter(x => !(x.c && x.c.hidden))
    .sort((a, b) => (GROUPS.indexOf(a.p.group) - GROUPS.indexOf(b.p.group)) || ((a.c?.sort ?? 999) - (b.c?.sort ?? 999)) || (keys.indexOf(a.p.key) - keys.indexOf(b.p.key)))
    .map(x => ({ key: x.p.key, icon: x.p.icon, group: x.p.group, label: x.c?.label || pageTitle(x.p) }))
    .concat((S.preview ? [] : S.pages).map(cp => ({ key: 'cpage/' + cp.id, icon: cp.icon || '▤', group: 'team', label: cp.title })));
}
const roleKey = () => (S.preview ? S.preview.me.role_key : S.me?.role_key);

/* ---------- shell ---------- */
function renderShell() {
  applyTheme(S.mode === 'staff' ? S.settings : (S.g.home?.settings || {}));
  const st = S.mode === 'staff' ? S.settings : (S.g.home?.settings || {});
  const hotelName = S.mode === 'staff' ? S.hotel?.name : S.g.home?.hotel?.name;
  const logo = (S.mode === 'staff' ? S.hotel?.logo_url : S.g.home?.hotel?.logo_url);
  let right = `<button class="icon-btn" data-act="lang" aria-label="${esc(t('language'))}">${esc(S.lang.toUpperCase().slice(0, 2))}</button>`;
  if (S.mode === 'guest') {
    const unread = (S.g.me?.notifications || []).filter(n => !n.read).length;
    right = `<button class="icon-btn bell" data-act="g_notifs" aria-label="${esc(t('notifications'))}">🔔${unread ? `<i>${unread}</i>` : ''}</button>` + right;
  } else {
    const un = inbox.notifications.filter(n => !n.read).length;
    right = (S.preview ? '' : `<button class="icon-btn bell" data-act="s_notifs" aria-label="${esc(t('notifications'))}">🔔${un ? `<i>${un}</i>` : ''}</button>`)
      + `<button class="icon-btn" data-go="profile" aria-label="${esc(t('pg_profile'))}">${avatar(S.me?.photo_url, S.me?.display_name, 'xs')}</button>` + right;
  }
  $('#top').innerHTML = `<a class="brand" href="#/${S.mode === 'staff' ? homeKey() : 'g_home'}">${logo ? `<img src="${esc(logo)}" alt="">` : ''}
      <span><b>${esc(st.app_name || 'AUREA')}</b><small>${esc(st.subtitle || hotelName || '')}</small></span></a><div class="top-r">${right}</div>`;
  $('#ctx').innerHTML = S.mode === 'staff' ? ctxBar() : '';
  $('#ctx').hidden = S.mode !== 'staff';
  showOffline();
  renderNav();
}
function ctxBar() {
  const prev = S.preview ? `<div class="preview-bar">${esc(t('preview_of', { name: S.preview.me.display_name }))}<button class="btn small" data-act="preview_end">${esc(t('preview_end'))}</button></div>` : '';

}
document.addEventListener('change', async ev => {
  const s = ev.target.closest('[data-ctx]'); if (!s) return;
  try {
    if (s.dataset.ctx === 'hotel') await api('staff_context', { p_hotel_id: +s.value, p_team_id: null });

function renderNav() {
  const nav = $('#tabbar');
  if (S.mode === 'guest') {
    const items = [['g_home', '⌂', t('g_explore')]].concat(guestMenu().slice(0, 1).map(x => [x.key, x.icon, x.label]), [['g_stay', '♡', t('g_my_stay')], ['g_more', '≡', t('more')]]);
    const here = current.key + (current.arg ? '/' + current.arg : '');
    nav.innerHTML = items.map(([k, i, l]) => `<a href="#/${k}" class="${here === k || current.key === k ? 'on' : ''}"><span aria-hidden="true">${esc(i)}</span>${esc(l)}</a>`).join('');

    + `<a href="#/menu_all" class="${current.key === 'menu_all' ? 'on' : ''}"><span aria-hidden="true">≡</span>${esc(t('menu'))}${chatBadge ? `<i class="dot">${chatBadge}</i>` : ''}</a>`;
  $('#side').innerHTML = menuList(m);
}
function menuList(m) {
  return GROUPS.map(g => {
    const its = m.filter(x => x.group === g); if (!its.length) return '';
    return `<section><h3>${esc(t('grp_' + g))}</h3>${its.map(x => `<a href="#/${x.key}" class="${(current.key + (current.arg ? '/' + current.arg : '')).startsWith(x.key) ? 'on' : ''}"><span aria-hidden="true">${esc(x.icon || '•')}</span>${esc(x.label)}${x.key === 'chat' && chatBadge ? `<i class="dot">${chatBadge}</i>` : ''}</a>`).join('')}</section>`;
  }).join('') + `<section><a href="#/" data-act="signout"><span aria-hidden="true">⎋</span>${esc(t('sign_out'))}</a></section>`;
}
const homeKey = () => (menuFor(roleKey())[0]?.key || 'myday');

/* ---------- router ---------- */
let routeSeq = 0;
async function route() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  let [key, ...rest] = raw.split('/');
  const arg = rest.join('/');
  if (S.mode === 'setup') key = 'setup';
  else if (S.mode === 'guest') {
    const gp = PAGES[key];
    if (!gp || gp.mode === 'staff' || key === 'setup') key = 'g_home';
    if (!S.g.hotelId && key !== 'login') key = 'g_hotels';
  } else {
    const sp = PAGES[key];
    if (!sp || sp.mode !== 'staff') key = homeKey();
  }
  const p = PAGES[key];
  if (S.mode === 'staff' && p.mode === 'staff' && !(can(p.perm) && (!p.show || p.show()))) { location.hash = '#/' + homeKey(); return; }
  current = { key, arg };
  const seq = ++routeSeq;
  const view = $('#view');
  view.setAttribute('aria-busy', 'true');
  view.innerHTML = `<div class="loading" aria-label="${esc(t('loading'))}"><span></span><span></span><span></span></div>`;
  renderNav();
  try {
    const html = await p.render(arg);
    if (seq !== routeSeq) return;
    view.innerHTML = `<div class="page pg-${key}"><h1 class="pg-title">${esc(p.heading ? p.heading(arg) : pageTitle(p))}</h1>${html}</div>`;
    p.mount && p.mount(view, arg);
    wireForm(view);
  } catch (e) {
    if (seq !== routeSeq) return;
    console.warn(e);
    view.innerHTML = `<div class="page">${empty(errText(e), `<button class="btn" data-act="reload">${esc(t('try_again'))}</button>`)}</div>`;
  }
  view.removeAttribute('aria-busy');
  window.scrollTo(0, 0);
}
ACT.reload = () => route();
document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]'); if (!g) return;
  ev.preventDefault(); location.hash = '#/' + g.dataset.go;
});

/* ---------- staff inbox: messages + unread chat, one call, gentle refresh ---------- */
let chatBadge = 0, inbox = { notifications: [] }, inboxSeen = null;
async function pollStaff() {
  if (S.mode !== 'staff' || S.preview || document.hidden) return;
  try {
    const j = await api('staff_inbox');
    const before = inboxSeen || new Set(j.notifications.map(n => n.id));
    const fresh = j.notifications.filter(n => !n.read && !before.has(n.id));
    inboxSeen = new Set(j.notifications.map(n => n.id));
    const changed = j.chat_unread !== chatBadge || j.notifications.filter(n => !n.read).length !== inbox.notifications.filter(n => !n.read).length;
    inbox = j; chatBadge = j.chat_unread;
    fresh.forEach(n => { const v = notifView(n); toast(v.title); if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(v.title, { body: v.body }); } catch { /* ignore */ } } });
    if (changed) renderShell();
  } catch { /* offline: try later */ }
}
ACT.s_notifs = async () => {
  const ns = inbox.notifications;

async function bootGuest() {
  S.mode = 'guest';
  const j = await rpc('public_hotels');
  if (!j.hotels.length) {
    const s = await rpc('setup_status');
    if (s.needs_setup) { S.mode = 'setup'; applyTheme({}); $('#top').innerHTML = `<span class="brand"><span><b>AUREA</b><small>${esc(t('setup_title'))}</small></span></span><div class="top-r"><button class="icon-btn" data-act="lang">${esc(S.lang.toUpperCase().slice(0, 2))}</button></div>`; $('#tabbar').innerHTML = ''; return; }
  }
  S.g.hotels = j.hotels;
  const qh = new URLSearchParams(location.search).get('hotel');
  if (qh && j.hotels.some(h => String(h.id) === qh)) { S.g.hotelId = +qh; store.set('ghotel', S.g.hotelId); }
  if (!j.hotels.some(h => h.id === S.g.hotelId)) S.g.hotelId = j.hotels.length === 1 ? j.hotels[0].id : null;
  if (S.g.hotelId) await guestLoad();
  renderShell();
  if (!store.get('lang')) setTimeout(() => ACT.lang(), 200);
}
async function boot() {
  $('#view').innerHTML = `<div class="loading"><span></span><span></span><span></span></div>`;
  try {
    if (S.token) {
      try { await loadMe(); } catch (e) { if (e.code !== 'signin') throw e; signOutLocal(); }
    }
    if (S.mode === 'staff') { renderShell(); pollStaff(); } else await bootGuest();
  } catch (e) {
    $('#view').innerHTML = `<div class="page">${empty(errText(e), `<button class="btn" onclick="location.reload()">${esc(t('try_again'))}</button>`)}</div>`;
    return;
  }
  route();
}
window.addEventListener('DOMContentLoaded', boot);

/* ---- guest.js ---- */
/* =====================================================================
   GUEST APP — one guest app for every hotel (hotel_id chosen by the guest).
   A guest signs in with the room number (checked against the room list);
   the sign-in belongs to the stay, not to the room.
   ===================================================================== */
const gKey = () => store.get('gkey.' + S.g.hotelId);
async function guestLoad(from) {
  const h = await rpc('public_home', { p_hotel_id: S.g.hotelId, p_from: from || null, p_to: null });
  S.g.home = h; S.today = h.today; S.hotel = h.hotel;
  S.g.key = gKey();
  S.g.me = null;
  if (S.g.key) {
    try { S.g.me = await rpc('guest_me', { p_key: S.g.key }); } catch (e) { if (e.code === 'signin') { store.set('gkey.' + S.g.hotelId, null); S.g.key = null; } }
  }
  if (!store.get('lang') && h.settings?.default_lang) S.lang = h.settings.default_lang;
}
const gSet = () => S.g.home?.settings || {};
/* the ONE guest menu: on/off from Settings → Guest app parts, names and order from the menu builder */
const GUEST_PAGES = [['g_prog', '☷', 'programme', 'f_programme'], ['g_tickets', '◈', 'tickets', 'f_tickets'], ['g_info', 'ℹ', 'hotel_info', 'f_info'],
  ['g_feedback', '★', 'rate_your_stay', 'f_feedback'], ['g_team', '♟', 'our_team', 'f_team'], ['g_photos', '▣', 'photos', 'f_gallery'], ['g_quiz', '?', 'quiz_of_day', 'f_quiz'], ['g_songs', '♫', 'song_requests', 'f_songs']];
function guestMenu() {
  const st = gSet(); const cfg = new Map((S.g.home?.menu || []).map(m => [m.page_key, m]));
  return GUEST_PAGES.filter(p => st[p[3]] !== false).map(([key, icon, lk], i) => ({ key, icon, label: cfg.get(key)?.label || t(lk), sort: cfg.get(key)?.sort ?? i }))
    .concat((S.g.home?.pages || []).map((p, i) => ({ key: 'g_page/' + p.id, icon: p.icon || '▤', label: cfg.get('g_page/' + p.id)?.label || p.title, sort: cfg.get('g_page/' + p.id)?.sort ?? 50 + i })))
    .sort((a, b) => a.sort - b.sort);
}
const gItems = () => S.g.home?.items || [];
const gItem = id => gItems().find(i => String(i.id) === String(id));
const signedIn = () => !!(S.g.me && S.g.me.stay);
const myBooking = it => (S.g.me?.bookings || []).find(b => b.item_id === it.id && (b.status === 'booked' || b.status === 'waiting'));
const isFav = it => it.template_id && (S.g.me?.favourites || []).includes(it.template_id);

function itemRow(it, go = 'g_item') {
  const left = it.capacity > 0 ? Math.max(0, it.capacity - (+it.booked || 0)) : null;
  const staff = (it.staff || []).map(x => x.name).join(', ');
  let pill = '';
  if (S.mode === 'guest' && it.status === 'scheduled') {
    const b = myBooking(it);
    if (b) pill = `<span class="pill ok">${esc(t(b.status === 'waiting' ? 'waiting_list' : 'booked'))}</span>`;
    else if (it.booking_required) pill = left === 0 ? `<span class="pill bad">${esc(t('full'))}</span>` : `<span class="pill go">${esc(t('book'))}</span>`;
    else if (it.ticketed) pill = `<span class="pill go">${esc(t('tickets'))}</span>`;
  }
  return `<a class="item ${it.highlight ? 'hl' : ''} ${it.status === 'cancelled' ? 'cancelled' : ''}" href="#/${go}/${it.id}">
    <time>${esc(hm(it.start_time))}${it.end_time ? `<small>${esc(hm(it.end_time))}</small>` : ''}</time>
    <div class="grow"><b>${esc(itemName(it))}</b><span class="meta">${chip(typeLabel(it.type), 'ty-' + it.type)}${it.location ? ' ' + esc(it.location) : ''}${staff ? ' · ' + esc(staff) : ''}</span>
    ${it.status === 'cancelled' ? chip(t('cancelled'), 'bad') : ''}${S.mode !== 'guest' && it.booking_required && left != null ? chip(left ? t('places_left', { n: left }) : t('full'), left ? '' : 'bad') : ''}
    ${S.mode === 'guest' && it.booking_required && left && !myBooking(it) ? `<small class="muted">${esc(t('places_left', { n: left }))}</small>` : ''}${S.mode === 'guest' && isFav(it) ? '<span class="fav on" aria-label="★">♥</span>' : ''}</div>${pill}</a>`;
}

function contactBlock(st) {
  const L = [['whatsapp', st.whatsapp && 'https://wa.me/' + String(st.whatsapp).replace(/\D/g, '')], ['phone', st.phone && 'tel:' + st.phone], ['email', st.email && 'mailto:' + st.email],

}

page('g_pack', {
  mode: 'guest', title: 'get_tickets', heading: arg => { const it = gItem(arg); return it ? itemName(it) : t('get_tickets'); },
  render: async arg => {
    const it = gItem(arg); if (!it) return empty(t('not_found'));
    if (!signedIn()) return empty(t('sign_in_for_tickets'), `<a class="btn" href="#/g_stay">${esc(t('sign_in'))}</a>`);
    const { packs } = await rpc('guest_packs', { p_key: S.g.key, p_item_id: it.id });
    if (!packs.length) return empty(t('no_packs_yet'));
    const pk = packs.find(p => p.id === gPick.pack) || null;
    const pickHtml = packs.map(p => `<button class="pack ${pk && pk.id === p.id ? 'on' : ''}" data-act="g_pack_pick" data-id="${p.id}">${avatar(p.photo_url, p.staff)}<span><b>${esc(p.staff)}</b><small>${esc(p.type)} · ${esc(money(p.price))}${(p.offers || []).map(o => ' · ' + esc(t('offer_x_for', { n: o.qty, price: money(o.price) }))).join('')}</small></span></button>`).join('');
    let grid = '';
    if (pk) {
      const taken = new Set(pk.taken);
      const nums = []; for (let n = pk.number_from; n <= pk.number_to && nums.length < 1000; n++) nums.push(n);
      grid = `<p class="muted">${esc(t('pick_numbers', { max: gSet().ticket_max || 10 }))}</p><div class="numgrid">${nums.map(n => `<button ${taken.has(n) ? 'disabled' : ''} class="${gPick.nums.includes(n) ? 'on' : ''}" data-act="g_num" data-n="${n}">${String(n).padStart(pk.digits || 1, '0')}</button>`).join('')}</div>
        <div class="sticky-act"><span>${esc(t('selected_n', { n: gPick.nums.length }))}</span><button class="btn" data-act="g_reserve" data-id="${pk.id}" data-item="${it.id}" ${gPick.nums.length ? '' : 'disabled'}>${esc(t('reserve'))}</button></div>`;
    }
    return `<p class="muted">${esc(t('choose_entertainer'))}</p><div class="packs">${pickHtml}</div>${grid}`;
  }
});

async function pollGuest() {
  if (S.mode !== 'guest' || !S.g.key || document.hidden) return;
  try {
    const before = new Set((S.g.me?.notifications || []).map(n => n.id));
    await gRefreshMe();
    const fresh = (S.g.me.notifications || []).filter(n => !n.read && !before.has(n.id) && !gSeen.has(n.id));
    fresh.forEach(n => { gSeen.add(n.id); const v = notifView(n); toast(v.title); if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(v.title, { body: v.body }); } catch { /* ignore */ } } });

}

ACT.lightbox = el => {
  const imgs = $$('img[data-act=lightbox]', el.closest('.page') || document); let i = imgs.indexOf(el);
  const m = modal('', `<div class="lightbox"><img src="${esc(el.src)}" alt=""><p>${esc(el.alt || '')}</p>${imgs.length > 1 ? `<div class="row"><button class="btn ghost" data-lb="-1">‹</button><button class="btn ghost" data-lb="1">›</button></div>` : ''}</div>`, { wide: true, noFocus: true });
  m.root.onclick = ev => { const b = ev.target.closest('[data-lb]'); if (!b) return; i = (i + +b.dataset.lb + imgs.length) % imgs.length; $('img', m.root).src = imgs[i].src; $('p', m.root).textContent = imgs[i].alt || ''; };
};
const WX = c => (c === 0 ? ['☀', 'wx_clear'] : c <= 3 ? ['⛅', 'wx_cloudy'] : c <= 48 ? ['🌫', 'wx_fog'] : c <= 67 ? ['🌧', 'wx_rain'] : c <= 77 ? ['❄', 'wx_snow'] : c <= 82 ? ['🌦', 'wx_showers'] : ['⛈', 'wx_storm']);
async function weatherInto(el, lat, lon, mini) {
  if (!el || !lat) return;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto&forecast_days=5`);
    const w = await r.json(); const c = w.current; const [ic, k] = WX(c.weather_code);
    el.innerHTML = `<div class="card weather"><div class="now"><span class="wx">${ic}</span><b>${Math.round(c.temperature_2m)}°</b><span>${esc(t(k))} · ${esc(t('wind'))} ${Math.round(c.wind_speed_10m)} km/h</span></div>
      ${mini ? '' : `<div class="days">${w.daily.time.map((d, i) => `<div><small>${esc(D.fmt(d, { weekday: 'short' }))}</small><span>${WX(w.daily.weather_code[i])[0]}</span><b>${Math.round(w.daily.temperature_2m_max[i])}°</b><small>${Math.round(w.daily.temperature_2m_min[i])}° · UV ${Math.round(w.daily.uv_index_max[i])}</small></div>`).join('')}</div>`}</div>`;
  } catch { el.innerHTML = ''; }
}

page('tickets', {

function packCard(p, sales, pays, type, mine, owner) {
  const conf = sales.filter(s => s.status === 'confirmed'), res = sales.filter(s => s.status === 'reserved');
  const got = sum(conf, s => s.price), paid = sum(pays, x => x.amount);
  const pad = n => String(n).padStart(type?.digits || 1, '0');
  return `<section class="card pack-card"><h2>${esc(type?.name || t('tickets'))} · ${pad(p.number_from)}–${pad(p.number_to)} ${p.status === 'settled' ? chip(t('settled'), 'ok') : ''}</h2>
    ${owner ? `<p class="muted">${esc(owner)}</p>` : ''}
    <div class="stats"><span><b>${conf.length}</b>${esc(t('sold'))}</span><span><b>${res.length}</b>${esc(t('reserved'))}</span><span><b>${esc(money(got))}</b>${esc(t('collected'))}</span><span><b>${esc(money(paid))}</b>${esc(t('handed_in'))}</span><span><b>${esc(money(got - paid))}</b>${esc(t('due'))}</span></div>
    ${res.length ? `<h3>${esc(t('reserved_by_guests'))}</h3><div class="list">${res.map(s => `<div class="li row"><b>${pad(s.number)}</b> ${esc(s.guest_name || '')} ${s.room ? '· ' + esc(s.room) : ''}<span class="grow"></span>
      <button class="btn small" data-act="ts_set" data-id="${s.id}" data-s="confirmed">${esc(t('paid_confirm'))}</button><button class="btn ghost small" data-act="ts_set" data-id="${s.id}" data-s="cancelled">${esc(t('cancel'))}</button></div>`).join('')}</div>` : ''}
    ${conf.length ? `<details><summary>${esc(t('sold_numbers'))}</summary><p>${conf.map(s => pad(s.number) + (s.room ? ' (' + esc(s.room) + ')' : '')).join(', ')}</p></details>` : ''}
    ${p.status === 'open' ? `<div class="actions"><button class="btn ghost small" data-act="ts_add" data-id="${p.id}">${esc(t('sell_tickets'))}</button>${mine ? '' : `<button class="btn ghost small" data-act="tp_pay" data-id="${p.id}">${esc(t('money_handed_in'))}</button><button class="btn ghost small" data-act="tp_settle" data-id="${p.id}">${esc(t('settle'))}</button>`}</div>` : ''}</section>`;
}
const parseNums = s => { const out = []; String(s || '').split(/[,\s]+/).forEach(p => { const m = p.match(/^(\d+)-(\d+)$/); if (m) { for (let n = +m[1]; n <= +m[2] && out.length < 500; n++) out.push(n); } else if (/^\d+$/.test(p)) out.push(+p); }); return uniq(out); };

  render: async () => {
    const g = store.get('bingo') || { drawn: [] }; const last = g.drawn[g.drawn.length - 1];
    return `<div class="card center bingo-caller"><div class="ball">${last || '–'}</div><p class="muted">${esc(t('bingo_count', { n: g.drawn.length }))}</p>
      <p class="row" style="justify-content:center"><button class="btn" data-act="bg_draw" ${g.drawn.length >= 90 ? 'disabled' : ''}>${esc(t('bingo_draw'))}</button><button class="btn ghost" data-act="bg_undo" ${g.drawn.length ? '' : 'disabled'}>${esc(t('bingo_undo'))}</button><button class="btn ghost danger" data-act="bg_new">${esc(t('bingo_new'))}</button></p></div>
      <div class="numgrid bingo-board">${Array.from({ length: 90 }, (_, i) => i + 1).map(n => `<span class="${g.drawn.includes(n) ? 'used' : ''} ${n === last ? 'last' : ''}">${n}</span>`).join('')}</div>`;
  }
});
ACT.bg_draw = () => { const g = store.get('bingo') || { drawn: [] }; const left = Array.from({ length: 90 }, (_, i) => i + 1).filter(n => !g.drawn.includes(n)); if (!left.length) return;
  const a = new Uint32Array(1); crypto.getRandomValues(a); g.drawn.push(left[a[0] % left.length]); store.set('bingo', g); route(); };
ACT.bg_undo = () => { const g = store.get('bingo') || { drawn: [] }; g.drawn.pop(); store.set('bingo', g); route(); };
ACT.bg_new = async () => { if (await confirmBox(t('bingo_new_q'))) { store.set('bingo', { drawn: [] }); route(); } };

/* =====================================================================
   MANAGER — one set of pages for every hotel and team. Changing Hotel or
   Team (top bar) changes the session; every page reloads from it.
   ===================================================================== */
const CRUD = {};
function crudList(key, cfg) {
  CRUD[key] = cfg;
  return async () => {
    const rows = await list(cfg.entity, cfg.filter ? cfg.filter() : {});
    cfg.rows = rows;
    return `${cfg.intro ? `<p class="muted">${esc(cfg.intro)}</p>` : ''}<p class="row"><span class="grow"></span>${cfg.extra || ''}<button class="btn small" data-act="crud_new" data-k="${key}">${esc(t('add'))}</button></p>`
      + (rows.length ? `<div class="list">${rows.map(r => `<button class="li" data-act="crud_edit" data-k="${key}" data-id="${r.id}">${cfg.row(r)}</button>`).join('')}</div>` : empty(t('nothing_yet')));
  };
}
ACT.crud_new = el => { const c = CRUD[el.dataset.k]; editForm(t('add'), c.fields(), c.defaults ? c.defaults() : {}, async r => { await save(c.entity, c.before ? c.before(r) : r); route(); }); };
ACT.crud_edit = el => {
  const c = CRUD[el.dataset.k]; const row = c.rows.find(x => x.id === +el.dataset.id); if (!row) return;
  editForm(t('edit'), c.fields(), c.load ? c.load(row) : row, async r => { await save(c.entity, c.before ? c.before(r) : r); route(); },
    { danger: async () => { await del(c.entity, row.id); route(); } });
};

/* ---------- Dashboard: attention center ---------- */
page('dashboard', {
  perm: 'm_dashboard', icon: '◉', group: 'manage',
  render: async arg => {
    const head = tabs('dashboard', [['today', t('today')], ['stats', t('statistics')]], arg === 'stats' ? 'stats' : 'today');
    if (arg === 'stats') return head + await statsView();
    const today = D.today(), tom = D.add(today, 1);
    const [b, reqs, gs, fb, packs, sales, pays, tasks, guests] = await Promise.all([
      board(today, tom), can('m_team') ? safe(list('staff_requests', { status: 'pending' })) : null,
      can('gs_history') ? safe(list('guest_support_records', { status: 'open', _limit: 300 })) : null,
      can('feedback_view') ? safe(list('guest_feedback', { status: 'new', _limit: 300 })) : null,
      can('m_tickets') ? safe(list('ticket_packs', { status: 'open' })) : null, can('m_tickets') ? safe(list('ticket_sales', { status: 'confirmed', _limit: 5000 })) : null,
      can('m_tickets') ? safe(list('ticket_payments', { _limit: 5000 })) : null, can('m_team') ? safe(list('tasks', { status: ['open', 'accepted'] })) : null,
      can('guests_view') || can('m_guests') ? safe(api('staff_guests')) : null]);
    const att = [];
    const live = b.items.filter(i => i.status === 'scheduled');
    live.filter(i => i.staff.length < i.staff_needed).forEach(i => att.push(['warn', t('att_needs_staff', { name: itemName(i), have: i.staff.length, need: i.staff_needed, day: D.short(i.date) + ' ' + hm(i.start_time) }), 'planner']));
    live.forEach(i => i.staff.forEach(s => { const st = statusOf(b, s.staff_id, i.date); if (st && st.status !== 'working') att.push(['bad', t('att_assigned_off', { name: s.name, item: itemName(i), status: statusLabel(st.status), day: D.short(i.date) }), 'planner']); }));
    const usesEntrance = b.pattern.some(p => p.entrance);
    if (usesEntrance && !b.status.some(s => s.date === today && s.entrance)) att.push(['warn', t('att_no_entrance'), 'dayplan']);
    if (reqs?.length) att.push(['info', t('att_requests', { n: reqs.length }), 'requests']);
    const comp = (gs || []).filter(x => x.kind === 'complaint');
    if (comp.length) att.push(['bad', t('att_complaints', { n: comp.length }), 'gsupport/history']);
    const lowIds = new Set(fb?.length ? (await safe(list('guest_feedback_ratings', { feedback_id: fb.map(x => x.id) })) || []).filter(r => r.rating <= 2).map(r => r.feedback_id) : []);
    const low = (fb || []).filter(x => lowIds.has(x.id));
    if (low.length) att.push(['bad', t('att_low_feedback', { n: low.length }), 'feedback']);
    else if (fb?.length) att.push(['info', t('att_feedback', { n: fb.length }), 'feedback']);
    if (packs) { const due = sum(packs, p => sum(sales.filter(s => s.pack_id === p.id), s => s.price) - sum(pays.filter(x => x.pack_id === p.id), x => x.amount)); if (due > 0) att.push(['info', t('att_ticket_money', { total: money(due) }), 'ticketsadmin/packs']); }
    if (can('m_backup') && (!S.settings.last_backup_at || D.diff(String(S.settings.last_backup_at).slice(0, 10), today) > 7)) att.push(['warn', t('att_backup'), 'backup/export']);
    const late = (tasks || []).filter(x => x.due_date && x.due_date < today);
    if (late.length) att.push(['warn', t('att_tasks_late', { n: late.length }), 'tasks']);
    const work = b.status.filter(s => s.date === today && s.status === 'working').length;
    const off = b.status.filter(s => s.date === today && s.status !== 'working').length;
    const todayItems = live.filter(i => i.date === today);
    const arriving = (guests?.stays || []).filter(g => g.arrival === today).length;
    const inHouse = (guests?.stays || []).filter(g => g.arrival <= today).length;
    return head + `<div class="stats"><span><b>${work}</b>${esc(t('working_today'))}</span><span><b>${off}</b>${esc(t('not_working_today'))}</span><span><b>${todayItems.length}</b>${esc(t('items_today'))}</span>
      ${guests ? `<span><b>${inHouse}</b>${esc(t('guests_in_house'))}</span><span><b>${arriving}</b>${esc(t('arriving_today'))}</span>` : ''}<span><b>${sum(todayItems, i => i.booked)}</b>${esc(t('bookings_today'))}</span></div>
      <section><h2>${esc(t('needs_attention'))} ${att.length ? `<small class="muted">(${att.length})</small>` : ''}</h2>${att.length ? `<div class="list attention">${att.sort((x, y) => ['bad', 'warn', 'info'].indexOf(x[0]) - ['bad', 'warn', 'info'].indexOf(y[0])).slice(0, 12).map(([k, txt, go]) => `<a class="li ${k}" href="#/${go}">${esc(txt)}</a>`).join('')}${att.length > 12 ? `<a class="li" href="#/planner">+ ${att.length - 12}</a>` : ''}</div>` : empty(t('all_good'))}</section>
      <section><h2>${esc(t('today'))} · ${esc(D.long(today))}</h2>${todayItems.length ? `<div class="items">${todayItems.map(i => itemRow(i, 'item')).join('')}</div>` : empty(t('no_items_day'))}</section>`;
  }
});

/* ---------- Attendance: ONE page on the day status + clock times (payroll uses the same count) ---------- */
function attendanceSummary(personId, b) {
  const st = b.status.filter(x => x.staff_id === personId);
  const hours = sum((b.clock || []).filter(k => k.staff_id === personId && k.check_in && k.check_out), k => (new Date(k.check_out) - new Date(k.check_in)) / 36e5);
  const n = s => st.filter(x => x.status === s).length;
  return { worked: n('working'), off: n('day_off'), vac: n('vacation'), absent: n('absent'), sick: n('sick'), clocked: (b.clock || []).filter(k => k.staff_id === personId && k.check_in).length, hours: Math.round(hours * 10) / 10 };
}

      atMonth = atMonth || D.month(D.today());
      const from = atMonth + '-01', end = D.add(D.add(from, 32).slice(0, 7) + '-01', -1);
      const b = await board(from, end);
      atCache = b.staff.filter(p => !p.is_manager).map(p => Object.assign({ name: p.display_name, number: p.staff_number }, attendanceSummary(p.id, b)));

        <div class="tablewrap">${tableHtml([t('name'), t('st_working'), t('st_day_off'), t('st_vacation'), t('st_absent'), t('st_sick'), t('clock_times'), t('hours')], atCache.map(r => [r.name + (r.number ? ' #' + r.number : ''), r.worked, r.off, r.vac, r.absent, r.sick, r.clocked, r.hours]))}</div>
        <p class="muted small">${esc(t('attendance_note'))}</p>`;
    }
    const today = D.today(); atDay = atDay || today;
    const d = atDay, b = await board(d, d);
    const nm = hotelNowMin(), isToday = d === today;
    const busyNow = new Set(isToday ? b.items.filter(i => i.date === d && mins(i.start_time) <= nm && (mins(i.end_time) || mins(i.start_time) + 60) > nm).flatMap(i => i.staff.map(x => x.staff_id)) : []);
    const people = b.staff.filter(p => !p.is_manager);

    return head + `<div class="row"><button class="btn ghost small" data-act="at_day" data-n="-1" aria-label="-1">‹</button><input type="date" value="${d}" data-act-change="at_pick" aria-label="${esc(t('date'))}"><button class="btn ghost small" data-act="at_day" data-n="1" aria-label="+1">›</button></div>
      <div class="stats">${STATUS.map(s => `<span><b>${cnt(s)}</b>${esc(statusLabel(s))}</span>`).join('')}<span><b>${(b.clock || []).filter(k => k.check_in).length}</b>${esc(t('clock_times'))}</span></div>

        ${avatar(p.photo_url, p.display_name, 'xs')}<span class="grow"><b>${esc(p.display_name)}</b>${p.staff_number ? ' #' + p.staff_number : ''} ${busyNow.has(p.id) ? chip(t('busy_now')) : ''}

        ${canMark ? `<select data-act-change="at_mark" data-s="${p.id}" aria-label="${esc(p.display_name)}">${(marks.includes(s.status) ? marks : [s.status].concat(marks)).filter(Boolean).map(x => `<option value="${x}" ${x === s.status ? 'selected' : ''}>${esc(statusLabel(x))}</option>`).join('')}</select>` : stChip(s)}

/* copy last week: same weekly items, same people, re-checked against this week's days off, duties and times */
ACT.pl_copy = async () => {
  const b = plCache; const prev = await board(D.add(plFrom, -7), D.add(plFrom, plDays - 8), !!S.settings.cross_team_assign);
  const why = planWhy(plInput(b)); const rows = [];
  for (const it of b.items.filter(i => i.status === 'scheduled' && i.template_id)) {
    const src = prev.items.find(p => p.template_id === it.template_id && p.date === D.add(it.date, -7)); if (!src) continue;
    const have = new Set(it.staff.map(s => s.staff_id));
    for (const s of src.staff) {
      const sm = b.staff.find(x => x.id === s.staff_id);
      if (!sm || sm.is_manager || have.has(sm.id) || have.size >= it.staff_needed || why(sm, it)) continue;
      rows.push({ item_id: it.id, staff_id: sm.id }); have.add(sm.id);
    }
  }
  if (!rows.length) return toast(t('copy_nothing'), 'warn');
  const load = {}; b.staff.filter(s => !s.is_manager).forEach(s => { load[s.id] = 0; }); b.items.forEach(i => i.staff.forEach(s => { if (s.staff_id in load) load[s.staff_id]++; })); rows.forEach(r => { load[r.staff_id] = (load[r.staff_id] || 0) + 1; });
  plPreview({ rows, unfilled: [], load }, null, t('copy_last_week'));
};

const studioFields = types => [{ k: 'ticket_type_id', type: 'select', label: t('ticket_types'), num: true, options: opts(types, 'id', 'name') }, { k: 'batch', label: t('batch'), req: true },
  { k: 'number_from', type: 'number', label: t('number_from'), req: true }, { k: 'number_to', type: 'number', label: t('number_to'), req: true }, { k: 'title', label: t('ticket_title') }];
function rng(seed) { let a = 0; for (const ch of String(seed)) a = (a * 31 + ch.charCodeAt(0)) | 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function bingoCard(seed) {
  const r = rng(seed);
  for (let tries = 0; tries < 200; tries++) {
    const rows = [0, 1, 2].map(() => { const c = [0, 1, 2, 3, 4, 5, 6, 7, 8].sort(() => r() - 0.5).slice(0, 5); return new Set(c); });
    if ([0, 1, 2, 3, 4, 5, 6, 7, 8].some(c => !rows.some(s => s.has(c)))) continue;
    const grid = [[], [], []];
    for (let c = 0; c < 9; c++) {
      const lo = c === 0 ? 1 : c * 10, hi = c === 8 ? 90 : c * 10 + 9;
      const need = rows.filter(s => s.has(c)).length;
      const pool = []; for (let n = lo; n <= hi; n++) pool.push(n);
      const nums = pool.sort(() => r() - 0.5).slice(0, need).sort((a, b) => a - b);
      let k = 0; for (let i = 0; i < 3; i++) grid[i][c] = rows[i].has(c) ? nums[k++] : '';
    }
    return grid;
  }
  return [[], [], []];
}

  const rt = rates.find(r => r.staff_id === person.id) || {}; const en = entries.filter(e => e.staff_id === person.id);

}

        const ty = TYPES.find(x => low(x) === low(d.type) || low(typeLabel(x)) === low(d.type) || low(x.replace('_', ' ')) === low(d.type));
        if (!ty) throw t('err_type');
        const one = w => /^[1-7]$/.test(w) ? +w - 1 : [0, 1, 2, 3, 4, 5, 6].find(i => [D.wdName(i, 'long'), D.wdName(i, 'short'), ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'][i], ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][i]].map(low).includes(w));
        const wl = low(d.weekdays || d.weekday);
        const wd = ['daily', 'every day', 'all', '*', low(t('every_day'))].includes(wl) ? [0, 1, 2, 3, 4, 5, 6] : uniq(wl.split(/[\s,;/+]+/).filter(Boolean).map(one));
        if (!wd.length || wd.some(x => x == null)) throw t('err_weekday');
        const tmv = s2 => { const m = String(s2 || '').trim().match(/^(\d{1,2})[:.](\d{2})/); return m && +m[1] < 24 && +m[2] < 60 ? String(m[1]).padStart(2, '0') + ':' + m[2] : null; };
        if (!tmv(d.start) || (d.end && !tmv(d.end))) throw t('err_time');
        if ((d.name || '').trim().length < 2) throw t('err_name');
        const tm = team(d.team); if (tm.err) throw tm.err;
        out.args = { p_row: { type: ty, name: d.name.trim(), weekdays: wd, start_time: tmv(d.start), end_time: d.end ? tmv(d.end) : null, location: d.location || null, description: d.description || null,
          capacity: +d.capacity || 0, booking_required: yes(d.booking), staff_needed: d.staff_needed === '' || d.staff_needed == null ? 1 : +d.staff_needed || 0, team_id: tm.id, active: true } };
      } else if (kind === 'stays') {
        const dt = v => { const x = String(v || '').trim(); const m = x.match(/^(\d{4})-(\d{2})-(\d{2})$/) || x.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/); if (!m) return null; return m[1].length === 4 ? `${m[1]}-${m[2]}-${m[3]}` : `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; };
        if (!String(d.room || '').trim()) throw t('err_room');
        if ((d.name || '').trim().length < 2) throw t('err_name');
        const a1 = dt(d.arrival), a2 = dt(d.departure); if (!a1 || !a2 || a2 < a1) throw t('err_dates');
        out.args = { p_entity: 'guest_stays', p_row: { room: String(d.room).trim(), name: d.name.trim(), arrival: a1, departure: a2, nationality: d.nationality || null, phone: d.phone || null } };
      } else {
        if (!String(d.room || '').trim()) throw t('err_room');
        out.args = { p_text: String(d.room).trim() };
      }
    } catch (e) { out.err = typeof e === 'string' ? e : errText(e); }
    return out;
  });
}
ACT.imp_kind = el => { imp = { kind: el.dataset.k, rows: null, result: null }; route(); };
ACT.imp_template = () => download('aurea-' + imp.kind + '.csv', toCsv([IMPORTS[imp.kind].example()]), 'text/csv');
ACT.imp_go = async el => {
  el.disabled = true; const res = { ok: 0, bad: 0, passwords: [] };
  const fn = { staff: 'mgr_staff_save', programme: 'program_template_save', rooms: 'mgr_rooms_add', stays: 'data_save' }[imp.kind];
  for (const r of imp.rows.filter(x => !x.err && !x.done)) {
    el.textContent = `${res.ok + res.bad + 1} / ${imp.rows.length}`;
    try { await api(fn, r.args); r.done = true; res.ok++; if (imp.kind === 'staff' && !r.data.password) res.passwords.push({ username: r.args.p_row.username, password: r.args.p_password }); }
    catch (e) { r.err = errText(e); res.bad++; }
  }
  imp.result = res; toast(t('imp_done', res), res.bad ? 'warn' : 'ok'); route();
};
ACT.imp_pw = () => download('aurea-new-passwords.csv', toCsv(imp.result.passwords), 'text/csv');
ACT.rst_go = async () => {
  const c = ($('[name=rst_confirm]')?.value || '').trim();
  if (c !== S.hotel.name) return toast(t('err_confirm'), 'bad');
  if (!await confirmBox(t('rst_intro'), t('rst_go'))) return;
  await ACT.bk_json();                                   // safety copy of the current state first
  const j = await api('backup_restore', { p_backup: rst.backup, p_confirm: c });
  toast(t('rst_done', { n: j.records })); rst = null;
  await api('staff_context', { p_hotel_id: S.hotel.id, p_team_id: null }); await loadMe(); renderShell(); route();
};
ACT.bk_json = async () => { const j = await api('backup_export'); download(`aurea-backup-${(S.hotel.name || 'hotel').replace(/\W+/g, '-')}-${D.today()}.json`, JSON.stringify(j.backup, null, 1)); };
ACT.bk_xlsx = async () => {
  const j = await api('backup_export'); const sheets = {};
  for (const [k, v] of Object.entries(j.backup)) if (Array.isArray(v)) sheets[k] = v.map(r => { const o = {}; for (const [a, b] of Object.entries(r)) o[a] = b && typeof b === 'object' ? JSON.stringify(b) : b; return o; });
  await exportXlsx(`aurea-${(S.hotel.name || 'hotel')}-${D.today()}`, sheets);
};
page('qr', {
  perm: 'm_settings,m_content', icon: '▩', group: 'admin', title: 'qr_codes',
  render: async () => { const url = location.origin + location.pathname + '?hotel=' + S.hotel.id; return `<div class="card center"><p>${esc(t('qr_intro'))}</p><div id="qrbox" class="qr"></div><p><code>${esc(url)}</code></p><p class="row"><button class="btn" data-act="qr_print">${esc(t('print_pdf'))}</button><button class="btn ghost" data-act="qr_copy" data-u="${esc(url)}">${esc(t('copy_link'))}</button></p></div>`; },
  mount: async () => { try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'); const box = $('#qrbox'); if (box) new window.QRCode(box, { text: location.origin + location.pathname + '?hotel=' + S.hotel.id, width: 220, height: 220 }); } catch { /* offline */ } }
});
ACT.qr_copy = async el => { try { await navigator.clipboard.writeText(el.dataset.u); toast(t('copied')); } catch { toast(el.dataset.u); } };
ACT.qr_print = () => { const img = $('#qrbox img') || $('#qrbox canvas'); const src = img ? (img.tagName === 'CANVAS' ? img.toDataURL() : img.src) : ''; printSheet(S.settings.app_name || S.hotel.name, `<div style="text-align:center;margin-top:30px"><p style="font-size:20px">${esc(t('qr_scan'))}</p>${src ? `<img src="${src}" style="width:70mm;height:70mm">` : ''}<p>${esc(S.hotel.name)}</p></div>`); };

</script>
