<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3E2A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Entertainment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&family=Nunito:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
/* ================= DESIGN SYSTEM TOKENS ================= */
/* spacing — 4px based scale, no random values */
--sp-1:4px;  --sp-2:8px;  --sp-3:12px; --sp-4:16px;
--sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px;
/* radius scale */
--r-xs:6px; --r-sm:10px; --r-md:13px; --r-lg:16px; --r-xl:20px; --r-2xl:24px; --r-pill:999px;
/* elevation */
--sh-1:0 1px 3px -1px rgba(38,24,14,.10);
--sh-2:0 2px 8px -4px rgba(38,24,14,.10),0 12px 30px -18px rgba(38,24,14,.22);
--sh-3:0 4px 14px -6px rgba(38,24,14,.16),0 18px 40px -20px rgba(38,24,14,.28);
--sh-brand:0 8px 20px -10px rgba(62,42,30,.5);
/* motion */
--dur-fast:.14s; --dur-base:.2s; --dur-slow:.28s;
--ease:cubic-bezier(.2,.7,.2,1);
/* layering — one scale, no guessing */
--z-base:1; --z-sticky:6; --z-chatbar:35; --z-nav:40; --z-drawer:60;
--z-modal:80; --z-toast:100; --z-banner:120; --z-photo:200;
/* typography scale */
--fs-h1:30px; --fs-h2:24px; --fs-h3:19px; --fs-h4:16px;
--fs-body:15px; --fs-label:13px; --fs-caption:12px; --fs-meta:11px;
--lh-tight:1.18; --lh-body:1.5;

  --espresso:#3E2A1E; --cacao:#6B4A32; --bronze:#B98A5C; --sand:#E8DCC9;
  --bg-light:#F7F2EA; --bg:var(--bg-light);
  --ink-light:#2B1F16; --ink:var(--ink-light);
  --card:#FFFFFF; --muted:#8A7663;
  --ok:#4C7A4C; --warn:#A65A3A; --line:#E4D9C8;
  --font-display:'Cormorant Garamond',serif; --font-body:'Jost',sans-serif;
  --btn-radius:14px; --btn-radius-sm:11px;
  --nav-bg:#FFFFFF; --nav-on:#6B4A32;
  --radius:18px; --shadow:0 6px 24px rgba(62,42,30,.08);
}
[data-theme="dark"]{
  --bg:#1B140E; --card:#271E15; --ink:#F1E8DC; --muted:#B7A48E;
  --line:#3B2F22; --sand:#3B2F22; --shadow:0 6px 24px rgba(0,0,0,.35);
  --nav-bg:#271E15; --nav-on:var(--bronze);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
[dir="rtl"] body{font-family:'Tajawal',sans-serif}
h1,h2,h3,.serif{font-family:var(--font-display);font-weight:600;letter-spacing:.01em}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .serif{font-family:'Tajawal',sans-serif;font-weight:700}
button{font-family:inherit;font-size:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;width:100%;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bronze);border-color:var(--bronze)}
input[type="color"]{padding:5px;height:48px;cursor:pointer}
label{font-size:13px;font-weight:500;color:var(--muted);display:block;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
img{display:block;max-width:100%}
.app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{flex:1;padding:20px 18px 100px}
.fadein{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- login ---------- */
.login-wrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;color:#F7F2EA;background:
  linear-gradient(180deg,rgba(30,18,10,.20),rgba(30,18,10,.45)),
  radial-gradient(120% 80% at 50% 0%, var(--cacao) 0%, var(--espresso) 72%)}
.login-card{background:var(--card);color:var(--ink);border-radius:var(--r-2xl);padding:22px 20px;box-shadow:var(--shadow);margin-top:20px}
.brandmark{text-align:center}
.brandmark .mono{width:74px;height:74px;margin:0 auto 14px;border:2px solid var(--bronze);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:34px;color:#F1E4D2}
.brandmark h1{font-size:34px;color:#F7F2EA}
.brandmark p{color:#E2D2BD;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.role-tabs{display:flex;gap:8px;margin-top:18px}
.role-tabs button{flex:1;padding:10px 6px;border-radius:var(--r-md);background:rgba(247,242,234,.12);color:#F1E4D2;font-size:14px;font-weight:500}
.role-tabs button.on{background:#F7F2EA;color:var(--espresso);font-weight:600}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:var(--btn-radius);background:var(--espresso);color:#F7F2EA;font-weight:600;letter-spacing:.03em;margin-top:18px}
[data-theme="dark"] .btn{background:var(--bronze);color:#1B140E}
.btn.ghost{background:transparent;color:var(--cacao);border:1px solid var(--line);margin-top:10px}
[data-theme="dark"] .btn.ghost{color:var(--bronze)}
.btn.sm{width:auto;display:inline-block;padding:9px 16px;margin-top:0;font-size:14px;border-radius:var(--btn-radius-sm)}
.btn.warn{background:var(--warn);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px;text-align:center}
.err{color:#C4553B;font-size:14px;margin-top:10px;text-align:center;min-height:20px}
.lang-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.lang-row button{padding:7px 13px;border-radius:var(--r-pill);border:1px solid rgba(247,242,234,.35);color:#F1E4D2;font-size:13px}
.lang-row button.on{background:#F7F2EA;color:var(--espresso);font-weight:600;border-color:#F7F2EA}
.staff-link{display:block;margin:20px auto 0;text-align:center;font-size:13px;color:#E4D3BC;opacity:.85;letter-spacing:.05em}
.staff-link span{border-bottom:1px dotted #E4D3BC;padding-bottom:2px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.top .who{min-width:0}
.top .who h2{font-size:26px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who p{font-size:13px;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;position:relative}
.toprow{display:flex;gap:8px}
.reddot{position:absolute;top:2px;inset-inline-end:2px;width:10px;height:10px;border-radius:50%;background:#C4553B;border:2px solid var(--bg)}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:var(--r-2xl);overflow:hidden;box-shadow:var(--shadow);margin-bottom:22px;background:var(--espresso)}
.hero img{width:100%;height:230px;object-fit:cover;opacity:.85}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,18,10,0) 20%,rgba(30,18,10,.86) 82%)}
.hero .tag{position:absolute;top:14px;inset-inline-start:14px;background:rgba(247,242,234,.92);color:#3E2A1E;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:var(--r-pill)}
.hero .body{position:absolute;bottom:0;inset-inline:0;padding:16px;color:#F7F2EA}
.hero .body h3{font-size:28px;line-height:1.1}
.hero .meta{display:flex;gap:14px;font-size:13px;color:#E4D3BC;margin-top:4px;flex-wrap:wrap}
.hero .desc{font-size:14px;color:#EFE3D2;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- sections & cards ---------- */
.sec{margin-bottom:22px}
.sec>h3{font-size:22px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.sec>h3 .count{font-family:var(--font-body);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.act{display:flex;gap:12px;align-items:stretch}
.act .thumb{width:78px;height:78px;border-radius:var(--r-md);object-fit:cover;flex:none;background:var(--sand)}
.act .mid{flex:1;min-width:0}
.act .mid h4{font-size:17px;font-weight:600;line-height:1.25}
.act .meta{font-size:13px;color:var(--muted);margin-top:2px}
.act .meta span{margin-inline-end:10px;white-space:nowrap}
.act .side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex:none;gap:6px}
.chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:var(--r-pill);background:var(--sand);color:var(--cacao)}
[data-theme="dark"] .chip{color:#E4C9A8}
.chip.ok{background:#E4EEE0;color:var(--ok)}
.chip.full{background:#F3E2D8;color:var(--warn)}
.chip.res{background:#F3ECD8;color:#8A6D2F}
[data-theme="dark"] .chip.ok{background:#25321F;color:#9CC98F}
[data-theme="dark"] .chip.full{background:#3A2418;color:#E0A181}
[data-theme="dark"] .chip.res{background:#3A3018;color:#D9BE7E}
.fav{font-size:20px;line-height:1}
.seats{font-size:12px;color:var(--muted)}
.catbadge{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze);font-weight:600}
.quickrow{display:flex;gap:10px;margin-bottom:22px}
.quickrow button{flex:1;background:var(--card);box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 10px;font-size:14px;font-weight:500}
.quickrow button span{display:block;font-size:24px;margin-bottom:4px}

/* ---------- weekly timeline ---------- */
.wk{padding:4px 2px 0}
.wk-item{display:flex;gap:12px;align-items:stretch}
.wk-time{width:56px;flex:none;font-family:var(--font-display);font-size:18px;color:var(--cacao);text-align:end;padding-top:8px;line-height:1.15}
.wk-time .wk-end{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
[data-theme="dark"] .wk-time{color:var(--bronze)}
.wk-rail{width:14px;flex:none;display:flex;flex-direction:column;align-items:center}
.wk-dot{width:10px;height:10px;border-radius:50%;background:var(--bronze);margin-top:14px;flex:none}
.wk-line{flex:1;width:2px;background:var(--line)}
.wk-item:last-child .wk-line{background:transparent}
.wk-info{flex:1;display:flex;gap:12px;align-items:center;min-width:0;padding:8px 0 16px}
.wk-info img{width:56px;height:56px;border-radius:var(--r-md);object-fit:cover;flex:none;background:var(--sand)}
.wk-info h4{font-size:16px;font-weight:600;line-height:1.25}
.wk-info p{font-size:13px;color:var(--muted)}

/* ---------- tickets ---------- */
.tk{border-radius:var(--r-2xl);overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:16px}
.tk img{width:100%;height:150px;object-fit:cover;background:var(--sand)}
.tk .bd{padding:14px 16px 16px}
.tk h4{font-family:var(--font-display);font-size:24px;font-weight:600}
[dir="rtl"] .tk h4{font-family:'Tajawal',sans-serif}
.tk .mini{margin-top:2px}
.tk .desc{font-size:14px;margin-top:6px}
.tk .rowend{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.tk .price{font-family:var(--font-display);font-size:22px;color:var(--cacao);font-weight:600}
[data-theme="dark"] .tk .price{color:var(--bronze)}

/* ---------- chat ---------- */
.chatlist .card{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chatlist .card .nm{font-weight:600}
.chatlist .card .lastm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.badge{background:#C4553B;color:#fff;font-size:11px;font-weight:600;border-radius:var(--r-pill);min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.thread{display:flex;flex-direction:column;padding-bottom:66px}
.bub{max-width:80%;padding:10px 14px;border-radius:var(--r-lg);margin:4px 0;font-size:15px;line-height:1.45;word-break:break-word}
.bub.me{background:var(--espresso);color:#F7F2EA;margin-inline-start:auto;border-end-end-radius:4px}
[data-theme="dark"] .bub.me{background:var(--bronze);color:#1B140E}
.bub.them{background:var(--card);box-shadow:var(--shadow);border-end-start-radius:4px}
.bub .tm{display:block;font-size:10.5px;opacity:.65;margin-top:3px}
.chatbar{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom));inset-inline:0;max-width:540px;margin:0 auto;display:flex;gap:8px;padding:10px 14px;background:var(--bg);z-index:var(--z-chatbar)}
.chatbar input{flex:1}
.chatbar button{flex:none;width:50px;height:50px;border-radius:50%;background:var(--espresso);color:#F7F2EA;font-size:19px}
[data-theme="dark"] .chatbar button{background:var(--bronze);color:#1B140E}

/* ---------- pills / sub-tabs / day tabs ---------- */
.daytabs,.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none}
.daytabs::-webkit-scrollbar,.pills::-webkit-scrollbar{display:none}
.daytabs button,.pills button{flex:none;padding:9px 15px;border-radius:var(--r-pill);background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:500;color:var(--muted)}
.daytabs button.on,.pills button.on{background:var(--espresso);color:#F7F2EA;font-weight:600}
[data-theme="dark"] .daytabs button.on,[data-theme="dark"] .pills button.on{background:var(--bronze);color:#1B140E}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;inset-inline:0;max-width:540px;margin:0 auto;background:var(--nav-bg);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:var(--z-nav)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--muted);padding:4px 1px;min-width:0;position:relative}
.nav button span.lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button .ic{font-size:22px;line-height:1}
.nav button.on{color:var(--nav-on)}
.nav .ndot{position:absolute;top:2px;inset-inline-end:16%;width:9px;height:9px;border-radius:50%;background:#C4553B}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(30,18,10,.55);z-index:var(--z-drawer);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:540px;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:24px;margin-bottom:6px}
.modal .grab{width:44px;height:5px;border-radius:var(--r-pill);background:var(--line);margin:0 auto 14px}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.toast{position:fixed;bottom:92px;inset-inline:0;display:flex;justify-content:center;z-index:var(--z-modal);pointer-events:none}
.toast span{background:var(--espresso);color:#F7F2EA;padding:11px 20px;border-radius:var(--r-pill);font-size:14px;box-shadow:var(--shadow);animation:fade .2s ease}
[data-theme="dark"] .toast span{background:var(--bronze);color:#1B140E}
.langlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.langlist button{padding:12px;border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow);font-size:15px}
.langlist button.on{outline:2px solid var(--bronze);font-weight:600}

/* ---------- manager ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stat b{font-family:var(--font-display);font-size:32px;font-weight:600;display:block;line-height:1}
[dir="rtl"] .stat b{font-family:'Tajawal',sans-serif}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.mini{font-size:13px;color:var(--muted)}
.booking-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.booking-line:last-child{border-bottom:none}
.pill{font-size:12px;background:var(--sand);color:var(--cacao);border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap}
[data-theme="dark"] .pill{color:#E4C9A8}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
.setup{background:#FDF6E7;border:1px solid #E8D9B5;color:#7A5C22;border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;margin-bottom:16px}
[data-theme="dark"] .setup{background:#33290F;border-color:#5A4A1E;color:#E3CE96}
.roomgrid{max-height:340px;overflow-y:auto}

/* ================= LUXURY LAYER ================= */
.social-a{display:inline-flex;align-items:center;gap:7px}
.social-a .ic-s{vertical-align:0;color:var(--cacao)}
[data-theme="dark"] .social-a .ic-s{color:var(--bronze)}
.ic-s{display:inline-block;vertical-align:-4px;flex:none}
.mi{display:inline-flex;align-items:center;margin-inline-end:4px;opacity:.75}
.mi .ic-s{vertical-align:-2px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center}
.hf .ic-s{fill:var(--accent,#B98A5C);stroke:var(--accent,#B98A5C)}
.nav{position:relative}
.nav::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 5%,var(--bronze) 50%,transparent 95%);opacity:.65}
.nav button .ic{display:flex;justify-content:center}
.btn:not(.ghost):not(.warn){background:linear-gradient(135deg,var(--espresso),var(--cacao));
  box-shadow:0 10px 24px -8px rgba(62,42,30,.45)}
[data-theme="dark"] .btn:not(.ghost):not(.warn){background:linear-gradient(135deg,var(--bronze),#D9B47F);box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.btn{transition:transform .16s ease,box-shadow .2s ease,opacity .2s}
.btn:active{transform:scale(.975)}
.card{transition:transform .18s ease,box-shadow .22s ease}
.card:active{transform:scale(.99)}
.fadein>*{animation:fade .45s ease both}
.fadein>*:nth-child(2){animation-delay:.05s}.fadein>*:nth-child(3){animation-delay:.1s}
.fadein>*:nth-child(4){animation-delay:.15s}.fadein>*:nth-child(5){animation-delay:.2s}
.fadein>*:nth-child(n+6){animation-delay:.24s}
.hero img{animation:kenburns 16s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero .tag{border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.empty .big{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--sand);
  color:var(--bronze);border:1px solid var(--line)}
.empty .big .ic-s{vertical-align:0}
[data-theme="dark"] .empty .big{background:rgba(255,255,255,.05)}
.rankb{width:27px;height:27px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:14.5px;flex:none;margin-inline-end:2px;
  background:var(--sand);color:var(--muted);border:1px solid var(--line)}
.rankb.r0{background:linear-gradient(135deg,#F5D98B,#C9992E);color:#3E2A1E;border:none;box-shadow:0 3px 10px -3px rgba(201,153,46,.6)}
.rankb.r1{background:linear-gradient(135deg,#E8E8EA,#B9BCC4);color:#3A3A40;border:none}
.rankb.r2{background:linear-gradient(135deg,#E3B08B,#B3703F);color:#3E2113;border:none}
.profcard{display:flex;align-items:center;gap:13px;padding:15px 16px}
.pf-ava{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD;
  box-shadow:0 8px 18px -8px rgba(62,42,30,.55)}
[data-theme="dark"] .pf-ava{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.profcard h4{font-size:19px}
.cred{margin-top:12px;border:1px dashed var(--bronze);border-radius:var(--r-md);padding:13px 15px;background:var(--sand)}
[data-theme="dark"] .cred{background:rgba(255,255,255,.04)}
.cred div{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0}
.cred span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cred b{font-family:var(--font-display);font-size:23px;color:var(--cacao);letter-spacing:.04em}
[data-theme="dark"] .cred b{color:var(--bronze)}
.chatbar button{display:flex;align-items:center;justify-content:center}
.quickrow button span{display:flex;justify-content:center;color:var(--cacao)}
[data-theme="dark"] .quickrow button span{color:var(--bronze)}
h3 .ic-s,h4 .ic-s{color:var(--bronze);vertical-align:-3px}
.modal h3 .ic-s{color:var(--bronze)}
@media (prefers-reduced-motion: reduce){.hero img,.fadein>*{animation:none}}


/* ================= LUXURY LAYER 2 — drawer, top bar, pages ================= */
.screen{padding:18px 18px 48px}
.chatbar{bottom:calc(10px + env(safe-area-inset-bottom))}
.thread{padding-bottom:88px}
.screen{animation:screenIn .32s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.top{margin-bottom:4px}
.whobar{margin:8px 0 18px}
.whobar h2{font-size:27px;line-height:1.15}
.whobar p{font-size:13px;color:var(--muted);margin-top:2px}
.toprow-l{display:flex;align-items:center;gap:9px;min-width:0}
.socialrow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.socialrow::-webkit-scrollbar{display:none}
.socialtop{width:35px;height:35px;color:var(--cacao);text-decoration:none}
[data-theme="dark"] .socialtop{color:var(--bronze)}
/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(22,14,8,.45);backdrop-filter:blur(3px);z-index:var(--z-modal);opacity:0;transition:opacity .24s ease}
.drawer-bg.open{opacity:1}
.drawer{position:absolute;inset-block:0;inset-inline-start:0;width:min(320px,84vw);
  background:linear-gradient(168deg,var(--bg) 0%,var(--sand) 120%);
  display:flex;flex-direction:column;padding:26px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-106%);transition:transform .27s cubic-bezier(.2,.75,.2,1);
  box-shadow:40px 0 90px -35px rgba(0,0,0,.55)}
[dir="rtl"] .drawer{transform:translateX(106%)}
.drawer-bg.open .drawer{transform:none}
[data-theme="dark"] .drawer{background:linear-gradient(168deg,#20180F 0%,#181209 120%)}
.dr-head{display:flex;gap:13px;align-items:center;margin-bottom:24px}
.dr-head .mono.sm{width:47px;height:47px;font-size:23px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F2E3CB;
  box-shadow:0 10px 24px -10px rgba(62,42,30,.6)}
[data-theme="dark"] .dr-head .mono.sm{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.dr-head h3{font-family:var(--font-display);font-size:21px;line-height:1.1}
.dr-head p{font-size:12.5px;color:var(--muted)}
.dr-items{flex:1;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.dr-it{display:flex;align-items:center;gap:13px;padding:13px;border-radius:var(--r-md);font-size:15.5px;
  color:var(--ink);text-align:start;background:transparent;transition:background .15s}
.dr-it:active{background:var(--sand)}
.dr-it.on{background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD;box-shadow:0 10px 24px -12px rgba(62,42,30,.55)}
[data-theme="dark"] .dr-it.on{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.dr-ic{display:flex;color:var(--cacao)}
[data-theme="dark"] .dr-ic{color:var(--bronze)}
.dr-it.on .dr-ic{color:inherit;opacity:.9}
.dr-it .badge{margin-inline-start:auto}
.dr-foot{display:flex;gap:10px;align-items:center;padding-top:16px;border-top:1px solid var(--line)}
.dr-out{margin-inline-start:auto;display:inline-flex;gap:8px;align-items:center;font-size:14px;
  color:var(--muted);padding:10px 15px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card)}
/* luxury login */
.login-wrap{background:radial-gradient(130% 95% at 50% -12%,#5C4030 0%,#3E2A1E 46%,#221610 100%)}
.login-card{background:rgba(255,251,244,.97);border-radius:var(--r-2xl);box-shadow:0 34px 90px -34px rgba(0,0,0,.65)}
.brandmark .mono{width:76px;height:76px;font-size:35px;border:1px solid rgba(217,180,127,.65);
  box-shadow:0 0 0 8px rgba(217,180,127,.13),0 22px 55px -20px rgba(0,0,0,.75)}
.brandmark h1{letter-spacing:.05em}
.brandmark p{letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;opacity:.85}
/* social & reviews page */
.wa-cta{display:flex;gap:11px;align-items:center;justify-content:center;padding:16px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD;text-decoration:none;
  font-size:16px;margin-bottom:20px;box-shadow:0 14px 30px -12px rgba(62,42,30,.55)}
[data-theme="dark"] .wa-cta{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.social-big{display:flex;align-items:center;gap:13px;padding:15px 16px;text-decoration:none;color:var(--ink)}
.sb-ic{width:39px;height:39px;border-radius:var(--r-md);background:var(--sand);display:flex;align-items:center;
  justify-content:center;color:var(--cacao);border:1px solid var(--line);flex:none}
[data-theme="dark"] .sb-ic{color:var(--bronze);background:rgba(255,255,255,.05)}
.sb-ic.star{font-size:19px;color:var(--bronze)}
.sb-nm{font-size:16.5px;font-weight:600}
.sb-go{margin-inline-start:auto;color:var(--muted);transform:rotate(180deg)}
[dir="rtl"] .sb-go{transform:none}
/* team page */
.teamcount{display:flex;align-items:center;gap:15px;padding:16px 18px}
.teamcount b{font-size:36px;color:var(--cacao);line-height:1}
[data-theme="dark"] .teamcount b{color:var(--bronze)}
.teamcount span{font-size:14px;color:var(--muted)}
.team-card{display:flex;gap:14px;align-items:flex-start}
.tc-photo{width:88px;height:106px;border-radius:var(--r-lg);overflow:hidden;flex:none;border:1px solid var(--line);background:var(--sand)}
.tc-photo img{width:100%;height:100%;object-fit:cover}
.tc-photo.sm{width:58px;height:70px;border-radius:var(--r-md)}
.tc-mono{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--bronze);
  background:linear-gradient(150deg,var(--sand),var(--card))}
.tc-body{min-width:0;flex:1}
.tc-body h4{font-size:20px;line-height:1.15}
.tc-pos{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--bronze);margin:3px 0 4px}
.tc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tchip{font-size:12px;padding:4.5px 11px;border-radius:var(--r-pill);background:var(--sand);border:1px solid var(--line);color:var(--muted)}
.team-card .social-a{margin-top:6px}


/* ===== wizard & pickers ===== */
.wz-dots{display:flex;gap:6px;justify-content:center;margin:2px 0 16px}
.wz-dot{width:7px;height:7px;border-radius:var(--r-pill);background:#E4D3BC;transition:all .25s ease}
.wz-dot.done{background:var(--bronze);opacity:.55}
.wz-dot.on{background:var(--bronze);width:22px}
.pickfield{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:15px 16px;border:1px solid #E4D3BC;border-radius:var(--r-md);background:#fff;
  font-size:16.5px;color:#8A7358;text-align:start}
.pickfield b{color:#2B1F16;font-family:var(--font-display);font-size:19px;letter-spacing:.03em}
.pf-ch{display:flex;color:#B98A5C;transform:rotate(180deg)}
[dir="rtl"] .pf-ch{transform:none}
.wz-back{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:14px;color:#8A7358;background:none}
.remrow{display:flex !important;align-items:center;gap:10px;margin:13px 0 2px;font-size:14.5px;
  color:#5A4632;text-transform:none !important;letter-spacing:0 !important}
.remrow input{width:19px !important;height:19px;accent-color:#3E2A1E;margin:0}
.picklist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:44vh;overflow-y:auto;margin:12px 0 6px;padding:2px}
.picklist.one{grid-template-columns:1fr}
.pick-it{padding:13px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  font-size:16px;font-family:var(--font-display);color:var(--ink);transition:background .12s}
.picklist.one .pick-it{font-family:var(--font-body);font-size:15.5px;text-align:start;padding:12px 14px}
.pick-it:active{background:var(--sand)}


/* ===== ticket: choose team member ===== */
.memberrow{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.memberrow::-webkit-scrollbar{display:none}
.memb{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:11px 6px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
  transition:border-color .18s,box-shadow .18s,transform .14s}
.memb:active{transform:scale(.97)}
.memb.on{border-color:var(--bronze);box-shadow:0 0 0 2px rgba(185,138,92,.28),0 12px 24px -14px rgba(62,42,30,.6)}
.mb-av{width:46px;height:46px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F2E3CB;
  font-family:var(--font-display);font-size:19px;flex:none}
[data-theme="dark"] .mb-av{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.mb-av img{width:100%;height:100%;object-fit:cover}
.mb-nm{font-size:11.5px;line-height:1.25;text-align:center;color:var(--ink);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.memb.on .mb-nm{color:var(--cacao);font-weight:600}
[data-theme="dark"] .memb.on .mb-nm{color:var(--bronze)}


/* ===== iPhone / Android home-screen (PWA) safe areas =====
   Keeps the menu, bell and social icons clear of the phone's
   status bar, notch and Dynamic Island in full-screen mode. */
.screen{padding-top:calc(18px + env(safe-area-inset-top))}
.login-wrap{padding-top:calc(28px + env(safe-area-inset-top));
  padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.drawer{padding-top:calc(26px + env(safe-area-inset-top))}
@media (display-mode: standalone), (display-mode: fullscreen){
  .screen{padding-top:calc(14px + max(env(safe-area-inset-top),44px))}
  .login-wrap{padding-top:calc(18px + max(env(safe-area-inset-top),44px))}
  .drawer{padding-top:calc(18px + max(env(safe-area-inset-top),44px))}
  .thread{padding-top:6px}
}
.top{position:relative;z-index:var(--z-sticky)}
.top .iconbtn{min-width:38px;min-height:38px}
.socialtop{min-width:35px;min-height:35px}


/* ===== UNIVERSAL TOP CLEARANCE (all phones, all browsers, PWA or tab) =====
   A guaranteed gap so the menu / bell never hide under the status bar.
   env(safe-area-inset-top) adds extra room on notch / Dynamic Island phones. */
:root{ --topgap: 22px; }
@media (display-mode: standalone), (display-mode: fullscreen){ :root{ --topgap: 30px; } }
.screen{ padding-top: calc(var(--topgap) + env(safe-area-inset-top)) !important; }
.login-wrap{ padding-top: calc(var(--topgap) + 14px + env(safe-area-inset-top)) !important; }
.drawer{ padding-top: calc(var(--topgap) + 10px + env(safe-area-inset-top)) !important; }
.top{ position: relative; z-index:var(--z-sticky); }
.top .iconbtn{ min-width: 40px; min-height: 40px; }


/* ===== export data modal ===== */
.explist{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.exp-it{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:var(--r-md);font-size:15.5px;
  color:var(--ink);text-transform:none;letter-spacing:0;cursor:pointer;transition:background .12s}
.exp-it:active{background:var(--sand)}
.exp-it input{width:20px;height:20px;accent-color:var(--espresso);flex:none;margin:0}
.exp-all{margin-top:6px;border-top:1px solid var(--line);border-radius:0;padding-top:14px;font-weight:600}


/* ===== operation / category browse ===== */
.opgrid{display:flex;flex-direction:column;gap:14px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opcard,.catcard{position:relative;border:none;border-radius:var(--r-xl);overflow:hidden;text-align:start;
  min-height:120px;display:flex;align-items:flex-end;box-shadow:var(--shadow);color:#fff;width:100%}
.catcard{min-height:132px}
.opcard img,.catcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opcard .veil,.catcard .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,20,12,.15) 0%,rgba(30,20,12,.78) 100%)}
.opc-txt{position:relative;padding:15px 16px;z-index:var(--z-base)}
.opc-txt h3{font-family:var(--font-display);font-size:24px;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.opc-txt h4{font-family:var(--font-display);font-size:18px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.opc-txt span{font-size:12.5px;opacity:.9;letter-spacing:.03em}
.opc-go{position:absolute;top:14px;inset-inline-end:14px;z-index:var(--z-base);transform:rotate(180deg);opacity:.85}
[dir="rtl"] .opc-go{transform:none}
.catcard.empty-cat{opacity:.62}
.catcard.empty-cat .opc-txt h4{font-size:17px}
.crumb{display:inline-flex;align-items:center;gap:7px;margin:0 0 12px;font-size:14px;color:var(--cacao);
  background:var(--sand);border:1px solid var(--line);padding:9px 14px;border-radius:var(--r-pill)}
[data-theme="dark"] .crumb{color:var(--bronze)}
select optgroup{font-weight:700;color:var(--cacao)}

/* ===== LUXURY POLISH v3 — chat tools + refinements ===== */
.bubwrap{display:flex;flex-direction:column;margin-bottom:10px}
.bubwrap.me{align-items:flex-end}.bubwrap.them{align-items:flex-start}
.bubwrap .bub{margin-bottom:0}
.bub-tools{display:flex;gap:5px;margin-top:4px;opacity:.5;transition:opacity .15s}
.bubwrap:active .bub-tools,.bub-tools:hover{opacity:1}
.bubtool{width:28px;height:28px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
  background:var(--sand);border:1px solid var(--line);color:var(--muted)}
.bubtool:active{background:var(--card);transform:scale(.94)}
[data-theme="dark"] .bubtool{background:rgba(255,255,255,.05)}
/* richer chat bubbles */
.bub{border-radius:var(--r-xl);padding:11px 15px;font-size:15px;line-height:1.42;max-width:82%;position:relative;box-shadow:0 4px 14px -8px rgba(62,42,30,.35)}
.bub.me{background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD;border-bottom-right-radius:7px}
.bub.them{background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:7px}
[data-theme="dark"] .bub.me{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#241708}
.bub .tm{display:block;font-size:10.5px;opacity:.72;margin-top:4px;letter-spacing:.02em}
/* softer, deeper card & shadow polish */
.card{border-radius:var(--r-xl)}
.stat{border-radius:var(--r-lg)}
.hero,.tk,.opcard,.catcard{box-shadow:0 18px 42px -22px rgba(38,24,14,.55)}
/* pill/badge refinement */
.badge{background:linear-gradient(135deg,#C4553B,#A23D28);box-shadow:0 4px 10px -4px rgba(196,85,59,.6)}
.pill{border-radius:var(--r-pill)}
.chip{border-radius:var(--r-pill);font-weight:600;letter-spacing:.01em}
/* gentle divider under section titles */
.sec>h3{position:relative;padding-bottom:7px}
.sec>h3::after{content:"";position:absolute;left:0;bottom:0;width:34px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--bronze),transparent)}
[dir="rtl"] .sec>h3::after{left:auto;right:0;background:linear-gradient(270deg,var(--bronze),transparent)}
/* buttons: subtle sheen */
.btn:not(.ghost):not(.warn){position:relative;overflow:hidden}
.btn:not(.ghost):not(.warn)::after{content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .6s ease}
.btn:not(.ghost):not(.warn):active::after{transform:translateX(120%)}
/* inputs: refined focus */
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--bronze);box-shadow:0 0 0 3px rgba(185,138,92,.16)}
/* topbar icon polish */
.iconbtn{border-radius:var(--r-md);transition:background .15s,transform .12s}
.iconbtn:active{background:var(--sand);transform:scale(.92)}
.socialtop{border-radius:var(--r-sm);transition:transform .12s,opacity .15s;opacity:.9}
.socialtop:active{transform:scale(.9)}
.socialtop:hover{opacity:1}


/* ===== notifications UI ===== */
.notif-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;margin-bottom:14px;cursor:pointer}
.nt-l{display:flex;align-items:center;gap:13px;min-width:0}
.nt-ic{width:42px;height:42px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
  background:var(--sand);border:1px solid var(--line);color:var(--cacao);flex:none}
[data-theme="dark"] .nt-ic{color:var(--bronze);background:rgba(255,255,255,.05)}
.notif-card b{font-size:15.5px}
.notif-card .mini{margin-top:2px}
.switch{width:48px;height:28px;border-radius:var(--r-pill);background:#D8C7AE;position:relative;flex:none;transition:background .2s}
.switch.on{background:linear-gradient(135deg,var(--espresso),var(--cacao))}
[data-theme="dark"] .switch.on{background:linear-gradient(135deg,var(--bronze),#D9B47F)}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.switch.on .knob{transform:translateX(20px)}
[dir="rtl"] .switch .knob{left:auto;right:3px}
[dir="rtl"] .switch.on .knob{transform:translateX(-20px)}
.iconbtn.on-notif{color:var(--bronze)}


/* ===== team plan / my work day ===== */
.daychips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.daychip{flex:none;min-width:46px;padding:9px 12px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted);position:relative}
.daychip.istoday{border-color:var(--bronze)}
.daychip.on{background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD;border-color:transparent}
[data-theme="dark"] .daychip.on{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.wd-banner{display:flex;align-items:center;gap:11px;padding:15px 16px;border-radius:var(--r-lg);margin-bottom:14px;
  font-size:15.5px;font-weight:600;line-height:1.3}
.wd-banner.off{background:linear-gradient(135deg,#3E7C5A,#2E6347);color:#EAF7EF}
.wd-banner.entrance{background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD}
.wd-banner.makeup{background:var(--sand);color:var(--ink);border:1px solid var(--bronze)}
.wd-banner.dj{background:var(--sand);color:var(--ink);border:1px solid var(--line)}
.daycard{padding:0;overflow:hidden}
.dc-grid{display:grid;grid-template-columns:1fr 1fr}
.dc-cell{padding:14px 16px;border-bottom:1px solid var(--line)}
.dc-cell:nth-child(odd){border-inline-end:1px solid var(--line)}
.dc-cell span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.dc-cell b{font-size:15.5px;color:var(--ink)}
.dc-flag{padding:12px 16px;font-size:13.5px;color:var(--cacao);display:flex;align-items:center;gap:8px;background:var(--sand)}
[data-theme="dark"] .dc-flag{color:var(--bronze)}
.showcard{margin-top:12px;padding:15px 16px}
.sc-row{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.sc-row:not(:last-child){border-bottom:1px solid var(--line)}
.sc-row b{font-size:18px}
.stdcard{padding:6px 0}
.std-row{display:flex;gap:14px;padding:10px 16px;align-items:baseline}
.std-row:not(:last-child){border-bottom:1px solid var(--line)}
.std-t{flex:none;width:52px;font-family:var(--font-display);font-size:15px;color:var(--cacao)}
[data-theme="dark"] .std-t{color:var(--bronze)}
.std-x{min-width:0}
.std-x b{font-size:14.5px;font-weight:600}
/* roster */
.rostercard{padding:4px 0}
.roster-row{display:flex;align-items:center;gap:13px;padding:11px 15px}
.roster-row:not(:last-child){border-bottom:1px solid var(--line)}
.rnum{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:16px;background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F2E3CB}
[data-theme="dark"] .rnum{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.roster-row.off .rnum{background:linear-gradient(135deg,#3E7C5A,#2E6347)}
.roster-row.entrance .rnum{background:linear-gradient(135deg,#B5793C,#8A5A28)}
.rnum img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.rnum{overflow:hidden}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.rinfo b{font-size:15px}
.rstat{flex:none;font-size:12px;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);text-transform:uppercase;letter-spacing:.04em}
.rstat.off{background:#E7F3EB;color:#2E6347}
.rstat.entrance{background:#F2E7D6;color:#8A5A28}
.rstat.working{background:var(--sand);color:var(--muted)}
[data-theme="dark"] .rstat.off{background:rgba(62,124,90,.25);color:#8FD6AC}
[data-theme="dark"] .rstat.entrance{background:rgba(181,121,60,.25);color:#E0B57F}

/* ===== restaurant theme banner (guest program) ===== */
.theme-banner{display:flex;align-items:center;gap:12px;padding:14px 17px;border-radius:var(--r-lg);margin-bottom:14px;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD;box-shadow:0 14px 30px -16px rgba(62,42,30,.55)}
[data-theme="dark"] .theme-banner{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.theme-banner .tb-l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.theme-banner b{font-size:20px;margin-inline-start:auto}

/* ===== grouped menu drawer ===== */
.dr-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);
  padding:14px 14px 6px;font-weight:700;opacity:.75}
.dr-sec:first-child{padding-top:2px}
.dr-items{padding-bottom:6px}

/* ===== photo picker (team accounts) ===== */
.photo-pick{display:flex;align-items:center;gap:14px;margin:6px 0 14px;padding:12px;border:1px dashed var(--line);border-radius:var(--r-lg)}
.photo-box{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;cursor:pointer;
  background:linear-gradient(135deg,var(--sand),var(--card));display:flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid var(--line);position:relative}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box.uploading::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.6);
  background-image:radial-gradient(circle at center,var(--cacao) 2px,transparent 3px);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.pp-txt b{font-size:14.5px;display:block}
.pp-txt .mini{margin-top:2px}

/* ===== team account rows with avatar ===== */
.acct-row{display:flex;align-items:center;gap:12px;padding:11px 4px}
.acct-row:not(:last-child){border-bottom:1px solid var(--line)}
.acct-av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;position:relative;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F2E3CB;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:18px}
[data-theme="dark"] .acct-av{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.acct-av img{width:100%;height:100%;object-fit:cover}
.acct-num{position:absolute;bottom:-2px;right:-2px;width:19px;height:19px;border-radius:50%;
  background:var(--bg);color:var(--cacao);font-family:var(--font-body);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
[data-theme="dark"] .acct-num{color:var(--bronze)}
.acct-info{flex:1;min-width:0;display:flex;flex-direction:column}
.acct-info b{font-size:15px}

/* ===== PROFESSIONAL POLISH v4 ===== */
/* softer, more premium cards and depth */
.card{border-radius:var(--r-xl);box-shadow:0 2px 8px -4px rgba(38,24,14,.10),0 12px 30px -18px rgba(38,24,14,.22)}
.opcard,.catcard{border-radius:var(--r-2xl)}
.stat{border-radius:var(--r-xl);box-shadow:0 2px 10px -5px rgba(38,24,14,.14)}
.wd-banner{box-shadow:0 12px 30px -16px rgba(38,24,14,.4)}
/* clearer section headings */
.sec{margin-bottom:22px}
.sec>h3{font-size:16.5px;letter-spacing:-.01em;margin-bottom:12px}
/* refined day chips */
.daychip{transition:transform .12s,background .18s,color .18s}
.daychip:active{transform:scale(.94)}
.daychip.on{box-shadow:0 8px 20px -10px rgba(62,42,30,.5)}
/* smoother screen transitions */
.screen{animation:screenUp .34s cubic-bezier(.2,.7,.2,1)}
@keyframes screenUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* premium top bar */
.whobar h2{letter-spacing:-.02em}
/* buttons: crisper */
.btn{border-radius:var(--r-md);font-weight:600;letter-spacing:.01em;transition:transform .12s,box-shadow .2s,opacity .2s}
.btn:not(.ghost):not(.warn){box-shadow:0 8px 20px -10px rgba(62,42,30,.5)}
.btn:active{transform:translateY(1px)}
/* inputs: softer */
input,textarea,select{border-radius:var(--r-md);transition:border-color .15s,box-shadow .15s}
/* modal refinement */
.modal{border-radius:var(--r-2xl)}
/* activity cards a touch more elegant */
.act{border-radius:var(--r-xl)}
/* nicer empty states */
.empty{opacity:.85}
.empty .big{opacity:.5}
/* pills */
.pill{font-weight:600;letter-spacing:.02em}
/* gentle hover lift on desktop */
@media(hover:hover){
  .card:hover{box-shadow:0 4px 14px -6px rgba(38,24,14,.16),0 18px 40px -20px rgba(38,24,14,.28)}
  .opcard:hover,.catcard:hover{transform:translateY(-2px)}
  .dr-it:hover{background:var(--sand)}
}

/* ===== staff bus schedule ===== */
.bus-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:520px){.bus-grid{grid-template-columns:1fr 1fr}}
.bus-col{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;
  box-shadow:0 2px 8px -4px rgba(38,24,14,.10),0 12px 30px -18px rgba(38,24,14,.22)}
.bus-col-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bus-col-head b{font-size:15.5px;letter-spacing:-.01em}
.bus-ic{width:40px;height:40px;border-radius:var(--r-md);flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F2E3CB}
[data-theme="dark"] .bus-ic{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.bus-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.bus-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r-md);
  background:var(--sand);border:1px solid var(--line)}
.bus-row[data-busedit]{cursor:pointer}
.bus-time{font-family:var(--font-display);font-size:18px;color:var(--ink);flex:none;min-width:58px}
.bus-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bus-note{font-size:12.5px;color:var(--muted)}
.bus-next{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--cacao)}
[data-theme="dark"] .bus-next{color:var(--bronze)}
.bus-go{flex:none;color:var(--muted);opacity:.6}
.bus-row.next{background:linear-gradient(135deg,var(--espresso),var(--cacao));border-color:transparent;
  box-shadow:0 8px 20px -10px rgba(62,42,30,.5)}
.bus-row.next .bus-time{color:#F6ECDD}
.bus-row.next .bus-note{color:rgba(246,236,221,.8)}
.bus-row.next .bus-next{color:rgba(246,236,221,.9)}
.bus-row.next .bus-go{color:rgba(246,236,221,.8);opacity:1}
[data-theme="dark"] .bus-row.next{background:linear-gradient(135deg,var(--bronze),#D9B47F)}
[data-theme="dark"] .bus-row.next .bus-time{color:#221708}
[data-theme="dark"] .bus-row.next .bus-note,[data-theme="dark"] .bus-row.next .bus-next{color:rgba(34,23,8,.75)}
.bus-add{width:100%;justify-content:center;margin-top:2px}
.bus-empty{padding:6px 0}

/* ===== settings hub ===== */
.hub-list{display:flex;flex-direction:column;gap:10px}
.hub-it{display:flex;align-items:center;gap:14px;width:100%;text-align:start;
  padding:16px 16px;border-radius:var(--r-xl);background:var(--card);border:1px solid var(--line);
  box-shadow:0 2px 8px -4px rgba(38,24,14,.10),0 12px 30px -18px rgba(38,24,14,.22);
  color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .2s}
.hub-it:active{transform:scale(.99)}
@media(hover:hover){.hub-it:hover{box-shadow:0 4px 14px -6px rgba(38,24,14,.16),0 18px 40px -20px rgba(38,24,14,.28);transform:translateY(-1px)}}
.hub-ic{width:46px;height:46px;border-radius:var(--r-md);flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F2E3CB}
[data-theme="dark"] .hub-ic{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.hub-lb{flex:1;min-width:0}
.hub-go{flex:none;color:var(--muted);transform:scaleX(-1);opacity:.5}
[dir="rtl"] .hub-go{transform:none}

/* ===== activity status dots ===== */
.stat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:8px;
  vertical-align:middle;position:relative;top:-1px;flex:none}
/* YELLOW = not started yet · GREEN = happening now · RED = finished */
.stat-dot.todo{background:#E5A100;box-shadow:0 0 0 3px rgba(229,161,0,.18)}
.stat-dot.live{background:#3E9B5F;box-shadow:0 0 0 3px rgba(62,155,95,.18);animation:dotPulse 1.4s ease-in-out infinite}
.stat-dot.done{background:#C0392B;box-shadow:0 0 0 3px rgba(192,57,43,.14)}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 3px rgba(62,155,95,.20)}50%{box-shadow:0 0 0 7px rgba(62,155,95,.04)}}

/* ===== status RING around a whole card (guest booking) ===== */
.ring-todo{border-color:#E5A100 !important;box-shadow:0 0 0 2px rgba(229,161,0,.20),var(--sh-2) !important}
.ring-live{border-color:#3E9B5F !important;box-shadow:0 0 0 2px rgba(62,155,95,.28),var(--sh-2) !important}
.ring-done{border-color:#C0392B !important;box-shadow:0 0 0 2px rgba(192,57,43,.18) !important;opacity:.8}
/* ring around a photo / avatar (entertainer) */
.avring{position:relative;border-radius:50%}
.avring.ring-todo{outline:3px solid #E5A100;outline-offset:2px;box-shadow:none !important;border-color:transparent !important}
.avring.ring-live{outline:3px solid #3E9B5F;outline-offset:2px;box-shadow:none !important;border-color:transparent !important;animation:avPulse 1.6s ease-in-out infinite}
.avring.ring-done{outline:3px solid #C0392B;outline-offset:2px;box-shadow:none !important;border-color:transparent !important;opacity:.85}
@keyframes avPulse{0%,100%{outline-color:#3E9B5F}50%{outline-color:rgba(62,155,95,.45)}}
/* the small status word */
.stat-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r-pill);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat-pill.todo{background:rgba(229,161,0,.15);color:#8A6212}
.stat-pill.live{background:rgba(62,155,95,.16);color:#2E6347}
.stat-pill.done{background:rgba(192,57,43,.13);color:#8E2C22}
[data-theme="dark"] .stat-pill.todo{background:rgba(229,161,0,.22);color:#F0C97A}
[data-theme="dark"] .stat-pill.live{background:rgba(62,155,95,.24);color:#8FD6AC}
[data-theme="dark"] .stat-pill.done{background:rgba(192,57,43,.24);color:#F0A79C}
/* status legend */
.stat-legend{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 14px;padding:11px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md)}
.stat-legend span{display:flex;align-items:center;font-size:12.5px;color:var(--muted)}
.stat-legend .stat-dot{margin-inline-end:6px}

/* ===== skeleton loading ===== */
.skel-wrap{padding:calc(var(--topgap,18px) + 18px) 16px 20px;display:flex;flex-direction:column;gap:14px}
.skel{background:linear-gradient(100deg,var(--sand) 30%,rgba(255,255,255,.55) 50%,var(--sand) 70%);
  background-size:220% 100%;animation:shimmer 1.5s linear infinite;border-radius:var(--r-lg)}
[data-theme="dark"] .skel{background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.05) 70%);background-size:220% 100%}
.skel-bar{height:38px;width:46%;border-radius:var(--r-md)}
.skel-title{height:26px;width:66%;border-radius:var(--r-sm)}
.skel-card{height:104px;border-radius:var(--r-xl)}
@keyframes shimmer{from{background-position:180% 0}to{background-position:-40% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}

/* ===== toast types ===== */
.toast{display:flex;align-items:center;gap:10px;transition:opacity .25s,transform .25s}
.toast .t-ic{display:flex;flex:none}
.toast.out{opacity:0;transform:translateY(8px)}
.toast.t-success .t-ic{color:#7BD4A0}
.toast.t-error{background:#8E2C22;color:#FDECEA}
.toast.t-error .t-ic{color:#FFC9C2}
.toast.t-warn{background:#8A6212;color:#FFF3DC}
.toast.t-warn .t-ic{color:#FFD98A}
.toast.t-info .t-ic{color:#C9DCF5}

/* ===== confirmation dialog ===== */
.confirm-bg{align-items:center;justify-content:center;padding:20px}
.confirm-modal{max-width:380px;border-radius:var(--r-2xl);text-align:center;padding:26px 22px 20px;animation:cfIn .22s cubic-bezier(.2,.7,.2,1)}
@keyframes cfIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.cf-ic{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  background:var(--sand);color:var(--cacao)}
.cf-ic.danger{background:rgba(192,57,43,.12);color:#C0392B}
.confirm-modal h3{margin:0 0 6px;font-size:19px}
.cf-sub{margin:0 0 20px}
.cf-row{display:flex;gap:10px}
.cf-row .btn{flex:1;margin:0}

/* ===== connection banner ===== */
.conn-banner{position:fixed;left:0;right:0;top:0;z-index:var(--z-banner);padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
  text-align:center;font-size:13px;font-weight:600;letter-spacing:.01em;animation:cbIn .25s ease}
.conn-banner.off{background:#8E2C22;color:#FDECEA}
.conn-banner.on{background:#2E6347;color:#EAF7EF}
@keyframes cbIn{from{transform:translateY(-100%)}to{transform:none}}

/* ===== manager: real tablet & desktop layout (guests/staff stay mobile-first) ===== */
@media(min-width:900px){
  [data-approle="manager"] .app{max-width:1080px;padding-inline:10px}
  [data-approle="manager"] .modal{max-width:640px;border-radius:var(--r-2xl)}
  [data-approle="manager"] .chatbar{max-width:1080px}
  /* two/three column grids where it helps */
  [data-approle="manager"] .opgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  [data-approle="manager"] .catgrid{grid-template-columns:repeat(3,1fr)}
  [data-approle="manager"] .hub-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  [data-approle="manager"] .bus-grid{grid-template-columns:1fr 1fr}
  [data-approle="manager"] .rostercard{columns:2;column-gap:0}
  [data-approle="manager"] .roster-row{break-inside:avoid}
  [data-approle="manager"] .whobar h2{font-size:30px}
}
@media(min-width:1280px){
  [data-approle="manager"] .app{max-width:1240px}
  [data-approle="manager"] .opgrid{grid-template-columns:repeat(3,1fr)}
  [data-approle="manager"] .hub-list{grid-template-columns:repeat(3,1fr)}
}
/* tablet: give the manager a bit more room already */
@media(min-width:700px) and (max-width:899px){
  [data-approle="manager"] .app{max-width:720px}
  [data-approle="manager"] .bus-grid{grid-template-columns:1fr 1fr}
}

/* ================= TYPOGRAPHY HIERARCHY ================= */
/* one clear scale — display serif for headings, Jost for body */
.h1,.type-h1{font-family:var(--font-display);font-size:var(--fs-h1);line-height:var(--lh-tight);
  letter-spacing:-.02em;font-weight:600;color:var(--ink)}
.h2,.type-h2{font-family:var(--font-display);font-size:var(--fs-h2);line-height:var(--lh-tight);
  letter-spacing:-.015em;font-weight:600;color:var(--ink)}
.h3,.type-h3{font-size:var(--fs-h3);line-height:1.25;letter-spacing:-.01em;font-weight:600;color:var(--ink)}
.h4,.type-h4{font-size:var(--fs-h4);line-height:1.3;font-weight:600;color:var(--ink)}
.type-body{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink)}
.type-label{font-size:var(--fs-label);font-weight:600;color:var(--ink)}
.type-caption{font-size:var(--fs-caption);color:var(--muted);line-height:1.4}
.type-meta{font-size:var(--fs-meta);text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;color:var(--muted)}
/* accessible focus ring — visible for keyboard users everywhere */
:where(button,a,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--bronze);outline-offset:2px;border-radius:var(--r-xs)}
/* minimum touch target */
button,.btn,.iconbtn{min-height:44px}
.btn.sm{min-height:36px}
/* respect reduced motion globally */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}
/* RTL icon mirroring for directional icons only */
[dir="rtl"] .hub-go svg,[dir="rtl"] .opc-go svg,[dir="rtl"] .crumb svg{transform:scaleX(-1)}

/* ===== events + practice on the work-day page ===== */
.evcard,.prcard{padding:4px 0}
.ev-row,.pr-row{display:flex;gap:14px;padding:12px 16px;align-items:flex-start}
.ev-row:not(:last-child),.pr-row:not(:last-child){border-bottom:1px solid var(--line)}
.ev-time{flex:none;min-width:56px;font-family:var(--font-display);font-size:16px;color:var(--cacao)}
[data-theme="dark"] .ev-time{color:var(--bronze)}
.ev-mid,.pr-mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-mid b{font-size:15px;font-weight:600}
.pr-time{flex:none;min-width:118px;font-size:12.5px;font-weight:700;color:var(--cacao);padding-top:2px}
[data-theme="dark"] .pr-time{color:var(--bronze)}
.pr-mid b{font-size:15px;font-weight:600}
.pr-row.mine{background:var(--sand)}

/* ===== work-day photo header with status ring ===== */
.wd-photo{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:14px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-2)}
.wd-av{width:62px;height:62px;border-radius:50%;flex:none;position:relative;overflow:visible;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F2E3CB;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:24px}
[data-theme="dark"] .wd-av{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.wd-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.wd-num{position:absolute;bottom:-3px;right:-3px;width:23px;height:23px;border-radius:50%;
  background:var(--bg);color:var(--cacao);font-family:var(--font-body);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
[data-theme="dark"] .wd-num{color:var(--bronze)}
.wd-who{min-width:0;display:flex;flex-direction:column;gap:1px}
.wd-who b{font-size:17px}

/* ===== theme picker ===== */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);cursor:pointer;
  transition:transform var(--dur-fast),box-shadow var(--dur-base)}
.theme-card.on{border-color:var(--bronze);box-shadow:0 0 0 2px var(--bronze) inset}
.theme-card:active{transform:scale(.98)}
.tc-sw{display:flex;gap:5px}
.tc-sw i{width:22px;height:22px;border-radius:50%;display:block}
.tc-lb{font-size:13px;font-weight:600;color:var(--ink);text-align:start}

/* ===== daily quiz ===== */
.quizcard{padding:18px 16px}
.quiz-q{font-family:var(--font-display);font-size:21px;line-height:1.3;margin:6px 0 4px;color:var(--ink)}
.quiz-done{display:flex;align-items:flex-start;gap:11px;margin-top:14px;padding:13px 14px;border-radius:var(--r-md);
  background:rgba(62,155,95,.12);color:var(--ink)}
.quiz-done b{display:block;font-size:14.5px}
.qr-card{padding:2px 0}
.qr-row{display:flex;flex-direction:column;gap:3px;padding:11px 15px}
.qr-row:not(:last-child){border-bottom:1px solid var(--line)}
.qr-who{font-size:12.5px;font-weight:700;color:var(--cacao);text-transform:uppercase;letter-spacing:.05em}
[data-theme="dark"] .qr-who{color:var(--bronze)}
.qr-ans{font-size:15px;color:var(--ink)}

/* ===== back / forward navigation ===== */
.navbtn{transition:opacity var(--dur-base)}
.navbtn.fwd svg{transform:scaleX(-1)}
[dir="rtl"] .navbtn svg{transform:scaleX(-1)}
[dir="rtl"] .navbtn.fwd svg{transform:none}
.navbtn[disabled]{opacity:.28;pointer-events:none}
.toprow-l{gap:2px}

/* ===== team summary ===== */
.tsum{padding:16px;margin-bottom:12px}
.ts-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ts-big{display:flex;flex-direction:column;line-height:1}
.ts-big b{font-family:var(--font-display);font-size:34px;color:var(--ink)}
.ts-big .mini{margin-top:3px}
.ts-gen{display:flex;gap:7px;flex-wrap:wrap;margin-inline-start:auto}
.ts-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--r-pill);
  background:var(--sand);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink)}
.ts-chip.m{background:rgba(62,110,155,.14);border-color:transparent}
.ts-chip.f{background:rgba(170,80,130,.14);border-color:transparent}
.ts-nat{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.ts-nats{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}

/* ===== duty totals + editor ===== */
.dutybar{padding:15px 16px;margin-bottom:14px}
.db-nums{display:flex;gap:10px}
.db-n{flex:1;text-align:center;padding:10px 6px;border-radius:var(--r-md);background:var(--sand);border:1px solid var(--line)}
.db-n b{display:block;font-family:var(--font-display);font-size:26px;line-height:1;color:var(--ink)}
.db-n .mini{display:block;margin-top:3px}
.db-n.ok{background:rgba(62,155,95,.13);border-color:transparent}
.db-n.off{background:rgba(192,57,43,.11);border-color:transparent}
.db-meta{display:flex;flex-direction:column;gap:3px;margin:12px 0 10px}
.db-tag{align-self:flex-start;margin-top:3px;padding:3px 10px;border-radius:var(--r-pill);
  background:var(--bronze);color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dutybar .btn{width:100%;margin:0}
.duty-list{display:flex;flex-direction:column;gap:6px;max-height:250px;overflow-y:auto;
  border:1px solid var(--line);border-radius:var(--r-md);padding:8px}
.duty-it{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:var(--r-sm);cursor:pointer;
  text-transform:none;font-size:15px;color:var(--ink);letter-spacing:0}
.duty-it:active{background:var(--sand)}
.duty-it input{width:auto;margin:0;flex:none}
.duty-n{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F2E3CB;
  font-family:var(--font-display);font-size:13px}
[data-theme="dark"] .duty-n{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.duty-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== monthly attendance ===== */
.att-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.att-month{font-family:var(--font-display);font-size:21px;color:var(--ink)}
.att-next svg{transform:scaleX(-1)}
[dir="rtl"] .att-head .iconbtn svg{transform:scaleX(-1)}
[dir="rtl"] .att-next svg{transform:none}
.att-legend{margin:0 0 12px}
.att-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--card)}
.att-table{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
.att-table th,.att-table td{padding:0;text-align:center}
.att-table thead th{position:sticky;top:0;background:var(--sand);color:var(--muted);
  font-size:10.5px;font-weight:700;padding:6px 0;min-width:30px;border-bottom:1px solid var(--line)}
.att-table thead th span{display:block;font-size:8.5px;opacity:.7;font-weight:600}
.att-table thead th.we{color:var(--cacao)}
.att-table thead th.td{background:var(--bronze);color:#fff}
.att-name{position:sticky;left:0;z-index:2;background:var(--card);text-align:start !important;
  padding:7px 11px !important;min-width:132px;border-inline-end:1px solid var(--line)}
[dir="rtl"] .att-name{left:auto;right:0}
.att-name b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.att-table tbody tr:not(:last-child) td,.att-table tbody tr:not(:last-child) th{border-bottom:1px solid var(--line)}
.att-c{width:30px;height:32px;border:0;background:transparent;font-size:12px;font-weight:700;
  color:var(--ink);cursor:pointer;min-height:0;border-radius:0}
.att-c.auto{opacity:.42;font-weight:600}
.att-c.s-P{color:#2E6347}
.att-c.s-O{color:#8A6212}
.att-c.s-A{color:#8E2C22}
.att-c.man.s-P{background:rgba(62,155,95,.16)}
.att-c.man.s-O{background:rgba(229,161,0,.18)}
.att-c.man.s-A{background:rgba(192,57,43,.16)}
.att-c:active{transform:scale(.9)}
.att-tot{min-width:32px;font-weight:700;background:var(--sand)}
.att-tot .s-P{color:#2E6347}.att-tot .s-O{color:#8A6212}.att-tot .s-A{color:#8E2C22}
[data-theme="dark"] .att-c.s-P{color:#8FD6AC}
[data-theme="dark"] .att-c.s-O{color:#F0C97A}
[data-theme="dark"] .att-c.s-A{color:#F0A79C}
[data-theme="dark"] .att-tot .s-P{color:#8FD6AC}
[data-theme="dark"] .att-tot .s-O{color:#F0C97A}
[data-theme="dark"] .att-tot .s-A{color:#F0A79C}

/* ===== attendance month totals ===== */
.attsum{padding:14px 16px;margin-bottom:12px}
.as-row{display:flex;gap:10px;margin-top:9px}
.as-n{flex:1;text-align:center;padding:11px 6px;border-radius:var(--r-md);background:var(--sand);border:1px solid var(--line)}
.as-n b{display:block;font-family:var(--font-display);font-size:26px;line-height:1;color:var(--ink)}
.as-n.p{background:rgba(62,155,95,.14);border-color:transparent}
.as-n.o{background:rgba(229,161,0,.14);border-color:transparent}
.as-n.a{background:rgba(192,57,43,.11);border-color:transparent}

/* ===== attention panel ===== */
.attn{padding:15px 16px;margin-bottom:14px}
.attn.ok{display:flex;align-items:center;gap:11px;color:var(--ink)}
.attn-ic{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(62,155,95,.15);color:#2E6347}
.attn-list{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.attn-it{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:11px 13px;
  border-radius:var(--r-md);border:1px solid var(--line);background:var(--sand);cursor:pointer;color:var(--ink)}
.attn-it.bad{background:rgba(192,57,43,.10);border-color:transparent}
.attn-it.warn{background:rgba(229,161,0,.13);border-color:transparent}
.attn-n{flex:none;min-width:30px;font-family:var(--font-display);font-size:22px;line-height:1}
.attn-lb{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.attn-go{flex:none;opacity:.5;transform:scaleX(-1)}
[dir="rtl"] .attn-go{transform:none}
/* ===== trends ===== */
.trend{padding:15px 16px}
.tr-bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}
.tr-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.tr-b span{display:block;width:100%;min-height:3px;border-radius:var(--r-xs) var(--r-xs) 0 0;
  background:linear-gradient(180deg,var(--cacao),var(--espresso))}
[data-theme="dark"] .tr-b span{background:linear-gradient(180deg,#D9B47F,var(--bronze))}
.tr-b i{font-style:normal;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.tr-b u{text-decoration:none;font-size:11px;color:var(--ink);font-weight:700}
.tr-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;gap:12px}
.tr-row:not(:last-child){border-bottom:1px solid var(--line)}
.tr-row b{font-size:14.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-row span{flex:none;font-weight:700;color:var(--cacao)}
[data-theme="dark"] .tr-row span{color:var(--bronze)}
/* ===== hotel info ===== */
.infocard{padding:2px 0}
.info-row{display:flex;align-items:center;gap:12px;padding:13px 16px}
.info-row:not(:last-child){border-bottom:1px solid var(--line)}
.info-row[data-infoedit]{cursor:pointer}
.info-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.info-mid b{font-size:15px}
.info-mid span{font-size:14px;color:var(--muted);white-space:pre-wrap}
.info-go{flex:none;color:var(--muted);opacity:.55}
/* ===== photo gallery ===== */
.photogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.photogrid{grid-template-columns:repeat(3,1fr)}}
.photo-it{margin:0;position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--sh-2)}
.photo-it img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photo-it figcaption{padding:8px 10px;font-size:12.5px;color:var(--ink)}
.ph-del{position:absolute;top:7px;right:7px;width:30px;height:30px;min-height:0;padding:0;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;border:0;display:flex;align-items:center;justify-content:center}
[dir="rtl"] .ph-del{right:auto;left:7px}
/* ===== my page (entertainer) ===== */
.ms-strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.ms-d{width:22px;height:22px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;background:var(--sand);color:var(--muted)}
.ms-d.s-P{background:rgba(62,155,95,.16);color:#2E6347}
.ms-d.s-O{background:rgba(229,161,0,.18);color:#8A6212}
.ms-d.s-A{background:rgba(192,57,43,.16);color:#8E2C22}
.mf-top{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mf-avg{font-family:var(--font-display);font-size:30px;color:var(--ink)}
.mf-row{display:flex;flex-direction:column;gap:2px;padding:10px 0}
.mf-row:not(:last-child){border-bottom:1px solid var(--line)}
.mf-rate{color:var(--bronze);font-size:13px;letter-spacing:1px}
.mf-c{font-size:14.5px;color:var(--ink)}
/* ===== staff requests ===== */
.sr-row{display:flex;align-items:flex-start;gap:12px;padding:12px 2px}
.sr-row:not(:last-child){border-bottom:1px solid var(--line)}
.sr-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sr-mid b{font-size:14.5px}
.sr-mid span{font-size:13.5px;color:var(--ink)}
.sr-reply{color:var(--cacao) !important}
[data-theme="dark"] .sr-reply{color:var(--bronze) !important}
.sr-acts{flex:none;display:flex;flex-direction:column;gap:6px}
.sr-acts .btn{margin:0}
.sr-st{flex:none;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);
  text-transform:uppercase;letter-spacing:.05em;background:var(--sand);color:var(--muted)}
.sr-st.st-ok{background:rgba(62,155,95,.16);color:#2E6347}
.sr-st.st-no{background:rgba(192,57,43,.14);color:#8E2C22}

/* ===== guest quick rating ===== */
.ratecard{padding:16px;margin-bottom:14px;text-align:center}
.ratecard b{font-size:16px;display:block;margin-bottom:10px}
.rate-stars{display:flex;justify-content:center;gap:6px}
.rs{background:transparent;border:0;padding:6px;min-height:0;color:var(--line);cursor:pointer;
  transition:color var(--dur-fast),transform var(--dur-fast)}
.rs:hover,.rs:active{color:var(--bronze);transform:scale(1.12)}

/* ===== QR ===== */
.qrcard{padding:20px;text-align:center}
.qr-img{width:100%;max-width:280px;border-radius:var(--r-md)}
.qr-url{margin-top:12px;word-break:break-all}

/* ===== font scale ===== */
html{font-size:calc(16px * var(--fscale,1))}
/* ===== logo ===== */
.mono.haslogo{padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mono.haslogo img{width:100%;height:100%;object-fit:contain;padding:8px}
/* ===== inactive account tag ===== */
.off-tag{display:inline-block;margin-inline-start:6px;padding:2px 8px;border-radius:var(--r-pill);
  background:rgba(192,57,43,.14);color:#8E2C22;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
[data-theme="dark"] .off-tag{background:rgba(192,57,43,.24);color:#F0A79C}
/* ===== new password ===== */
.newpass{margin:14px 0 8px;padding:16px;border-radius:var(--r-lg);background:var(--sand);
  border:1px dashed var(--bronze);text-align:center;font-family:var(--font-display);
  font-size:30px;letter-spacing:2px;color:var(--ink);user-select:all}
/* ===== theme preview ===== */
.tp-demo{margin:14px 0;padding:16px;border-radius:var(--r-lg);background:var(--bg);border:1px solid var(--line)}
.tp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
  display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh-2)}
.tp-card b{font-family:var(--font-display);font-size:19px;color:var(--ink)}
.tp-btn{align-self:flex-start;margin-top:8px;padding:8px 16px;border-radius:var(--btn-radius,14px);
  background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD;font-size:13px;font-weight:600}
[data-theme="dark"] .tp-btn{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
/* ===== feature switches ===== */
.feat-list{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);
  border-radius:var(--r-md);padding:10px}
.feat-it{display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px;
  color:var(--ink);letter-spacing:0;cursor:pointer;padding:4px 2px}
.feat-it input{width:auto;margin:0;flex:none}

/* future days in attendance */
.att-c.future{color:var(--line);cursor:default;display:flex;align-items:center;justify-content:center;height:32px}
.ms-d.future{background:transparent;color:var(--line);border:1px dashed var(--line)}

/* ===== hotel info cards ===== */
.infogrid{display:flex;flex-direction:column;gap:12px}
.info-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);
  overflow:hidden;box-shadow:var(--sh-2)}
.info-card[data-infoedit]{cursor:pointer}
.info-img{width:100%;height:130px;object-fit:cover;display:block}
.info-body{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.info-body b{font-size:16.5px;color:var(--ink)}
.info-val{font-size:14.5px;color:var(--ink);white-space:pre-wrap}
.info-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px}
.info-meta span{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.info-card .info-go{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;opacity:1}
[dir="rtl"] .info-card .info-go{right:auto;left:10px}
@media(min-width:620px){.infogrid{display:grid;grid-template-columns:1fr 1fr}}

/* ===== chat translation ===== */
.tr-line{display:block;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.22);
  font-size:14px;line-height:1.4;opacity:.95}
.bub.them .tr-line{border-top-color:var(--line)}
.tr-line i{display:block;font-style:normal;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.08em;opacity:.7;margin-bottom:3px}
.tr-line.loading{opacity:.6}
.tr-btn{background:transparent;border:0;padding:4px 6px;min-height:0;margin-top:2px;
  font-size:11.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.tr-btn:active{opacity:.6}

/* ===== menu builder ===== */
.bd-roles{display:flex;gap:8px;margin-bottom:12px}
.bd-role{flex:1;padding:10px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted)}
.bd-role.on{background:linear-gradient(135deg,var(--espresso),var(--cacao));color:#F6ECDD;border-color:transparent}
[data-theme="dark"] .bd-role.on{background:linear-gradient(135deg,var(--bronze),#D9B47F);color:#221708}
.bd-list{padding:2px 0}
.bd-it{display:flex;align-items:center;gap:11px;padding:10px 13px}
.bd-it:not(:last-child){border-bottom:1px solid var(--line)}
.bd-it.off{opacity:.45}
.bd-ic{flex:none;width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;
  justify-content:center;background:var(--sand);color:var(--cacao)}
[data-theme="dark"] .bd-ic{color:var(--bronze)}
.bd-nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-nm i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400;margin-inline-start:6px}
.bd-acts{flex:none;display:flex;gap:3px}
.bd-b{width:32px;height:32px;min-height:0;padding:0;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center}
.bd-b.down svg{transform:rotate(-90deg)}
.bd-b:not(.down) svg{transform:rotate(90deg)}
.bd-b[data-bdname] svg,.bd-b[data-bdhide] svg,.bd-b.warn svg{transform:none !important}
.bd-b.on{color:var(--cacao);border-color:var(--bronze)}
.bd-b.warn{color:#8E2C22}
.bd-b[disabled]{opacity:.3}

/* ===== weather ===== */
.wnow{display:flex;align-items:center;gap:16px;padding:20px 18px}
.wn-ic{flex:none;color:var(--cacao)}
[data-theme="dark"] .wn-ic{color:var(--bronze)}
.wn-mid{display:flex;flex-direction:column;gap:2px;min-width:0}
.wn-t{font-family:var(--font-display);font-size:44px;line-height:1;color:var(--ink)}
.wn-mid span{font-size:14.5px;color:var(--ink)}
.wweek{padding:2px 0}
.ww-row{display:flex;align-items:center;gap:11px;padding:11px 15px}
.ww-row:not(:last-child){border-bottom:1px solid var(--line)}
.ww-d{flex:none;min-width:52px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ww-i{flex:none;color:var(--cacao);display:flex}
[data-theme="dark"] .ww-i{color:var(--bronze)}
.ww-x{flex:1;min-width:0;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ww-t{flex:none;font-size:15px}
.ww-t b{color:var(--ink)}
.ww-t i{font-style:normal;color:var(--muted);font-size:13px;margin-inline-start:5px}
.wstrip{display:flex;align-items:center;gap:11px;width:100%;padding:12px 15px;margin-bottom:14px;
  border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);box-shadow:var(--sh-2);color:var(--ink)}
.ws-ic{flex:none;color:var(--cacao);display:flex}
[data-theme="dark"] .ws-ic{color:var(--bronze)}
.ws-t{font-family:var(--font-display);font-size:22px}
.ws-x{flex:1;min-width:0;font-size:13.5px;color:var(--muted);text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-go{flex:none;opacity:.45;transform:scaleX(-1)}
[dir="rtl"] .ws-go{transform:none}

/* ===== settings hub (category pages) ===== */
.set-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);
  font-weight:700;padding:16px 4px 7px}
.set-sec:first-of-type{padding-top:0}
.set-list{padding:2px 0;margin-bottom:4px}
.set-it{display:flex;align-items:center;gap:13px;width:100%;text-align:start;padding:13px 15px;
  background:transparent;border:0;color:var(--ink);cursor:pointer}
.set-it:not(:last-child){border-bottom:1px solid var(--line)}
.set-it:active{background:var(--sand)}
.set-ic{flex:none;width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;
  justify-content:center;background:var(--sand);color:var(--cacao)}
[data-theme="dark"] .set-ic{color:var(--bronze);background:rgba(255,255,255,.06)}
.set-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set-mid b{font-size:15.5px;font-weight:600}
.set-go{flex:none;color:var(--muted);opacity:.5;transform:scaleX(-1)}
[dir="rtl"] .set-go{transform:none}

/* ===== multiple times ===== */
.time-row{display:flex;gap:8px;margin-bottom:8px}
.time-row input{margin:0}
.time-row .btn{margin:0;flex:none}
/* ===== guest CRM ===== */
.crm-row{display:flex;align-items:center;gap:12px;padding:11px 4px;cursor:pointer}
.crm-row:not(:last-child){border-bottom:1px solid var(--line)}
.crm-av{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
